}

/* 事件选项：需求不足时置灰并标出缺口 */

}

/* ---------------- 传送阵（召唤） ---------------- */
.summon-panel {
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;

}
.summon-circle {
    position: relative; width: 112px; height: 112px; flex: 0 0 112px;

}
.summon-circle span { font-size: 2rem; color: var(--accent-2); }

.hint { font-size: .72rem; color: var(--text-dim); line-height: 1.55; }
.center { text-align: center; }
.mt6 { margin-top: 6px; } .mt10 { margin-top: 10px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ---------------- 响应式 ---------------- */
@media (max-width: 1240px) {
    .main-layout { flex-wrap: wrap; overflow-y: auto; }
    .sidebar { flex: 0 0 260px; }
    .log-panel { flex: 1 1 240px; }

@media (max-width: 900px) {
    html, body { overflow: auto; }
    #app { height: auto; min-height: 100vh; }

    .topbar-stats { order: 3; width: 100%; }
    .card-grid { grid-template-columns: 1fr; }
    .log-list { max-height: 220px; }
}

<script>
/* ===== js/config/eras.js ===== */
/* 时代：按已达成的里程碑科技推进，影响界面氛围文本 */
(function () {
    const ERAS = [
        { id: 1, name: '灰烬时代', motto: '灰烬之下，仍有火星。', test: () => true },
        { id: 2, name: '学徒时代', motto: '第一枚符文亮起时，世界重新学会呼吸。', test: s => s.techs['魔力感知'] && s.techs['魔力感知'].researched },
        { id: 3, name: '学院时代', motto: '知识不再属于个人，而属于文明。', test: s => s.techs['咒法学'] && s.techs['咒法学'].researched },
        { id: 4, name: '高塔时代', motto: '我们把城市举向天空，为了离星辰更近。', test: s => s.techs['浮空石'] && s.techs['浮空石'].researched },
        { id: 5, name: '星界时代', motto: '星图另一端，也许还有别的废墟。', test: s => s.techs['星界航行'] && s.techs['星界航行'].researched },
        { id: 6, name: '虚空时代', motto: '当规则也能被书写，重建便成了创世。', test: s => s.techs['虚空撕裂'] && s.techs['虚空撕裂'].researched },
    ];

    window.ERAS = ERAS;
    window.getCurrentEra = function (state) {
        let cur = ERAS[0];
        for (const e of ERAS) if (e.test(state)) cur = e;
        return cur;
    };
})();

</script>
<script>
/* ===== js/config/buildings.js ===== */
/* =========================================================
   建筑定义
   B(名称, {
     type    分类（用于分组显示）
     era     时代序号（仅用于排序）
     tech    解锁科技
     cost    基础造价
     g       成本增长率（每多建一座，价格 ×g）
     prod    产出（资源/日）
     cons    消耗（资源/日，不足时该建筑效率下降）
     caps    提供的存量上限
     pop     需要的人口
     local   提供的局部资源（population / power）
     happy   民望加成
     mods    对其它建筑的增幅 [{target, prod, cons, cap}]
     modes   模式切换 [{name, prod, cons, caps, local, happy, desc}]
     global  全局加成（每座启用建筑叠加）{globalProd, globalCost, happiness, speed, ...}
     desc    说明
   })
   ========================================================= */
(function () {
    const REG = {};
    const ORDER = [];

    function B(name, o) {
        REG[name] = {
            name: name,
            type: o.type || '采集',
            era: o.era || 1,
            tech: o.tech || null,
            cost: o.cost || {},
            growth: o.g === undefined ? 1.2 : o.g,
            produces: o.prod || {},
            consumes: o.cons || {},
            caps: o.caps || {},
            pop: o.pop || 0,
            providesLocal: o.local || {},
            requiresLocal: {},
            happiness: o.happy || 0,
            modifiers: o.mods || [],
            modes: o.modes || null,
            global: o.global || {},
            desc: o.desc || '',
        };
        ORDER.push(name);
        return REG[name];
    }

    /* ================= 采集 ================= */
    B('拾荒棚', {
        type: '采集', era: 1, tech: '拾荒', cost: { 木材: 4 }, g: 1.15,
        prod: { 木材: 0.25, 石料: 0.12 },
        desc: '在废墟里翻找还能用的木料与石块，你自己动手，不需要人手。这是文明的第一口气。',
    });
    B('伐木场', {
        type: '采集', era: 1, tech: '伐木技术', cost: { 木材: 10 }, g: 1.2,
        prod: { 木材: 1 }, caps: { 木材: 60 }, pop: 1,
        desc: '斧刃砍进灰烬森林的老树，木屑飞扬。每座需要 1 名樵夫。',
    });
    B('采石场', {

<script>
/* ===== js/config/expeditions.js ===== */
/* =========================================================
   遗迹远征：消耗资源派出队伍，按军力判定成败，带回材料 / 遗物 / 秘宝
   R(名称, {tier, power:所需军力, days:耗时(游戏日), cost:{}, loot:{资源:[min,max]}, relics:[min,max], artifact:概率})
   ========================================================= */
(function () {
    const LIST = [];

    function R(name, o) {
        LIST.push({
            name: name, tier: o.tier, power: o.power, days: o.days,
            cost: o.cost || {}, loot: o.loot || {},
            relics: o.relics || [0, 0], artifact: o.artifact || 0,
            desc: o.desc || '',
        });
    }

    R('灰烬荒原', {
        tier: 1, power: 20, days: 4, artifact: 0.25,
        cost: { 食物: 60, 魔力: 15 },
        loot: { 木材: [200, 500], 石料: [200, 500], 铁矿: [40, 120] },
        desc: '大崩坏后最早被翻找过的平原，但靠近旧城墙的地方仍有东西。',
    });
    R('幽影沼泽', {
        tier: 2, power: 150, days: 8, artifact: 0.4,
        cost: { 食物: 300, 魔力: 80, 木炭: 100 },
        loot: { 魔晶: [40, 90], 符文: [15, 40], 黄金: [150, 400], 铁矿: [200, 500] },
        desc: '水下沉着旧时代的沉船与塔基，影子里有东西在动。',
    });
    R('破碎浮空岛', {
        tier: 3, power: 900, days: 16, artifact: 0.6,
        cost: { 食物: 1200, 魔力: 600, 铁锭: 300 },
        loot: { 秘银: [30, 80], 奥术合金: [8, 25], 符文: [120, 300], 魔晶: [200, 500] },
        desc: '悬在半空的碎块上还留着完整的实验室与温室。需要浮空设备才能登上去。',
    });
    R('深渊裂隙', {
        tier: 4, power: 5000, days: 30, artifact: 0.8, relics: [5, 20],
        cost: { 食物: 6000, 魔力: 4000, 星尘: 60 },
        loot: { 星尘: [80, 200], 以太: [5, 18], 奥术合金: [150, 400] },
        desc: '大崩坏的中心。裂缝里流出的东西既不属于虚空，也不属于这个世界。',
    });
    R('星界回廊', {
        tier: 5, power: 30000, days: 60, artifact: 0.95, relics: [60, 250],
        cost: { 食物: 30000, 魔力: 25000, 以太: 200 },
        loot: { 以太: [120, 400], 贤者之石: [3, 12], 星尘: [1500, 4000] },
        desc: '一条被折叠起来的路，走过去需要背对星空。',
    });
    R('虚空之门', {
        tier: 6, power: 200000, days: 120, artifact: 1, relics: [800, 3000],
        cost: { 食物: 200000, 魔力: 400000, 贤者之石: 40 },
        loot: { 贤者之石: [40, 150], 以太: [2000, 6000], 星尘: [40000, 120000] },
        desc: '门后没有风景。但能从那里带回来的东西，足以改写这座城市的规则。',
    });

    window.EXPEDITIONS_CONFIG = LIST;
})();

<script>
/* ===== js/engine/utils.js ===== */
/* 通用工具：数字格式化、随机、时间 */
(function () {
    const UNITS = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'UDc', 'DDc', 'TDc', 'QaDc', 'QiDc', 'SxDc', 'SpDc', 'OcDc', 'NoDc', 'Vg'];

    function fmtNum(n, digits) {
        if (n === undefined || n === null || isNaN(n)) return '0';
        if (digits === undefined) digits = 2;
        const neg = n < 0;
        n = Math.abs(n);
        if (n < 1000) {
            let s;
            if (n >= 100) s = n.toFixed(0);
            else if (n >= 10) s = n.toFixed(Math.min(1, digits));
            else s = n.toFixed(digits);
            if (s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, '');
            return (neg ? '-' : '') + s;
        }
        let tier = Math.floor(Math.log10(n) / 3);
        if (tier >= UNITS.length) return (neg ? '-' : '') + n.toExponential(2).replace('e+', 'e');
        const scaled = n / Math.pow(1000, tier);
        let s = scaled.toFixed(scaled < 10 ? 2 : scaled < 100 ? 1 : 0);
        return (neg ? '-' : '') + s + UNITS[tier];
    }

    function fmtRate(n, digits) {
        if (n === undefined || isNaN(n)) return '0';
        const v = fmtNum(Math.abs(n), digits === undefined ? 2 : digits);
        return (n < 0 ? '-' : '+') + v;
    }

    function fmtInt(n) { return Math.round(n).toLocaleString('zh-CN'); }

    function fmtPct(x, digits) {
        if (isNaN(x)) return '0%';
        const d = digits === undefined ? 1 : digits;
        return (x * 100).toFixed(d).replace(/\.0+$/, '') + '%';
    }

    /* 游戏内时间：1 秒 = 1 日，360 日 = 1 年 */
    function fmtDate(days) {
        const y = Math.floor(days / 360) + 1;
        const d = Math.floor(days % 360) + 1;
        return '第 ' + y + ' 年 ' + d + ' 日';
    }

    function fmtDuration(seconds) {
        seconds = Math.max(0, Math.floor(seconds));
        if (seconds < 60) return seconds + ' 秒';
        const m = Math.floor(seconds / 60), s = seconds % 60;
        if (m < 60) return m + ' 分 ' + (s > 0 ? s + ' 秒' : '');
        const h = Math.floor(m / 60), mm = m % 60;
        if (h < 24) return h + ' 时 ' + (mm > 0 ? mm + ' 分' : '');
        const d = Math.floor(h / 24), hh = h % 24;
        return d + ' 天 ' + (hh > 0 ? hh + ' 时' : '');
    }

    function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

    function rnd(a, b) {
        if (a === undefined) return Math.random();
        if (b === undefined) return Math.random() * a;
        return a + Math.random() * (b - a);
    }

    function rndInt(a, b) { return Math.floor(rnd(a, b + 1)); }

    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function weightedPick(items, weightFn) {
        let total = 0;
        for (const it of items) total += Math.max(0, weightFn(it));
        if (total <= 0) return null;
        let r = Math.random() * total;
        for (const it of items) {
            r -= Math.max(0, weightFn(it));
            if (r <= 0) return it;
        }
        return items[items.length - 1];
    }

    function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

    window.Utils = {
        fmtNum, fmtRate, fmtInt, fmtPct, fmtDate, fmtDuration,
        clamp, rnd, rndInt, pick, weightedPick, deepClone,
    };
})();

</script>

(function () {
    const SAVE_VERSION = 5;

    /* 全局唯一状态对象（引用始终不变，便于各模块共享） */
    const GameState = {

    function freshStats() {
        return {
            playSeconds: 0,

            expeditions: 0,
            expeditionsFailed: 0,

        };

    function freshSettings() {

            autosave: true,

            autoBuildKeep: 0,
            autoExpedition: true,
            buyAmount: 1,
        };
    }

    /* 英雄与召唤的初始状态 */
    function freshHeroes() {
        return {
            owned: {},                          // 英雄 id → 觉醒等级（0~5）
            pity: { A: 0, S: 0, EX: 0 },        // 距离上次获得该档位以上的抽数
            pulls: 0,
            byRarity: { C: 0, B: 0, A: 0, S: 0, EX: 0 },
            dupRelics: 0,
            history: [],
        };
    }

    function initState() {
        const s = GameState;
        s.version = SAVE_VERSION;
        s.gameDays = 0;
        s.paused = false;
        s.speed = 1;
        s.happiness = 100;
        s.happinessList = [];
        s.resources = {};
        s.localResources = {};
        s.buildings = {};
        s.techs = {};
        s.upgrades = {};
        s.policies = {};
        s.permanent = {};
        s.achievements = {};
        s.challenges = {};
        s.artifacts = { inventory: [], equipped: [], slots: 3 };
        s.queue = { items: [] };
        s.heroes = freshHeroes();
        s.market = { resources: {}, heat: {}, volume: 0, trades: 0 };
        s.expedition = { active: null, auto: false, history: [] };
        s.activeEffects = [];
        s.eventLogs = [];
        s.pendingEvent = null;
        s.nextEventDay = 100;
        s.effects = null;
        s.stats = freshStats();
        s.settings = freshSettings();
        s.lastSave = Date.now();
        s.lastTick = Date.now();
        s.offlineReport = null;

        for (const k in RESOURCES_CONFIG) {
            const cfg = RESOURCES_CONFIG[k];
            s.resources[k] = {
                amount: 0,
                cap: cfg.cap,
                baseCap: cfg.cap,
                production: 0,
                visible: false,
            };
        }
        /* 起始物资：废墟里还能找到的东西 */
        s.resources['木材'].amount = 25;
        s.resources['石料'].amount = 15;

        for (const k in LOCAL_RESOURCES_CONFIG) {
            s.localResources[k] = { amount: 0, capacity: 0, used: 0, visible: k === 'population' };
        }

        for (const k in BUILDINGS_CONFIG) {
            s.buildings[k] = { count: 0, active: 0, visible: false, locked: false, price: {}, efficiency: 1, mode: 0 };
        }
        for (const k in TECHS_CONFIG) s.techs[k] = { researched: false, visible: false };
        for (const k in UPGRADES_CONFIG) s.upgrades[k] = { level: 0, visible: false, price: {} };
        for (const k in POLICIES_CONFIG) {
            const cfg = POLICIES_CONFIG[k];
            s.policies[k] = { value: cfg.def, visible: false };
        }
        for (const k in PERMANENT_CONFIG) s.permanent[k] = { level: 0, researched: false };
        for (const c of CHALLENGES_CONFIG) s.challenges[c.id] = { active: false, completed: false };
        for (const k in RESOURCES_CONFIG) {
            const cfg = RESOURCES_CONFIG[k];
            if (!cfg.prestige) s.market.resources[k] = { mode: 'off', level: 1 };
            s.market.heat[k] = 1;
        }
        return s;
    }

    /* ---------------- 资源操作 ---------------- */
    const ResourcesManager = {
        get(name) { return GameState.resources[name]; },
        amount(name) {
            const r = GameState.resources[name];
            return r ? r.amount : 0;
        },
        add(map) {
            for (const k in map) {
                const r = GameState.resources[k];
                if (!r) continue;
                r.amount = Math.max(0, r.amount + map[k]);
                const cfg = RESOURCES_CONFIG[k];
                if (!cfg.prestige && r.amount > r.cap) r.amount = r.cap;
            }
        },
        canAfford(map) {
            for (const k in map) {
                if (!map[k]) continue;
                const r = GameState.resources[k];
                if (!r || r.amount + 1e-9 < map[k]) return false;
            }
            return true;
        },
        spend(map) {
            if (!this.canAfford(map)) return false;
            for (const k in map) {
                if (!map[k]) continue;
                GameState.resources[k].amount -= map[k];
            }
            return true;
        },
        missing(map) {
            const out = {};
            for (const k in map) {
                const r = GameState.resources[k];
                const lack = map[k] - (r ? r.amount : 0);
                if (lack > 1e-9) out[k] = lack;
            }
            return out;
        },
    };

    window.GameState = GameState;
    window.initState = initState;
    window.freshHeroes = freshHeroes;
    window.SAVE_VERSION = SAVE_VERSION;
    window.ResourcesManager = ResourcesManager;
})();

<script>
/* ===== js/engine/effects.js ===== */
/* =========================================================
   效果聚合器
   把科技 / 升级 / 政策 / 传承 / 成就 / 试炼 / 秘宝 / 事件 / 建筑全局效果
   统一汇总成一份可直接查询的加成表
   ========================================================= */
(function () {
    const ADDITIVE_KEYS = [
        'globalProd', 'globalCost', 'happiness', 'knowledgeProd', 'capAll',
        'populationCap', 'relicGain', 'resetGain', 'expeditionPower',
        'expeditionReward', 'speed', 'marketVolume', 'artifactQuality',
        'capPerRelic', 'knowledgeCapPerRelic', 'offlineHours',
        /* 建造队列与英雄召唤相关 */
        'queueSlots', 'queueDiscount', 'powerMult', 'luck', 'summonDiscount', 'heroPower',
    ];

    function emptyEffects() {
        const e = {
            buildings: {},
            resources: {},
            happinessList: [],
            specials: {},
            knowledgeCapMult: 1,
            startResources: 0,
        };
        for (const k of ADDITIVE_KEYS) e[k] = 0;
        return e;
    }

    function ensureBuilding(e, name) {
        if (!e.buildings[name]) e.buildings[name] = { prod: 0, cons: 0, cap: 0 };
        return e.buildings[name];
    }

    /* 把一份效果对象叠加进汇总表 */
    function applyEffect(e, eff, scale, source) {
        if (!eff) return;
        scale = scale === undefined ? 1 : scale;
        for (const key in eff) {
            const val = eff[key];
            if (val === undefined || val === null) continue;

            if (ADDITIVE_KEYS.indexOf(key) >= 0) {
                if (typeof val === 'number') e[key] += val * scale;
                continue;
            }
            if (key === 'resourceProd') {
                for (const r in val) {
                    if (!e.resources[r]) e.resources[r] = { prod: 0 };
                    e.resources[r].prod += val[r] * scale;
                }
                continue;
            }
            if (key === 'startResources') { e.startResources += val * scale; continue; }
            if (key === 'knowledgeCapMult') { e.knowledgeCapMult *= Math.pow(val, scale); continue; }
            if (key === 'special') { e.specials[val] = true; continue; }
            if (key === 'happinessPerRelic') { e.happinessPerRelic = (e.happinessPerRelic || 0) + val * scale; continue; }

            if (BUILDINGS_CONFIG[key]) {
                const b = ensureBuilding(e, key);
                if (typeof val.prod === 'number') b.prod += val.prod * scale;
                if (typeof val.cons === 'number') b.cons += val.cons * scale;
                if (typeof val.cap === 'number') b.cap += val.cap * scale;
                continue;
            }
            if (RESOURCES_CONFIG[key] && typeof val === 'number') {
                if (!e.resources[key]) e.resources[key] = { prod: 0 };
                e.resources[key].prod += val * scale;
                continue;
            }
        }
    }

    function addHappiness(e, source, value) {
        if (!value) return;
        e.happiness += value;
        e.happinessList.push({ source: source, value: value });
    }

    /* ---------------- 汇总 ---------------- */
    function refreshAllEffects(state) {
        const e = emptyEffects();
        state.effects = e;

        /* 科技 */
        for (const name in state.techs) {
            const t = state.techs[name];
            if (!t.researched) continue;
            const cfg = TECHS_CONFIG[name];
            if (cfg && cfg.effect) applyEffect(e, cfg.effect, 1, '科技·' + name);
        }

        /* 可重复升级 */
        for (const name in state.upgrades) {
            const u = state.upgrades[name];
            if (!u.level) continue;
            const cfg = UPGRADES_CONFIG[name];
            if (cfg && cfg.effect) applyEffect(e, cfg.effect, u.level, '升级·' + name);
        }

        /* 国策 */
        for (const name in state.policies) {
            const p = state.policies[name];
            const cfg = POLICIES_CONFIG[name];
            if (!p.visible || !cfg || !cfg.get) continue;
            const eff = cfg.get(p.value);
            if (eff) applyEffect(e, eff, 1, '国策·' + name);
        }

        /* 传承 */
        for (const name in state.permanent) {
            const perm = state.permanent[name];
            if (!perm.level) continue;
            const cfg = PERMANENT_CONFIG[name];
            if (!cfg) continue;
            if (cfg.effect) applyEffect(e, cfg.effect, perm.level, '传承·' + name);
            if (cfg.special) e.specials[cfg.special] = true;
        }

        /* 成就 */
        for (const id in state.achievements) {
            if (!state.achievements[id]) continue;
            const cfg = ACHIEVEMENTS_CONFIG.find(a => a.id === id);
            if (cfg && cfg.effect) applyEffect(e, cfg.effect, 1, '成就·' + id);
        }

        /* 试炼（激活中的负面效果） */
        for (const c of CHALLENGES_CONFIG) {
            const st = state.challenges[c.id];
            if (st && st.active) applyEffect(e, c.effect, 1, '试炼·' + c.id);
            if (st && st.completed) applyEffect(e, c.reward, 1, '试炼奖励·' + c.id);
        }

        /* 秘宝 */
        for (const art of state.artifacts.equipped) {
            if (!art) continue;
            for (const eff of art.effects) applyEffect(e, eff, 1, '秘宝·' + art.name);
        }

        /* 英雄：分类效果 × 稀有度倍率 × 觉醒加成 × 传承「英雄共鸣」加成 */
        if (state.heroes && state.heroes.owned && window.Heroes) {
            const heroMult = 1 + (e.heroPower || 0);
            for (const item of Heroes.ownedEffects(state)) {
                const scaled = {}, plain = {};
                for (const k in item.effect) {
                    if (k === 'queueSlots') plain[k] = item.effect[k];   // 槽位是整数，不随觉醒缩放
                    else scaled[k] = item.effect[k];
                }
                applyEffect(e, scaled, item.mult * heroMult, '英雄·' + item.hero.name);
                applyEffect(e, plain, 1, '英雄·' + item.hero.name);
            }
        }

        /* 随机事件带来的临时效果 */
        for (const ae of state.activeEffects) {
            applyEffect(e, ae.effect, 1, '事件·' + ae.name);
            if (ae.effect && typeof ae.effect.happiness === 'number') {
                /* happiness 已在 applyEffect 中累加 */
            }
        }

        /* 建筑提供的全局效果（按启用数量叠加） */
        for (const name in state.buildings) {
            const b = state.buildings[name];
            if (!b.active) continue;
            const cfg = BUILDINGS_CONFIG[name];
            if (cfg && cfg.global) applyEffect(e, cfg.global, b.active, '建筑·' + name);
        }

        return e;
    }

    const EffectsManager = {
        refreshAllEffects,
        applyEffect,
        ensureBuilding,
        emptyEffects,

        get(state) { return state.effects || refreshAllEffects(state); },
        additive(state, key) { return this.get(state)[key] || 0; },

        buildingMultipliers(state, name) {
            const e = this.get(state);
            const b = e.buildings[name] || { prod: 0, cons: 0, cap: 0 };
            return {
                prod: 1 + b.prod + e.globalProd,
                cons: 1 + b.cons,
                cap: 1 + Math.max(-0.9, b.cap),
            };
        },

        resourceMultiplier(state, res) {
            const e = this.get(state);
            const r = e.resources[res];
            let m = 1 + (r ? r.prod : 0);
            if (res === '魔法知识') m *= 1 + e.knowledgeProd;
            return Math.max(0, m);
        },

        hasSpecial(state, key) { return !!this.get(state).specials[key]; },
    };

    window.EffectsManager = EffectsManager;
})();

</script>
<script>
/* ===== js/engine/production.js ===== */
/* =========================================================
   生产计算核心
   1. 汇总所有加成
   2. 迭代求解每座建筑的「效率」（受原料短缺与人口短缺限制）
   3. 写入资源产量 / 上限、人口与军力、民望
   ========================================================= */
(function () {
    const ITERATIONS = 3;
    const DT = 0.25;

    function resolve(v, state) { return typeof v === 'function' ? v(state) : (v || {}); }

    /* 取建筑当前模式（未设置模式时就是自身） */
    function activeConfig(cfg, building) {
        if (!cfg.modes || !cfg.modes.length) return cfg;
        const m = cfg.modes[building.mode || 0] || cfg.modes[0];
        const merged = Object.assign({}, cfg, m);
        merged.modeName = m.name;
        return merged;
    }

    function stdCost(baseCost, growth, count, costMult) {
        const g = 1 + (growth - 1) * Math.max(0.05, costMult);
        const price = {};
        for (const r in baseCost) price[r] = Math.floor(baseCost[r] * Math.pow(g, count));
        return price;
    }

    function costMultiplier(state) {
        const e = EffectsManager.get(state);
        return 1 + (e.globalCost || 0);
    }

    function buildingPrice(state, name) {
        const cfg = BUILDINGS_CONFIG[name];
        const b = state.buildings[name];
        return stdCost(cfg.cost, cfg.growth, b.count, costMultiplier(state));
    }

    /* 指定「已建数量」时的价格（队列里批量建造需要预扣多座的成本） */
    function buildingPriceCount(state, name, count) {
        const cfg = BUILDINGS_CONFIG[name];
        if (!cfg) return {};
        return stdCost(cfg.cost, cfg.growth, count, costMultiplier(state));
    }

    function upgradePrice(state, name) {
        const cfg = UPGRADES_CONFIG[name];
        const u = state.upgrades[name];
        return stdCost(cfg.cost, cfg.growth, u.level, costMultiplier(state));
    }

    /* 指定等级时的升级价格（队列里批量升级需要预扣多级成本） */
    function upgradePriceCount(state, name, level) {
        const cfg = UPGRADES_CONFIG[name];
        if (!cfg) return {};
        return stdCost(cfg.cost, cfg.growth, level, costMultiplier(state));
    }

    /* 民望软上限：极高的民望收益递减，避免无限叠乘 */
    function happinessSoftCap(state, happiness) {
        const relic = ResourcesManager.amount('奥术遗物');
        const soft = 400 + Math.sqrt(relic) * 20;
        if (happiness <= soft) return happiness;
        return soft - 100 + 200 * Math.sqrt(0.25 + 0.005 * (happiness - soft));
    }

    function computeProductionAndCaps(state) {
        const e = EffectsManager.refreshAllEffects(state);
        const perfectPop = !!e.specials.perfectEfficiency;

        /* ---------- 1. 收集建筑理论数据 ---------- */
        const raw = {};
        for (const name in state.buildings) {
            const b = state.buildings[name];
            if (!b.active) continue;
            const baseCfg = BUILDINGS_CONFIG[name];
            if (!baseCfg) continue;
            const cfg = activeConfig(baseCfg, b);
            const mult = EffectsManager.buildingMultipliers(state, name);

            const prod = {};
            const baseProd = resolve(cfg.produces, state);
            for (const r in baseProd) {
                prod[r] = baseProd[r] * mult.prod * EffectsManager.resourceMultiplier(state, r);
            }
            const cons = {};
            const baseCons = resolve(cfg.consumes, state);
            for (const r in baseCons) cons[r] = baseCons[r] * mult.cons;
            const caps = {};
            const baseCaps = resolve(cfg.caps, state);
            for (const r in baseCaps) caps[r] = baseCaps[r] * mult.cap;

            const requiresLocal = {};
            if (baseCfg.pop) requiresLocal.population = baseCfg.pop;

            raw[name] = {
                active: b.active,
                prod: prod,
                cons: cons,
                caps: caps,
                providesLocal: resolve(cfg.providesLocal, state),
                requiresLocal: requiresLocal,
                happiness: (typeof cfg.happiness === 'function' ? cfg.happiness(state) : (cfg.happiness || 0)),
                cfg: cfg,
            };
        }

        /* ---------- 2. 迭代求解效率 ---------- */
        for (const name in raw) {
            const b = state.buildings[name];
            if (typeof b.efficiency !== 'number' || isNaN(b.efficiency)) b.efficiency = 1;
        }

        for (let iter = 0; iter < ITERATIONS; iter++) {
            const totalProd = {}, totalCons = {}, localCap = {}, localUsed = {};
            for (const name in raw) {
                const r = raw[name];
                const ea = state.buildings[name].efficiency * r.active;
                for (const k in r.prod) totalProd[k] = (totalProd[k] || 0) + r.prod[k] * ea;
                for (const k in r.cons) totalCons[k] = (totalCons[k] || 0) + r.cons[k] * ea;
                for (const k in r.providesLocal) localCap[k] = (localCap[k] || 0) + r.providesLocal[k] * ea;
                for (const k in r.requiresLocal) localUsed[k] = (localUsed[k] || 0) + r.requiresLocal[k] * ea;
            }

            const Rg = {};
            for (const res in totalCons) {
                const cons = totalCons[res] || 0;
                if (cons < 1e-9) { Rg[res] = 1; continue; }
                const stock = state.resources[res] ? state.resources[res].amount : 0;
                const prod = totalProd[res] || 0;
                Rg[res] = Utils.clamp((stock + prod * DT) / (cons * DT), 0, 1.2);
            }

            const Rl = {};
            for (const lr in LOCAL_RESOURCES_CONFIG) {
                const cap = localCap[lr] || 0, used = localUsed[lr] || 0;
                if (perfectPop) Rl[lr] = 1.2;
                else Rl[lr] = used < 1e-9 ? 1 : Utils.clamp(cap / used, 0, 1.2);
            }

            for (const name in raw) {
                const r = raw[name];
                let minR = 1.5;
                for (const k in r.cons) {
                    const v = Rg[k] === undefined ? 1 : Rg[k];
                    if (v < minR) minR = v;
                }
                for (const k in r.requiresLocal) {
                    const v = Rl[k] === undefined ? 1 : Rl[k];
                    if (v < minR) minR = v;
                }
                const b = state.buildings[name];
                if (b.efficiency < 1e-5 && minR > 1e-5) b.efficiency = Math.min(1, (1e-5 + b.efficiency) * minR);
                b.efficiency = Math.min(1, b.efficiency * minR);
            }
        }

        /* ---------- 3. 写入产量 / 上限 / 局部资源 ---------- */
        for (const k in state.resources) {
            state.resources[k].production = 0;
            state.resources[k].cap = state.resources[k].baseCap;
        }
        for (const lr in state.localResources) {
            state.localResources[lr].capacity = 0;
            state.localResources[lr].used = 0;
        }

        const relic = ResourcesManager.amount('奥术遗物');
        const capBoost = (1 + (e.capAll || 0)) * (1 + relic * (e.capPerRelic || 0));
        const knowledgeCapBoost = capBoost *
            (1 + Math.log(1 + relic) * (e.knowledgeCapPerRelic || 0)) *
            (e.knowledgeCapMult || 1);

        for (const name in raw) {
            const r = raw[name];
            const b = state.buildings[name];
            const effActive = b.efficiency * r.active;

            for (const k in r.prod) state.resources[k].production += r.prod[k] * effActive;
            for (const k in r.cons) state.resources[k].production -= r.cons[k] * effActive;
            for (const k in r.caps) {
                const mult = (k === '魔法知识') ? knowledgeCapBoost : capBoost;
                state.resources[k].cap += r.caps[k] * r.active * mult;
            }
            for (const lr in r.providesLocal) {
                const v = r.providesLocal[lr] * effActive;
                let mult = 1;
                if (lr === 'population') mult = 1 + (e.populationCap || 0);
                else if (lr === 'power') mult = 1 + (e.powerMult || 0);
                state.localResources[lr].capacity += v * mult;
            }
            for (const lr in r.requiresLocal) {
                state.localResources[lr].used += r.requiresLocal[lr] * effActive;
            }
        }

        /* 市场贸易流 */
        if (window.TradeEngine) TradeEngine.applyToProduction(state);

        for (const name in state.buildings) {
            if (!raw[name]) {
                const cfg = BUILDINGS_CONFIG[name];
                if (!state.buildings[name].active) state.buildings[name].efficiency = 1;
                else state.buildings[name].efficiency = 0;
            }
        }

        /* 资源只能为负到 0，产量展示用净值 */
        for (const k in state.resources) {
            const r = state.resources[k];
            if (!RESOURCES_CONFIG[k].prestige && r.amount > r.cap) r.amount = r.cap;
        }

        /* ---------- 4. 民望 ---------- */
        e.happinessList = [];
        let happy = 100;
        for (const name in raw) {
            const r = raw[name];
            if (r.happiness) {
                e.happinessList.push({ source: name + ' ×' + Math.round(r.active * state.buildings[name].efficiency), value: r.happiness * r.active });
                happy += r.happiness * r.active;
            }
        }
        if (e.happiness) { e.happinessList.push({ source: '加成 / 传承 / 成就', value: e.happiness }); happy += e.happiness; }
        if (relic * (e.happinessPerRelic || 0)) {
            const v = relic * e.happinessPerRelic;
            e.happinessList.push({ source: '遗物共鸣', value: v });
            happy += v;
        }

        /* 食物短缺：存量见底且净产量为负 */
        const food = state.resources['食物'];
        if (food.amount < food.cap * 0.02 && food.production < -1e-6) {
            e.happinessList.push({ source: '饥饿', value: -45 });
            happy -= 45;
            state.happinessStarving = true;
        } else {
            state.happinessStarving = false;
        }

        /* 人口不足的社会压力 */
        const pop = state.localResources.population;
        if (!perfectPop && pop.used > pop.capacity + 1e-6) {
            const pressure = Math.min(40, 40 * (pop.used - pop.capacity) / Math.max(1, pop.capacity));
            e.happinessList.push({ source: '人手不足', value: -pressure });
            happy -= pressure;
        }

        state.happinessRaw = happy;
        state.happiness = Math.max(0, happinessSoftCap(state, Math.max(0, happy)));
        state.happinessFactor = state.happiness / 100;

        /* 人口 = 当前容量（住房提供），军力 = 提供值 */
        state.localResources.population.amount = state.localResources.population.capacity;
        state.localResources.power.amount = state.localResources.power.capacity;

        /* ---------- 5. 全局速度 ---------- */
        state.speed = Math.max(0.1, 1 + (e.speed || 0));

        /* ---------- 6. 可见性 ---------- */
        refreshVisibility(state);

        /* ---------- 7. 价格（可见性变化后必须同步刷新，否则新解锁项会显示为空价格） ---------- */
        updatePrices(state);

        return e;
    }

    /* 已解锁 = 前置科技全部研究完毕；可见 = 前置科技不足一项未研究 或 已解锁 */
    function techAvailable(state, name) {
        const cfg = TECHS_CONFIG[name];
        if (!cfg) return false;
        const t = state.techs[name];
        if (t.researched) return true;
        for (const p of cfg.prereq) {
            const pt = state.techs[p];
            if (!pt || !pt.researched) return false;
        }
        return true;
    }

    function techVisible(state, name) {
        const t = state.techs[name];
        if (t.researched) return true;
        const cfg = TECHS_CONFIG[name];
        const missing = cfg.prereq.filter(p => !(state.techs[p] && state.techs[p].researched));
        if (missing.length === 0) return true;
        /* 只提前显示「再完成一项前置即可研究」的科技，避免整棵科技树一次性展开 */
        if (missing.length > 1) return false;
        return techAvailable(state, missing[0]);
    }

    function refreshVisibility(state) {
        /* 科技 */
        for (const name in state.techs) {
            state.techs[name].visible = techVisible(state, name);
        }
        /* 建筑：科技已研究 → 解锁；科技可研究 → 预告（半透明） */
        for (const name in state.buildings) {
            const cfg = BUILDINGS_CONFIG[name];
            const b = state.buildings[name];
            if (!cfg.tech) { b.visible = true; b.unlocked = true; continue; }
            const tech = state.techs[cfg.tech];
            if (tech && tech.researched) { b.visible = true; b.unlocked = true; }
            else if (tech && tech.visible) { b.visible = true; b.unlocked = false; }
            else { b.visible = b.count > 0; b.unlocked = b.count > 0; }
        }
        /* 升级 */
        for (const name in state.upgrades) {
            const cfg = UPGRADES_CONFIG[name];
            const tech = state.techs[cfg.tech];
            state.upgrades[name].visible = !!(tech && tech.researched);
        }
        /* 国策 */
        for (const name in state.policies) {
            const cfg = POLICIES_CONFIG[name];
            const tech = state.techs[cfg.tech];
            state.policies[name].visible = !!(tech && tech.researched);
        }
        /* 资源可见性 */
        const seen = {};
        for (const k in state.resources) {
            const r = state.resources[k];
            if (r.amount > 1e-9 || Math.abs(r.production) > 1e-9) seen[k] = true;
        }
        for (const name in state.buildings) {
            const b = state.buildings[name];
            if (!b.visible || !b.unlocked) continue;
            const cfg = BUILDINGS_CONFIG[name];
            const modes = cfg.modes || [cfg];
            for (const m of modes) {
                for (const k in (m.produces || {})) seen[k] = true;
                for (const k in (m.consumes || {})) seen[k] = true;
                for (const k in (m.caps || {})) seen[k] = true;
            }
            for (const k in b.price) seen[k] = true;
        }
        for (const name in state.techs) {
            if (!state.techs[name].visible) continue;
            const cfg = TECHS_CONFIG[name];
            for (const k in cfg.cost) seen[k] = true;
        }
        for (const name in state.upgrades) {
            if (!state.upgrades[name].visible) continue;
            for (const k in state.upgrades[name].price) seen[k] = true;
        }
        /* 传承资源一旦获得就永久显示 */
        for (const k in state.resources) {
            if (RESOURCES_CONFIG[k].prestige && state.resources[k].amount > 0) state.resources[k].visible = true;
            else state.resources[k].visible = !!seen[k];
        }
        state.resources['木材'].visible = true;
        state.resources['石料'].visible = true;
        state.resources['魔法知识'].visible = state.resources['魔法知识'].visible || state.techs['抄写术'].visible;
        for (const lr in state.localResources) {
            if (lr === 'power') state.localResources[lr].visible = state.localResources[lr].capacity > 0.001 || state.localResources[lr].used > 0.001;
            else state.localResources[lr].visible = true;
        }
    }

    function updatePrices(state) {
        for (const name in state.buildings) {
            state.buildings[name].price = buildingPrice(state, name);
        }
        for (const name in state.upgrades) {
            if (state.upgrades[name].visible) state.upgrades[name].price = upgradePrice(state, name);
        }
    }

    function getBuildingStats(state, name) {
        const cfg = BUILDINGS_CONFIG[name];
        const b = state.buildings[name];
        if (!cfg || !b) return null;
        const active = activeConfig(cfg, b);
        const mult = EffectsManager.buildingMultipliers(state, name);
        const eff = b.active ? b.efficiency : 1;
        const prod = [], cons = [], caps = [];
        const baseProd = resolve(active.produces, state);
        for (const r in baseProd) {
            const per = baseProd[r] * mult.prod * EffectsManager.resourceMultiplier(state, r);
            prod.push({ res: r, per: per, total: per * b.active * eff });
        }
        const baseCons = resolve(active.consumes, state);
        for (const r in baseCons) {
            const per = baseCons[r] * mult.cons;
            cons.push({ res: r, per: per, total: per * b.active * eff });
        }
        const baseCaps = resolve(active.caps, state);
        for (const r in baseCaps) caps.push({ res: r, per: baseCaps[r] * mult.cap, total: baseCaps[r] * mult.cap * b.active });
        return {
            prod: prod, cons: cons, caps: caps,
            efficiency: eff,
            providesLocal: resolve(active.providesLocal, state),
            requiresLocal: cfg.pop ? { population: cfg.pop } : {},
            happiness: active.happiness || 0,
            modifiers: active.modifiers || [],
            modeName: active.modeName || null,
            price: b.price,
        };
    }

    /* 某资源的产量来源明细（用于悬浮提示） */
    function getResourceContributions(state, res) {
        const out = [];
        for (const name in state.buildings) {
            const b = state.buildings[name];
            if (!b.active) continue;
            const stats = getBuildingStats(state, name);
            if (!stats) continue;
            const p = stats.prod.find(x => x.res === res);
            if (p) out.push({ source: name, value: p.total });
            const c = stats.cons.find(x => x.res === res);
            if (c) out.push({ source: name + '（消耗）', value: -c.total });
        }
        if (window.TradeEngine) {
            const t = TradeEngine.rates(state)[res];
            if (t) out.push({ source: '贸易', value: t });
            if (res === '黄金') {
                const g = TradeEngine.goldFlow(state);
                if (g) out.push({ source: '贸易结算', value: g });
            }
        }
        for (const ae of state.activeEffects) {
            if (ae.effect && ae.effect.resourceProd && ae.effect.resourceProd[res]) {
                out.push({ source: '事件·' + ae.name, value: 0, note: '修正 ' + Utils.fmtPct(ae.effect.resourceProd[res]) });
            }
        }
        return out;
    }

    window.ProductionEngine = {
        computeProductionAndCaps,
        updatePrices,
        buildingPrice,
        buildingPriceCount,
        upgradePrice,
        upgradePriceCount,
        getBuildingStats,
        getResourceContributions,
        activeConfig,
        happinessSoftCap,
        techAvailable,
        refreshVisibility,
        costMultiplier,
    };
    window.computeProductionAndCaps = computeProductionAndCaps;
})();

</script>
<script>
/* ===== js/engine/market.js ===== */
/* =========================================================
   贸易引擎
   集市提供「贸易规模」；每种资源可设为买入 / 卖出。
   价格随热度浮动：买得越多越贵，卖得越多越便宜，热度会缓慢回落。
   ========================================================= */
(function () {
    const SELL_RATIO = 0.8;
    const HEAT_MIN = 0.25, HEAT_MAX = 4;

    function volume(state) {
        const markets = state.buildings['集市'].active || 0;
        const mult = 1 + EffectsManager.additive(state, 'marketVolume');
        return markets * 25 * mult;
    }

    function price(state, res) {
        const cfg = RESOURCES_CONFIG[res];
        const heat = state.market.heat[res] === undefined ? 1 : state.market.heat[res];
        return cfg.value * heat;
    }

    /* 计算各资源的实际贸易流量（资源/日） */
    function rates(state) {
        const out = {};
        const vol = volume(state);
        state.market.volume = vol;
        if (vol <= 0) return out;
        const gold = state.resources['黄金'];

        for (const res in state.market.resources) {
            const m = state.market.resources[res];
            if (m.mode === 'off') continue;
            const p = price(state, res);
            if (p <= 0) continue;
            const share = Utils.clamp(m.level, 1, 10) / 10;
            let rate = vol * share / p;

            if (m.mode === 'buy') {
                /* 黄金不足时按比例缩减 */
                const costPerDay = rate * p;
                if (costPerDay > 0) {
                    const available = gold.amount * 0.5 + Math.max(0, gold.production);
                    if (costPerDay > available) rate = Math.max(0, available / p);
                }
                if (gold.amount <= 1e-6) rate = 0;
                if (rate > 0) out[res] = (out[res] || 0) + rate;
            } else if (m.mode === 'sell') {
                const stock = state.resources[res].amount;
                if (stock <= 1e-6) continue;
                const allowed = stock / 2;
                if (rate > allowed) rate = allowed;
                if (rate > 0) out[res] = (out[res] || 0) - rate;
            }
        }
        return out;
    }

    /* 黄金净流量（不含建筑产出） */
    function goldFlow(state) {
        const r = rates(state);
        let flow = 0;
        for (const res in r) {
            const p = price(state, res);
            const rate = r[res];
            if (rate > 0) flow -= rate * p;              // 买入花金
            else flow += -rate * p * SELL_RATIO;         // 卖出得金
        }
        return flow;
    }

    function applyToProduction(state) {
        const r = rates(state);
        for (const res in r) {
            if (!state.resources[res]) continue;
            state.resources[res].production += r[res];
        }
        const gold = goldFlow(state);
        if (gold && state.resources['黄金']) state.resources['黄金'].production += gold;
        state.market.lastGoldFlow = gold;
        state.market.lastRates = r;
    }

    /* 热度演化（每 tick 调用） */
    function tick(state, dt) {
        if (dt <= 0) return;
        const vol = Math.max(1e-9, volume(state));
        const r = state.market.lastRates || rates(state);
        for (const res in state.market.resources) {
            const cfg = RESOURCES_CONFIG[res];
            if (!cfg) continue;
            let heat = state.market.heat[res];
            if (heat === undefined) heat = 1;
            const p = price(state, res);
            const flow = r[res] || 0;
            const pressure = (flow * p) / vol;   // 买入为正、卖出为负
            heat += (cfg.change || 0.1) * pressure * dt;
            heat += (1 - heat) * (cfg.decay || 0.01) * dt;
            state.market.heat[res] = Utils.clamp(heat, HEAT_MIN, HEAT_MAX);
        }
        state.market.volume = volume(state);
    }

    function setMode(state, res, mode) {
        if (!state.market.resources[res]) return;
        state.market.resources[res].mode = mode;
    }

    function setLevel(state, res, level) {
        if (!state.market.resources[res]) return;
        state.market.resources[res].level = Utils.clamp(Math.round(level), 1, 10);
    }

    /* 一次性买入 / 卖出（按当前贸易规模的一批） */
    function tradeOnce(state, res, dir) {
        const vol = volume(state);
        if (vol <= 0) return { ok: false, msg: '需要至少一座「集市」才能进行贸易。' };
        const p = price(state, res);
        const amount = vol / p;
        if (dir === 'buy') {
            const cost = amount * p;
            if (state.resources['黄金'].amount < cost) return { ok: false, msg: '黄金不足，无法买入 ' + res + '。' };
            state.resources['黄金'].amount -= cost;
            ResourcesManager.add({ [res]: amount });
            state.market.heat[res] = Utils.clamp(p / RESOURCES_CONFIG[res].value + (RESOURCES_CONFIG[res].change || 0.1) * 0.5, HEAT_MIN, HEAT_MAX);
            state.market.trades++;
            return { ok: true, msg: '买入 ' + Utils.fmtNum(amount) + ' ' + res + '，花费 ' + Utils.fmtNum(cost) + ' 黄金。' };
        }
        const stock = state.resources[res].amount;
        const sell = Math.min(stock, amount);
        if (sell <= 1e-9) return { ok: false, msg: '没有可出售的 ' + res + '。' };
        state.resources[res].amount -= sell;
        ResourcesManager.add({ 黄金: sell * p * SELL_RATIO });
        state.market.heat[res] = Utils.clamp(p / RESOURCES_CONFIG[res].value - (RESOURCES_CONFIG[res].change || 0.1) * 0.5, HEAT_MIN, HEAT_MAX);
        state.market.trades++;
        return { ok: true, msg: '卖出 ' + Utils.fmtNum(sell) + ' ' + res + '，获得 ' + Utils.fmtNum(sell * p * SELL_RATIO) + ' 黄金。' };
    }

    window.TradeEngine = {
        volume, price, rates, goldFlow, applyToProduction, tick,
        setMode, setLevel, tradeOnce, SELL_RATIO,
    };
})();

</script>
<script>
/* ===== js/engine/artifacts.js ===== */
/* =========================================================
   秘宝：远征带回的随机增益物品，可装备（默认 3 槽，可用传承扩展）
   每条词条都是一个标准效果对象，直接参与加成汇总。
   ========================================================= */
(function () {
    const PREFIX = ['龙语', '星辰', '深渊', '炽焰', '霜华', '虚空', '晨曦', '幽影', '圣辉', '秘银', '枯木', '雷鸣', '时砂', '萤火', '残月'];
    const SUFFIX = ['护符', '指环', '法球', '徽记', '骨笛', '碎镜', '怀表', '钥匙', '面具', '短杖', '羽饰', '灯焰'];
    const GLYPH = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', 'Ⅵ', 'Ⅶ', 'Ⅷ', 'Ⅸ', 'Ⅹ'];

    function artifactSlots(state) {
        return 3 + Math.round(EffectsManager.additive(state, 'artifactSlots'));
    }

    function candidateBuildings(state, kind) {
        const out = [];
        for (const name in state.buildings) {
            if (!state.buildings[name].visible) continue;
            const cfg = BUILDINGS_CONFIG[name];
            const hasProd = Object.keys(cfg.produces || {}).length > 0 || (cfg.modes && cfg.modes.some(m => Object.keys(m.produces || {}).length > 0));
            const hasCons = Object.keys(cfg.consumes || {}).length > 0 || (cfg.modes && cfg.modes.some(m => Object.keys(m.consumes || {}).length > 0));
            const hasCap = Object.keys(cfg.caps || {}).length > 0 || (cfg.modes && cfg.modes.some(m => Object.keys(m.caps || {}).length > 0));
            if (kind === 'prod' && !hasProd) continue;
            if (kind === 'cons' && !hasCons) continue;
            if (kind === 'cap' && !hasCap) continue;
            out.push(name);
        }
        return out;
    }

    /* 生成一件秘宝；tier 越高词条越多、数值越强 */
    function generate(state, tier) {
        tier = tier || 1;
        const quality = tier + EffectsManager.additive(state, 'artifactQuality') * 3;
        const count = Utils.clamp(1 + Math.floor(Utils.rnd(0, 2 + quality * 0.6)), 1, 6);
        const positiveChance = Utils.clamp(0.42 + quality * 0.045, 0.3, 0.78);
        const effects = [];
        const usedKeys = {};

        for (let i = 0; i < count; i++) {
            const kinds = ['prod', 'cons', 'cap', 'global', 'resource', 'happy'];
            const kind = Utils.pick(kinds);
            let eff = null, key = '';
            const scale = 0.03 + Utils.rnd(0, 0.05) + quality * 0.012;

            if (kind === 'prod' || kind === 'cons' || kind === 'cap') {
                const list = candidateBuildings(state, kind);
                const target = list.length ? Utils.pick(list) : null;
                if (!target) continue;
                key = kind + ':' + target;
                if (usedKeys[key]) continue;
                usedKeys[key] = true;
                let v = scale * (kind === 'cap' ? 0.8 : 1);
                const positive = Math.random() < positiveChance;
                if (kind === 'cons') v = positive ? -v : v;      // 负 = 减少消耗（好）
                else v = positive ? v : -v;
                const inner = {};
                inner[kind] = v;
                eff = {}; eff[target] = inner;
            } else if (kind === 'global') {
                key = 'global';
                if (usedKeys[key]) continue;
                usedKeys[key] = true;
                const v = Math.random() < positiveChance ? scale : -scale;
                eff = { globalProd: v };
            } else if (kind === 'resource') {
                const list = Object.keys(state.resources).filter(r => !RESOURCES_CONFIG[r].prestige && state.resources[r].visible);
                if (!list.length) continue;
                const res = Utils.pick(list);
                key = 'res:' + res;
                if (usedKeys[key]) continue;
                usedKeys[key] = true;
                const v = Math.random() < positiveChance ? scale * 1.2 : -scale * 1.2;
                const inner = {}; inner[res] = v;
                eff = { resourceProd: inner };
            } else {
                key = 'happy';
                if (usedKeys[key]) continue;
                usedKeys[key] = true;
                const v = (10 + Utils.rnd(0, 25)) * (1 + quality * 0.25);
                eff = { happiness: Math.random() < positiveChance ? v : -v };
            }
            if (eff) effects.push(eff);
        }
        if (!effects.length) effects.push({ globalProd: 0.02 });

        let fragile = Math.random() < 0.07;
        if (fragile) {
            for (const eff of effects) {
                for (const k in eff) {
                    if (typeof eff[k] === 'number') eff[k] *= 1.3;
                    else if (typeof eff[k] === 'object') for (const k2 in eff[k]) eff[k2] *= 1.3;
                }
            }
        }

        const roman = GLYPH[Utils.clamp(tier - 1, 0, 9)];
        const artifact = {
            id: Date.now() + '_' + Math.floor(Math.random() * 1e6),
            name: Utils.pick(PREFIX) + Utils.pick(SUFFIX) + ' ' + roman,
            tier: tier,
            effects: effects,
            fragile: fragile,
        };
        state.stats.artifactsFound++;
        return artifact;
    }

    /* 把秘宝加入库存（库存在重置时会被清空，除记忆水晶外） */
    function addToInventory(state, artifact) {
        if (state.artifacts.inventory.length >= 12) {
            state.artifacts.inventory.shift();
        }
        state.artifacts.inventory.push(artifact);
        return artifact;
    }

    function equip(state, id) {
        const slots = artifactSlots(state);
        while (state.artifacts.equipped.length < slots) state.artifacts.equipped.push(null);
        const idx = state.artifacts.inventory.findIndex(a => a.id === id);
        if (idx < 0) return { ok: false, msg: '秘宝不存在。' };
        let slot = state.artifacts.equipped.findIndex((x, i) => !x && i < slots);
        if (slot < 0) return { ok: false, msg: '装备槽已满，请先卸下一件秘宝。' };
        const art = state.artifacts.inventory.splice(idx, 1)[0];
        state.artifacts.equipped[slot] = art;
        return { ok: true, msg: '已装备「' + art.name + '」。' };
    }

    function unequip(state, slot) {
        const art = state.artifacts.equipped[slot];
        if (!art) return { ok: false };
        if (state.artifacts.inventory.length >= 12) return { ok: false, msg: '库存已满，无法卸下。' };
        state.artifacts.equipped[slot] = null;
        state.artifacts.inventory.push(art);
        return { ok: true, msg: '已卸下「' + art.name + '」。' };
    }

    function discard(state, id) {
        const idx = state.artifacts.inventory.findIndex(a => a.id === id);
        if (idx < 0) return;
        state.artifacts.inventory.splice(idx, 1);
    }

    /* 效果文字描述 */
    function describe(eff) {
        const out = [];
        for (const key in eff) {
            const v = eff[key];
            if (BUILDINGS_CONFIG[key] && typeof v === 'object') {
                if (typeof v.prod === 'number') out.push(key + ' 产出 ' + Utils.fmtPct(v.prod, 1));
                if (typeof v.cons === 'number') out.push(key + ' 消耗 ' + Utils.fmtPct(v.cons, 1));
                if (typeof v.cap === 'number') out.push(key + ' 上限 ' + Utils.fmtPct(v.cap, 1));
            } else if (key === 'resourceProd') {
                for (const r in v) out.push(r + ' 产出 ' + Utils.fmtPct(v[r], 1));
            } else if (key === 'globalProd') {
                out.push('所有建筑产出 ' + Utils.fmtPct(v, 1));
            } else if (key === 'happiness') {
                out.push('民望 ' + (v >= 0 ? '+' : '') + Utils.fmtNum(v, 0));
            } else if (key === 'speed') {
                out.push('世界流速 ' + Utils.fmtPct(v, 1));
            } else {
                out.push(key + ' ' + v);
            }
        }
        return out;
    }

    window.Artifacts = { generate, addToInventory, equip, unequip, discard, describe, artifactSlots };
})();

</script>
<script>
/* ===== js/engine/queue.js ===== */
/* =========================================================
   建造队列（v1.3.0 起：队列 = 「等材料的订单列表」）
   规则：
     · 资源足够时，点击建造 / 研究 / 升级会「立即完成」，完全不进队列；
     · 资源不足时，才作为「订单」进入队列；面板上的倒计时显示的是
       「按当前净产量，还要多久才凑齐这些材料」，材料一凑齐的瞬间就立即建成并出队
       （没有第二段施工等待）；
     · 同一个目标可以反复排队（例如伐木场点两下 = 队列里两条订单）；
     · 队列槽位初始 5 个，可通过传承强化与工程类英雄提升；槽位之间互不影响。
   传承 / 英雄的「队列材料折扣」会直接降低订单要凑的材料量（最多减免 60%）。
   ========================================================= */
(function () {
    let seq = 1;

    const KIND_LABEL = { building: '建造', tech: '研究', upgrade: '升级' };
    const DISCOUNT_CAP = 0.6;      // 订单材料最多减免 60 %

    /* 队列槽位数：基础 5 + 传承 / 英雄加成 */
    function slots(state) {
        const e = EffectsManager.get(state);
        return Math.max(1, Math.floor(5 + (e.queueSlots || 0)));
    }
    /* 订单材料折扣 0 ~ DISCOUNT_CAP */
    function discount(state) {
        const e = EffectsManager.get(state);
        return Utils.clamp(e.queueDiscount || 0, 0, DISCOUNT_CAP);
    }
    function applyDiscount(cost, d) {
        if (!cost || d <= 1e-9) return cost;
        const out = {};
        for (const k in cost) out[k] = Math.max(1, Math.ceil(cost[k] * (1 - d)));
        return out;
    }
    function items(state) { return state.queue.items; }
    function used(state) { return state.queue.items.length; }
    function isFull(state) { return used(state) >= slots(state); }

    /* 目标当前是否还能下单 / 开工 */
    function validate(state, kind, name) {
        if (kind === 'building') {
            const b = state.buildings[name];
            if (!b || !b.unlocked) return '尚未解锁。';
            return null;
        }
        if (kind === 'tech') {
            const t = state.techs[name];
            if (!t || !TECHS_CONFIG[name]) return '未知科技。';
            if (t.researched) return '该科技已完成。';
            if (!ProductionEngine.techAvailable(state, name)) return '前置科技尚未完成。';
            return null;
        }
        if (kind === 'upgrade') {
            const u = state.upgrades[name];
            const cfg = UPGRADES_CONFIG[name];
            if (!u || !cfg || !u.visible) return '尚未解锁。';
            if (u.level >= cfg.cap) return '已达到等级上限。';
            return null;
        }
        return '未知的队列类型。';
    }

    /* 这批目标「原价」需要多少资源（建筑按当前已建数量逐座累加） */
    function baseCost(state, item) {
        if (item.kind === 'building') {
            const b = state.buildings[item.name];
            if (!b) return null;
            const total = {};
            for (let i = 0; i < item.count; i++) {
                const price = ProductionEngine.buildingPriceCount(state, item.name, b.count + i);
                for (const k in price) total[k] = (total[k] || 0) + price[k];
            }
            return total;
        }
        if (item.kind === 'tech') {
            const cfg = TECHS_CONFIG[item.name];
            return cfg ? Object.assign({}, cfg.cost) : null;
        }
        const u = state.upgrades[item.name];
        const cfg = UPGRADES_CONFIG[item.name];
        if (!u || !cfg) return null;
        const price = {};
        for (let i = 0; i < item.count; i++) {
            const p = ProductionEngine.upgradePriceCount(state, item.name, u.level + i);
            for (const k in p) price[k] = (price[k] || 0) + p[k];
        }
        return price;
    }

    /* 订单实际需要凑齐的材料（已应用「队列材料折扣」） */
    function currentCost(state, item) {
        return applyDiscount(baseCost(state, item), discount(state));
    }

    /* 一次能立即买得起的数量（用于「最大」与批量按钮） */
    function maxAffordable(state, name, limit) {
        const b = state.buildings[name];
        if (!b) return 0;
        const paid = {};
        let can = 0;
        for (let i = 0; i < (limit || 25); i++) {
            const price = ProductionEngine.buildingPriceCount(state, name, b.count + i);
            let ok = true;
            for (const k in price) {
                const have = (state.resources[k] ? state.resources[k].amount : 0) - (paid[k] || 0);
                if (have + 1e-9 < price[k]) { ok = false; break; }
            }
            if (!ok) break;
            for (const k in price) paid[k] = (paid[k] || 0) + price[k];
            can++;
        }
        return can;
    }

    /* 完成结算（立即完成与队列完成共用） */
    function applyComplete(state, item) {
        if (item.kind === 'building') {
            const b = state.buildings[item.name];
            if (b) {
                b.count += item.count;
                b.active += item.count;
                state.stats.totalBuildingBuilt += item.count;
            }
            EventEngine.addLog(state, '🏗️ 建成「' + item.name + '」×' + item.count + '。');
        } else if (item.kind === 'tech') {
            const t = state.techs[item.name];
            const cfg = TECHS_CONFIG[item.name];
            if (t) t.researched = true;
            EventEngine.addLog(state, '📖 完成研究「' + item.name + '」：' + (cfg ? cfg.desc : ''));
        } else {
            const u = state.upgrades[item.name];
            if (u) u.level++;
            EventEngine.addLog(state, '⚗️ 升级完成「' + item.name + '」→ 等级 ' + (u ? u.level : 1) + '。');
        }
        if (window.UI && UI.toast) {
            UI.toast((item.kind === 'tech' ? '📖 研究完成：' : (item.kind === 'upgrade' ? '⚗️ 升级完成：' : '🏗️ 建造完成：')) +
                item.name + (item.count > 1 ? ' ×' + item.count : ''), 'gold');
        }
        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
        if (item.kind === 'tech' && window.AchievementEngine) AchievementEngine.check(state);
    }

    /* ------------ 立即完成：能买多少做多少 ------------ */
    function instant(state, kind, name, count) {
        let done = 0;
        if (kind === 'building') {
            const b = state.buildings[name];
            if (!b) return 0;
            for (let i = 0; i < count; i++) {
                const price = ProductionEngine.buildingPriceCount(state, name, b.count + i);
                if (!ResourcesManager.canAfford(price)) break;
                ResourcesManager.spend(price);
                done++;
            }
            if (done) applyComplete(state, { kind: 'building', name: name, count: done });
            return done;
        }
        if (kind === 'tech') {
            const cfg = TECHS_CONFIG[name];
            if (!cfg || !ResourcesManager.canAfford(cfg.cost)) return 0;
            ResourcesManager.spend(cfg.cost);
            applyComplete(state, { kind: 'tech', name: name, count: 1 });
            return 1;
        }
        const u = state.upgrades[name];
        const cfg = UPGRADES_CONFIG[name];
        if (!u || !cfg) return 0;
        for (let i = 0; i < count && u.level < cfg.cap; i++) {
            const price = ProductionEngine.upgradePrice(state, name);
            if (!ResourcesManager.canAfford(price)) break;
            ResourcesManager.spend(price);
            applyComplete(state, { kind: 'upgrade', name: name, count: 1 });
            done++;
        }
        return done;
    }

    /* ------------ 队列订单 ------------ */
    function enqueue(state, kind, name, amount, opts) {
        opts = opts || {};
        const queueIfUnaffordable = opts.queueIfUnaffordable !== false;

        let count;
        if (amount === 'max') {
            count = kind === 'building' ? Math.max(1, maxAffordable(state, name, 25)) : 1;
            if (kind === 'building' && maxAffordable(state, name, 25) === 0) count = 1;   // 一件都买不起时排 1 件等待
        } else {
            count = Math.max(1, Math.min(25, Math.floor(amount || 1)));
        }

        const invalid = validate(state, kind, name);
        if (invalid) return { ok: false, msg: invalid };

        /* 1) 资源足够 → 立即完成，不进队列 */
        const doneNow = instant(state, kind, name, count);
        if (doneNow > 0) {
            const label = kind === 'tech' ? '研究完成：' : (kind === 'upgrade' ? '升级完成：' : '建造完成：');
            return { ok: true, instant: doneNow, msg: label + name + (doneNow > 1 ? ' ×' + doneNow : '') };
        }

        if (!queueIfUnaffordable) return { ok: false, msg: '资源不足。' };

        /* 2) 资源不足 → 进入队列等待资源 */
        if (kind === 'tech' && state.queue.items.some(it => it.kind === 'tech' && it.name === name)) {
            return { ok: false, msg: '「' + name + '」已在研究队列中。' };
        }
        if (isFull(state)) return { ok: false, msg: '队列已满（' + used(state) + ' / ' + slots(state) + '），请等待或取消一项。' };

        const item = {
            id: 'q' + (seq++),
            kind: kind, name: name, count: count,
            cost: null,                 // 成交（扣款）时的实际材料，用于撤销时退还
            est: {},                    // 当前需要凑齐的材料（含折扣，每帧重算）
        };
        item.est = currentCost(state, item) || {};
        state.queue.items.push(item);
        EventEngine.addLog(state, '📝 ' + KIND_LABEL[kind] + '「' + name + '」×' + count +
            ' 已加入队列（等待材料：' + Object.keys(item.est).map(k => k + ' ' + Utils.fmtNum(item.est[k])).join('、') + '）。');
        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
        return { ok: true, queued: count, item: item, msg: '材料不足，已排队：' + name + ' ×' + count + '（材料凑齐会自动建成）' };
    }

    /* 取消订单：还没扣过款，直接移除即可 */
    function cancel(state, id) {
        const idx = state.queue.items.findIndex(it => it.id === id);
        if (idx < 0) return { ok: false };
        const item = state.queue.items[idx];
        state.queue.items.splice(idx, 1);
        EventEngine.addLog(state, '↩️ 已取消' + KIND_LABEL[item.kind] + '「' + item.name + '」（尚未投入材料）。');
        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
        return { ok: true, msg: '已取消：' + item.name };
    }

    function clear(state) { state.queue.items = []; }

    /* 材料就绪度 0~1（面板进度条用） */
    function progress(state, item) {
        const cost = currentCost(state, item);
        if (!cost) return 0;
        let min = 1;
        for (const k in cost) {
            const r = state.resources[k];
            if (!r || cost[k] <= 0) continue;
            min = Math.min(min, Utils.clamp(r.amount / cost[k], 0, 1));
        }
        return min;
    }

    /* 某订单被「存量上限」卡住的资源名（没有则返回 null） */
    function capBlocked(state, item) {
        const cost = currentCost(state, item);
        if (!cost) return null;
        for (const k in cost) {
            const r = state.resources[k];
            if (!r || RESOURCES_CONFIG[k].prestige) continue;
            if (cost[k] > r.cap + 1e-6) return k;
        }
        return null;
    }

    /* 按当前净产量估算「还要多久才凑齐材料」（游戏日）；无法估算返回 null */
    function eta(state, item) {
        const cost = currentCost(state, item);
        if (!cost) return null;
        let worst = 0;
        for (const k in cost) {
            const r = state.resources[k];
            if (!r) return null;
            if (!RESOURCES_CONFIG[k].prestige && cost[k] > r.cap + 1e-6) return null;   // 上限不够，永远凑不齐
            const lack = cost[k] - r.amount;
            if (lack <= 1e-9) continue;
            const rate = r.production || 0;
            if (rate <= 1e-9) return null;                                              // 没有净产出，无法估算
            worst = Math.max(worst, lack / rate);
        }
        return worst;
    }
    /* 兼容旧调用：剩余等待时间 */
    function remaining(state, item) { return eta(state, item); }

    /* 每 tick：按队列顺序检查，材料凑齐的订单立即建成并出队 */
    function tick(state) {
        if (!state.queue || !state.queue.items.length) return;
        const done = [];
        for (const it of state.queue.items) {
            const invalid = validate(state, it.kind, it.name);
            if (invalid) {                       // 目标已失效（例如科技已被研究完）→ 直接撤单
                done.push(it);
                EventEngine.addLog(state, '⚠️ 订单「' + it.name + '」已失效（' + invalid + '），自动撤单。');
                continue;
            }
            const cost = currentCost(state, it);
            if (!cost) { done.push(it); continue; }
            it.est = cost;
            if (ResourcesManager.canAfford(cost)) {
                ResourcesManager.spend(cost);
                it.cost = cost;
                done.push(it);
                applyComplete(state, it);        // 材料一到手就立刻建成，不再等待第二段工期
            }
        }
        if (done.length) state.queue.items = state.queue.items.filter(it => done.indexOf(it) < 0);
    }

    /* 队列中某目标的总数量（用于卡片角标） */
    function queuedCount(state, kind, name) {
        let n = 0;
        for (const it of state.queue.items) {
            if (it.kind === kind && it.name === name) n += it.count;
        }
        return n;
    }
    /* 队列中某目标的订单状态：'waiting' | null */
    function queuedState(state, kind, name) {
        const list = state.queue.items.filter(it => it.kind === kind && it.name === name);
        if (!list.length) return null;
        return 'waiting';
    }

    window.QueueEngine = {
        slots, discount, items, used, isFull, enqueue, cancel, clear,
        progress, eta, remaining, capBlocked, tick, queuedCount, queuedState,
        currentCost, baseCost, maxAffordable,
        KIND_LABEL, DISCOUNT_CAP,
    };
})();

</script>
<script>
/* ===== js/engine/heroes.js ===== */
/* =========================================================
   英雄与传送阵（抽卡引擎）
   英雄效果 = 分类基础效果 × 稀有度倍率 × 觉醒加成
   卡池里除了英雄，还有资源奖励与「空」结果；并有 A / S / EX 三档保底。
   ========================================================= */
(function () {
    function heroById(id) {
        return HEROES_CONFIG.find(h => h.id === id) || null;
    }

    function scaleEffect(eff, mult) {
        const out = {};
        for (const k in eff) {
            const v = eff[k];
            if (typeof v === 'number') out[k] = v * mult;
            else if (typeof v === 'object' && v !== null) {
                const inner = {};
                for (const k2 in v) inner[k2] = v[k2] * mult;
                out[k] = inner;
            }
        }
        return out;
    }

    /* 单个英雄的完整效果（含额外效果，额外效果不随稀有度缩放） */
    function heroEffect(hero) {
        const cat = HERO_CATEGORIES[hero.category];
        const rarity = HERO_RARITIES[hero.rarity];
        const eff = cat ? scaleEffect(cat.effect, rarity.mult) : {};
        if (hero.extra) {
            for (const k in hero.extra) {
                if (typeof hero.extra[k] === 'number' && typeof eff[k] === 'number') eff[k] += hero.extra[k];
                else eff[k] = hero.extra[k];
            }
        }
        return eff;
    }

    function awakenMultiplier(awaken) {
        return 1 + GACHA_CONFIG.awakeningStep * (awaken || 0);
    }

    /* 所有已获得英雄提供的效果（供 effects.js 汇总） */
    function ownedEffects(state) {
        const out = [];
        if (!state.heroes || !state.heroes.owned) return out;
        for (const id in state.heroes.owned) {
            const hero = heroById(id);
            if (!hero) continue;
            out.push({
                hero: hero,
                awaken: state.heroes.owned[id] || 0,
                mult: awakenMultiplier(state.heroes.owned[id] || 0),
                effect: heroEffect(hero),
            });
        }
        return out;
    }

    /* ---------------- 召唤消耗 ---------------- */
    function pullCost(state, count) {
        count = Math.max(1, count || 1);
        const e = EffectsManager.get(state);
        const discount = Utils.clamp(e.summonDiscount || 0, 0, GACHA_CONFIG.discountCap);
        const batchMul = count >= GACHA_CONFIG.batchSize ? (1 - GACHA_CONFIG.batchDiscount) : 1;
        const cost = {};
        for (const k in GACHA_CONFIG.costs) {
            cost[k] = Math.max(1, Math.round(GACHA_CONFIG.costs[k] * count * batchMul * (1 - discount)));
        }
        return cost;
    }

    function canSummon(state, count) {
        const cost = pullCost(state, count);
        if (!ResourcesManager.canAfford(cost)) return { ok: false, msg: '召唤材料不足。', cost: cost };
        return { ok: true, cost: cost };
    }

    /* 幸运对 S / EX 权重的实际倍率（带上限，避免稀有度权重失衡） */
    function luckMultiplier(state) {
        return 1 + Math.min(EffectsManager.get(state).luck || 0, GACHA_CONFIG.luckCap);
    }
    /* 实际生效的召唤折扣（同样带上限） */
    function effectiveDiscount(state) {
        return Utils.clamp(EffectsManager.get(state).summonDiscount || 0, 0, GACHA_CONFIG.discountCap);
    }

    /* ---------------- 抽取 ---------------- */
    function pickRarity(state) {
        const pity = state.heroes.pity;
        if (pity.EX >= GACHA_CONFIG.pity.EX) return 'EX';
        if (pity.S >= GACHA_CONFIG.pity.S) return Math.random() < 0.12 ? 'EX' : 'S';
        if (pity.A >= GACHA_CONFIG.pity.A) return Utils.weightedPick(['A', 'S', 'EX'], k => HERO_RARITIES[k].weight);

        const luck = Math.min(EffectsManager.get(state).luck || 0, GACHA_CONFIG.luckCap);
        const list = [];
        for (const key in HERO_RARITIES) list.push(key);
        const heroWeight = list.reduce((sum, k) => sum + HERO_RARITIES[k].weight * (GACHA_CONFIG.luckRarities.indexOf(k) >= 0 ? (1 + luck) : 1), 0);
        const total = heroWeight + GACHA_CONFIG.rewardWeight + GACHA_CONFIG.emptyWeight;
        let roll = Math.random() * total;
        for (const k of list) {
            const w = HERO_RARITIES[k].weight * (GACHA_CONFIG.luckRarities.indexOf(k) >= 0 ? (1 + luck) : 1);
            roll -= w;
            if (roll <= 0) return k;
        }
        roll -= GACHA_CONFIG.rewardWeight;
        if (roll <= 0) return 'RESOURCE';
        return 'EMPTY';
    }

    function pickHero(rarity) {
        const pool = HEROES_CONFIG.filter(h => h.rarity === rarity);
        if (!pool.length) return HEROES_CONFIG[0];
        return pool[Math.floor(Math.random() * pool.length)];
    }

    function rollReward(state) {
        const cfg = GACHA_CONFIG;
        const pool = cfg.rewardRes.filter(r => state.resources[r] && state.resources[r].visible);
        const list = pool.length ? pool : cfg.rewardRes;
        const n = Utils.rndInt(cfg.rewardCount[0], cfg.rewardCount[1]);
        const gained = {};
        for (let i = 0; i < n; i++) {
            const res = list[Math.floor(Math.random() * list.length)];
            const r = state.resources[res];
            if (!r) continue;
            const amount = Math.max(1, Math.floor(r.cap * Utils.rnd(cfg.rewardMin, cfg.rewardMax)));
            gained[res] = (gained[res] || 0) + amount;
        }
        return { type: 'reward', resources: gained };
    }

    function rollOnce(state) {
        const rarity = pickRarity(state);
        if (rarity === 'RESOURCE') return rollReward(state);
        if (rarity === 'EMPTY') return { type: 'empty' };
        const hero = pickHero(rarity);
        return { type: 'hero', rarity: rarity, hero: hero };
    }

    function bumpPity(state, result) {
        const p = state.heroes.pity;
        const r = result.type === 'hero' ? result.rarity : null;
        const order = { C: 0, B: 1, A: 2, S: 3, EX: 4 };
        const rank = r ? order[r] : -1;
        p.A = rank >= order.A ? 0 : p.A + 1;
        p.S = rank >= order.S ? 0 : p.S + 1;
        p.EX = rank >= order.EX ? 0 : p.EX + 1;
    }

    /* 应用一次抽取结果 */
    function applyResult(state, result) {
        if (result.type === 'hero') {
            const id = result.hero.id;
            const owned = state.heroes.owned;
            if (owned[id] === undefined) {
                owned[id] = 0;
                result.isNew = true;
            } else if (owned[id] < GACHA_CONFIG.awakeningMax) {
                owned[id]++;
                result.awaken = owned[id];
            } else {
                const relic = HERO_RARITIES[result.hero.rarity].dupRelic;
                ResourcesManager.add({ 奥术遗物: relic });
                result.dupRelic = relic;
                state.heroes.dupRelics = (state.heroes.dupRelics || 0) + relic;
            }
            state.heroes.byRarity[result.hero.rarity] = (state.heroes.byRarity[result.hero.rarity] || 0) + 1;
        } else if (result.type === 'reward') {
            ResourcesManager.add(result.resources);
        }
        state.heroes.pulls = (state.heroes.pulls || 0) + 1;
        bumpPity(state, result);
        state.heroes.history.unshift({
            type: result.type,
            rarity: result.rarity || null,
            name: result.hero ? result.hero.name : (result.type === 'reward' ? '资源馈赠' : '虚空回响'),
            isNew: !!result.isNew,
            awaken: result.awaken,
            day: state.gameDays,
        });
        if (state.heroes.history.length > 30) state.heroes.history.pop();
    }

    /* 召唤 count 次 */
    function summon(state, count) {
        count = Math.floor(count || 0);
        if (count < 1) return { ok: false, msg: '召唤次数无效。' };
        const check = canSummon(state, count);
        if (!check.ok) return check;
        ResourcesManager.spend(check.cost);
        const results = [];
        for (let i = 0; i < count; i++) {
            const result = rollOnce(state);
            applyResult(state, result);
            results.push(result);
        }
        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
        if (window.AchievementEngine) AchievementEngine.check(state);
        const best = results.reduce((acc, r) => {
            if (r.type !== 'hero') return acc;
            const order = { C: 0, B: 1, A: 2, S: 3, EX: 4 };
            return (order[r.rarity] > order[acc]) ? r.rarity : acc;
        }, 'C');
        const heroNames = results.filter(r => r.type === 'hero').map(r => r.hero.name).join('、');
        EventEngine.addLog(state, '🔮 传送阵召唤 ×' + count + '，最高获得 ' + best + ' 级' +
            (heroNames ? '（' + heroNames + '）' : '（无英雄回应）'));
        return { ok: true, results: results, best: best, msg: '召唤完成：获得 ' + results.length + ' 项结果' };
    }

    /* 汇总统计 */
    function stats(state) {
        const h = state.heroes;
        const owned = Object.keys(h.owned).length;
        const total = HEROES_CONFIG.length;
        return {
            pulls: h.pulls || 0,
            owned: owned,
            total: total,
            byRarity: h.byRarity,
            dupRelics: h.dupRelics || 0,
            pity: h.pity,
            fullCollection: owned >= total,
        };
    }

    function ownedCount(state, rarity) {
        let n = 0;
        for (const id in state.heroes.owned) {
            const hero = heroById(id);
            if (hero && hero.rarity === rarity) n++;
        }
        return n;
    }
    function totalCount(rarity) {
        return HEROES_CONFIG.filter(h => h.rarity === rarity).length;
    }

    window.Heroes = {
        heroById, heroEffect, awakenMultiplier, ownedEffects,
        pullCost, canSummon, summon, stats, ownedCount, totalCount,
        luckMultiplier, effectiveDiscount,
    };
})();

</script>
<script>
/* ===== js/engine/expedition.js ===== */
/* =========================================================
   遗迹远征：派出队伍 → 等待若干游戏日 → 按军力判定成败
   ========================================================= */
(function () {
    function findRegion(name) { return EXPEDITIONS_CONFIG.find(r => r.name === name); }

    function successChance(state, region) {
        const power = state.localResources.power.amount * (1 + EffectsManager.additive(state, 'expeditionPower'));
        const ratio = power / Math.max(1, region.power);
        return Utils.clamp(0.25 + 0.45 * Math.log10(1 + ratio * 3), 0.05, 0.98);
    }

    function canStart(state, region) {
        if (state.expedition.active) return { ok: false, msg: '远征队仍在外面。' };
        if (!ResourcesManager.canAfford(region.cost)) return { ok: false, msg: '物资不足。', lack: ResourcesManager.missing(region.cost) };
        return { ok: true };
    }

    function start(state, name) {
        const region = findRegion(name);
        if (!region) return { ok: false, msg: '未知区域。' };
        const check = canStart(state, region);
        if (!check.ok) return check;
        ResourcesManager.spend(region.cost);
        state.expedition.active = {
            region: name,
            startDay: state.gameDays,
            endDay: state.gameDays + region.days,
            duration: region.days,
        };
        return { ok: true, msg: '远征队已出发前往「' + name + '」。' };
    }

    function progress(state) {
        const a = state.expedition.active;
        if (!a) return 0;
        return Utils.clamp((state.gameDays - a.startDay) / Math.max(1e-6, a.endDay - a.startDay), 0, 1);
    }

    function remaining(state) {
        const a = state.expedition.active;
        if (!a) return 0;
        return Math.max(0, a.endDay - state.gameDays);
    }

    function rollLoot(state, region, factor) {
        const gained = {};
        for (const res in region.loot) {
            const range = region.loot[res];
            let amount = Utils.rnd(range[0], range[1]) * factor;
            if (amount > 0) gained[res] = Math.floor(amount * 100) / 100;
        }
        if (region.relics && region.relics[1] > 0) {
            const relics = region.relics[0] + Utils.rnd(0, region.relics[1] - region.relics[0]);
            gained['奥术遗物'] = (gained['奥术遗物'] || 0) + Math.floor(relics * factor);
        }
        return gained;
    }

    /* 结算（由主循环在到点时调用） */
    function finish(state) {
        const a = state.expedition.active;
        if (!a) return null;
        const region = findRegion(a.region);
        if (!region) { state.expedition.active = null; return null; }

        const rewardMult = (1 + EffectsManager.additive(state, 'expeditionReward'));
        const chance = successChance(state, region);
        const success = Math.random() < chance;
        const factor = (success ? 1 : 0.25) * rewardMult;
        const loot = rollLoot(state, region, factor);

        let artifact = null;
        if (success && Math.random() < region.artifact * Utils.clamp(1 + EffectsManager.additive(state, 'artifactQuality'), 0.5, 3)) {
            artifact = window.Artifacts ? Artifacts.generate(state, region.tier) : null;
        }

        for (const res in loot) ResourcesManager.add({ [res]: loot[res] });

        state.stats.expeditions++;
        if (!success) state.stats.expeditionsFailed++;

        const record = {
            region: region.name,
            day: state.gameDays,
            success: success,
            chance: chance,
            loot: loot,
            artifact: artifact ? artifact.name : null,
        };
        state.expedition.history.unshift(record);
        if (state.expedition.history.length > 30) state.expedition.history.pop();

        const name = region.name;
        state.expedition.active = null;

        return Object.assign(record, { regionName: name, artifactObj: artifact });
    }

    window.ExpeditionEngine = {
