        findRegion, successChance, canStart, start, progress, remaining, finish,
    };
})();

</script>
<script>
/* ===== js/engine/eventengine.js ===== */
/* 随机事件引擎 + 临时效果（增益/减益）管理 */
(function () {
    let effectSeq = 1;

    function buff(state, name, days, effect, desc, opts) {
        opts = opts || {};
        state.activeEffects = state.activeEffects.filter(x => x.name !== name);
        state.activeEffects.push({
            id: 'eff' + (effectSeq++),
            name: name,
            desc: desc || '',
            effect: effect,
            remain: days,
            total: days,
            mood: !!opts.mood,
        });
    }

    function tickEffects(state, dt) {
        if (!state.activeEffects.length) return;
        const expired = [];
        state.activeEffects = state.activeEffects.filter(ae => {
            ae.remain -= dt;
            if (ae.remain <= 0) { expired.push(ae); return false; }
            return true;
        });
        for (const ae of expired) {
            if (!ae.mood) addLog(state, '「' + ae.name + '」的效果已经结束。');
        }
    }

    function addLog(state, text) {
        state.eventLogs.unshift({ day: state.gameDays, text: text });
        if (state.eventLogs.length > 60) state.eventLogs.pop();
    }

    /* 事件中可用的操作接口 */
    function makeApi(state) {
        return {
            state: state,
            rnd: () => Math.random(),
            log: t => addLog(state, t),
            has: (res, amount) => ResourcesManager.amount(res) >= (amount === undefined ? 1 : amount),
            give: map => { ResourcesManager.add(map); },
            take: map => {
                for (const k in map) {
                    const r = state.resources[k];
                    if (!r) continue;
                    r.amount = Math.max(0, r.amount - map[k]);
                }
            },
            happy: (v, days) => buff(state, v >= 0 ? '民心振奋' : '民心低落', days || 720, { happiness: v }, '事件带来的民望变化', { mood: true }),
            buff: (name, label, days, effect, desc) => buff(state, label, days, effect, desc),
            artifact: tier => {
                const a = Artifacts.generate(state, tier || 3);
                Artifacts.addToInventory(state, a);
                return a;
            },
        };
    }

    function availableEvents(state) {
        const out = [];
        for (const ev of EVENTS_CONFIG) {
            if (state.gameDays < ev.minDay) continue;
            if (ev.once && state.stats['ev_' + ev.id]) continue;
            /* 只出现「资源仓储量够用」的事件：所有选项的消耗都不能超过对应资源的上限 */
            if (!eventFitsStorage(state, ev)) continue;
            let ok = true;
            try { ok = ev.require(state); } catch (e) { ok = false; }
            if (ok) out.push(ev);
        }
        return out;
    }

    /* 单项消耗是否落在仓储上限之内 */
    function costFitsCaps(state, cost) {
        for (const r in (cost || {})) {
            const res = state.resources[r];
            if (!res) return false;                      // 该资源还没解锁
            if (res.cap + 1e-9 < cost[r]) return false;
        }
        return true;
    }

    /* 整个事件是否够格出现：任一选项的需求超出上限就跳过这个事件 */
    function eventFitsStorage(state, ev) {
        for (const c of ev.choices) {
            if (!costFitsCaps(state, c.cost)) return false;
            if (c.needPower && state.localResources.power.capacity + 1e-9 < c.needPower) return false;
        }
        return true;
    }

    /* 选项此刻是否点得动：看「现有存量」是否够，而不是上限 */
    function choicePayable(state, choice) {
        if (!choice) return false;
        if (choice.cost && Object.keys(choice.cost).length && !ResourcesManager.canAfford(choice.cost)) return false;
        if (choice.needPower && state.localResources.power.amount + 1e-9 < choice.needPower) return false;
        return true;
    }

    function scheduleNext(state) {
        state.nextEventDay = state.gameDays + Utils.rnd(200, 460);
    }

    function tick(state, dt) {
        tickEffects(state, dt);
        if (state.pendingEvent) return;
        if (state.gameDays < state.nextEventDay) return;
        const pool = availableEvents(state);
        if (!pool.length) { scheduleNext(state); return; }
        const ev = Utils.weightedPick(pool, e => e.weight);
        if (!ev) { scheduleNext(state); return; }
        state.pendingEvent = ev.id;
        state.stats.events++;
        scheduleNext(state);
    }

    function current(state) {
        if (!state.pendingEvent) return null;
        return EVENTS_CONFIG.find(e => e.id === state.pendingEvent) || null;
    }

    function resolve(state, index) {
        const ev = current(state);
        if (!ev) return null;
        const choice = ev.choices[index];
        if (!choice) return null;
        if (!choicePayable(state, choice)) {
            return { ok: false, msg: '资源或军力不足，无法选择这个选项。' };
        }
        const api = makeApi(state);
        try { choice.run(api); } catch (err) { console.error('事件执行出错', err); }
        state.stats['ev_' + ev.id] = true;
        state.pendingEvent = null;
        addLog(state, '【' + ev.title + '】你选择了：' + choice.text);
        ProductionEngine.computeProductionAndCaps(state);
        ProductionEngine.updatePrices(state);
        return choice;
    }

    /* 预览某个选项「扣什么、得什么」：
       用只记录、不生效的假接口把 run 跑两遍（rnd 分别返回 0 与 1），把随机分支都覆盖到；
       条件分支（例如「军力是否足够」）按玩家当前状态走，所以预览与此刻的真实结果一致。 */
    function preview(state, ev, index) {
        const choice = (ev && ev.choices && ev.choices[index]) || null;
        if (!choice || typeof choice.run !== 'function') return null;
        const runs = [];
        for (const rndValue of [0, 1]) {
            const taken = {}, given = {}, happy = [], buffs = [];
            const api = {
                state: state,
                rnd: () => rndValue,
                has: (res, amount) => ResourcesManager.amount(res) >= (amount === undefined ? 1 : amount),
                log: () => {},
                give: map => { for (const k in map) given[k] = Math.max(given[k] || 0, map[k]); },
                take: map => { for (const k in map) taken[k] = Math.max(taken[k] || 0, map[k]); },
                happy: v => { if (happy.indexOf(v) < 0) happy.push(v); },
                buff: (name, label, days, effect) => { buffs.push({ label: label, days: days, effect: effect || {} }); },
                artifact: () => null,
            };
            try { choice.run(api); } catch (e) { /* 预览失败不影响游戏 */ }
            runs.push({ taken: taken, given: given, happy: happy, buffs: buffs });
        }
        const cost = {}, gain = {};
        for (const r of runs) {
            for (const k in r.taken) cost[k] = Math.max(cost[k] || 0, r.taken[k]);
            for (const k in r.given) {
                const cur = gain[k];
                gain[k] = cur === undefined
                    ? { min: r.given[k], max: r.given[k] }
                    : { min: Math.min(cur.min, r.given[k]), max: Math.max(cur.max, r.given[k]) };
            }
        }
        const happy = [];
        for (const r of runs) for (const v of r.happy) if (happy.indexOf(v) < 0) happy.push(v);
        const buffs = [];
        for (const r of runs) for (const b of r.buffs) if (!buffs.some(x => x.label === b.label)) buffs.push(b);
        return { cost: cost, gain: gain, happy: happy, buffs: buffs };
    }

    window.EventEngine = {
        tick, tickEffects, buff, addLog, current, resolve, availableEvents, scheduleNext,
        choicePayable, costFitsCaps, eventFitsStorage, preview,
    };
})();

</script>
<script>
/* ===== js/engine/achievements.js ===== */
/* 成就检测 */
(function () {
    let pending = [];

    function check(state) {
        for (const cfg of ACHIEVEMENTS_CONFIG) {
            if (state.achievements[cfg.id]) continue;
            let ok = false;
            try { ok = cfg.cond(state); } catch (e) { ok = false; }
            if (!ok) continue;
            state.achievements[cfg.id] = true;
            pending.push(cfg);
            EventEngine.addLog(state, '🏆 解锁成就「' + cfg.name + '」' + (cfg.effectText ? '：' + cfg.effectText : ''));
        }
        if (pending.length) {
            ProductionEngine.computeProductionAndCaps(state);
            if (window.UI && UI.toast) {
                for (const c of pending) UI.toast('🏆 成就解锁：' + c.name + (c.effectText ? '（' + c.effectText + '）' : ''), 'gold');
            }
            pending = [];
        }
    }

    window.AchievementEngine = { check };
})();

</script>
<script>
/* ===== js/engine/actions.js ===== */
/* =========================================================
   玩家操作 & 重置（传承）逻辑
   ========================================================= */
(function () {

    /* ---------------- 建筑 ---------------- */
    /* 购买建筑：资源足够立即建成；不足则作为订单进入队列等待资源 */
    function buyBuilding(state, name, amount) {
        const res = QueueEngine.enqueue(state, 'building', name, amount === undefined ? 1 : amount);
        if (!res.ok) return { ok: false, msg: res.msg };
        return { ok: true, built: res.instant || 0, queued: res.queued || 0, msg: res.msg };
    }

    function setBuildingActive(state, name, active) {
        const b = state.buildings[name];
        if (!b) return;
        if (active === 'toggle') active = b.active > 0 ? 0 : b.count;
        if (active === 'all') active = b.count;
        b.active = Utils.clamp(Math.round(active), 0, b.count);
        if (b.active === 0) b.efficiency = 1;
        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
    }

    function setBuildingMode(state, name, mode) {
        const b = state.buildings[name];
        const cfg = BUILDINGS_CONFIG[name];
        if (!b || !cfg || !cfg.modes) return;
        b.mode = Utils.clamp(mode, 0, cfg.modes.length - 1);
        ProductionEngine.computeProductionAndCaps(state);
    }

    /* ---------------- 科技 ---------------- */
    function research(state, name) {
        const res = QueueEngine.enqueue(state, 'tech', name, 1);
        return res.ok ? { ok: true, msg: res.msg } : { ok: false, msg: res.msg };
    }

    /* ---------------- 升级 ---------------- */
    function buyUpgrade(state, name) {
        const res = QueueEngine.enqueue(state, 'upgrade', name, 1);
        return res.ok ? { ok: true, msg: res.msg } : { ok: false, msg: res.msg };
    }

    /* ---------------- 国策 ---------------- */
    function setPolicy(state, name, value) {
        const p = state.policies[name];
        const cfg = POLICIES_CONFIG[name];
        if (!p || !cfg || !p.visible) return { ok: false };
        value = Utils.clamp(Math.round(value), cfg.min, cfg.max);
        const delta = Math.abs(value - p.value);
        const cost = Math.ceil(delta * cfg.cost * 0.5);
        if (cost > 0) {
            if (state.resources['政策点'].amount + 1e-9 < cost) {
                return { ok: false, msg: '政策点不足（需要 ' + cost + ' 点）。' };
            }
            state.resources['政策点'].amount -= cost;
        }
        p.value = value;
        ProductionEngine.computeProductionAndCaps(state);
        return { ok: true, cost: cost };
    }

    /* ---------------- 传承（永久强化） ---------------- */
    function permanentCost(state, name) {
        const cfg = PERMANENT_CONFIG[name];
        const lvl = state.permanent[name].level;
        const res = cfg.tree === 'relic' ? '奥术遗物' : (cfg.tree === 'star' ? '星辉' : '原初之核');
        return { res: res, amount: Math.ceil(cfg.cost * Math.pow(cfg.costG, lvl)) };
    }

    function buyPermanent(state, name) {
        const cfg = PERMANENT_CONFIG[name];
        const p = state.permanent[name];
        if (!cfg || !p) return { ok: false };
        if (!permVisible(state, name)) {
            return { ok: false, msg: '这项强化要在研究「' + cfg.techReq + '」之后才会出现。' };
        }
        if (p.level >= cfg.max) return { ok: false, msg: '已达最高等级。' };
        if (cfg.req && state.permanent[cfg.req] && !state.permanent[cfg.req].level) {
            return { ok: false, msg: '需要先解锁「' + cfg.req + '」。' };
        }
        const c = permanentCost(state, name);
        if (state.resources[c.res].amount + 1e-9 < c.amount) return { ok: false, msg: c.res + '不足。' };
        state.resources[c.res].amount -= c.amount;
        p.level++;
        p.researched = true;
        EventEngine.addLog(state, '✦ 传承强化「' + name + '」提升至 ' + p.level + ' 级，消耗 ' + c.amount + ' ' + c.res + '。');
        ProductionEngine.computeProductionAndCaps(state);
        return { ok: true, msg: name + ' → ' + p.level + ' 级' };
    }

    /* 传承项是否可以出现：它依赖的系统（科技）没解锁之前就先不显示 */
    function permVisible(state, name) {
        const cfg = PERMANENT_CONFIG[name];
        if (!cfg) return false;
        if (cfg.techReq) {
            const t = state.techs[cfg.techReq];
            if (!t || !t.researched) return false;
        }
        return true;
    }

    /* ---------------- 试炼 ---------------- */
    function toggleChallenge(state, id) {
        const c = state.challenges[id];
        if (!c) return { ok: false };
        c.active = !c.active;
        ProductionEngine.computeProductionAndCaps(state);
        return { ok: true, msg: (c.active ? '开启' : '关闭') + '试炼「' + id + '」' };
    }

    function activeStars(state) {
        let stars = 0;
        for (const cfg of CHALLENGES_CONFIG) {
            const st = state.challenges[cfg.id];
            if (st && st.active) stars += cfg.star;
        }
        return stars;
    }

    /* ---------------- 重置收益 ---------------- */
    function relicGain(state) {
        const knowledgeCap = state.resources['魔法知识'].cap;
        const popCap = state.localResources.population.capacity;
        const towers = state.buildings['时之沙漏'].count + state.buildings['星辰塔'].count;
        const base = Math.pow(Math.log(Math.max(1, knowledgeCap) + 1), 2) + popCap / 15;
        const bMult = 1 + 0.03 * towers;
        const eMult = (1 + EffectsManager.additive(state, 'relicGain')) * (1 + EffectsManager.additive(state, 'resetGain'));
        const starMult = 1 + activeStars(state) * 0.05;
        return Math.floor(base * bMult * eMult * starMult);
    }

    function starGain(state) {
        const relics = ResourcesManager.amount('奥术遗物');
        const eMult = (1 + EffectsManager.additive(state, 'resetGain'));
        const starMult = 1 + activeStars(state) * 0.05;
        return Math.max(1, Math.floor(Math.sqrt(Math.max(1, relics)) * 0.6 * eMult * starMult));
    }

    function coreGain(state) {
        const stars = ResourcesManager.amount('星辉');
        const eMult = (1 + EffectsManager.additive(state, 'resetGain'));
        const starMult = 1 + activeStars(state) * 0.05;
        return Math.max(1, Math.floor(Math.sqrt(Math.max(1, stars)) / 4 * eMult * starMult));
    }

    function resetAvailability(state) {
        return {
            relic: state.resources['魔法知识'].cap >= 200,
            star: ResourcesManager.amount('奥术遗物') >= 300,
            core: ResourcesManager.amount('星辉') >= 60,
        };
    }

    /* 重置：清空非传承进度，按 opts 补发传承资源 */
    function performReset(state, opts) {
        opts = opts || {};
        const keepArtifacts = EffectsManager.hasSpecial(state, 'keepArtifacts');
        const oldArtifacts = { inventory: state.artifacts.inventory, equipped: state.artifacts.equipped };

        /* 重置前记录试炼完成情况 */
        const stars = activeStars(state);
        if (stars > state.stats.maxChallengeStars) state.stats.maxChallengeStars = stars;
        for (const cfg of CHALLENGES_CONFIG) {
            const st = state.challenges[cfg.id];
            if (!st || !st.active || st.completed) continue;
            const need = cfg.requireReset;
            if (need === 'any' || need === opts.type) {
                st.completed = true;
                EventEngine.addLog(state, '⚔️ 完成试炼「' + cfg.id + '」，永久获得：' + cfg.rewardText);
                if (window.UI && UI.toast) UI.toast('⚔️ 试炼完成：' + cfg.id, 'gold');
            }
        }

        const keepRelic = ResourcesManager.amount('奥术遗物');
        const keepStar = ResourcesManager.amount('星辉');
        const keepCore = ResourcesManager.amount('原初之核');
        const achievements = state.achievements;
        const stats = state.stats;
        const settings = state.settings;
        const permanent = state.permanent;
        const challenges = state.challenges;
        const heroes = state.heroes;              // 英雄收藏跨重置保留
        const expeditionHistory = state.expedition.history;

        /* 重新初始化，再恢复保留项 */
        initState();
        state.achievements = achievements;
        state.stats = stats;
        state.settings = settings;
        state.permanent = permanent;
        state.challenges = challenges;
        state.heroes = heroes;
        state.expedition.history = expeditionHistory;
        state.resources['奥术遗物'].amount = keepRelic + (opts.relic || 0);
        state.resources['星辉'].amount = keepStar + (opts.star || 0);
        state.resources['原初之核'].amount = keepCore + (opts.core || 0);
        state.stats.resets[opts.type] = (state.stats.resets[opts.type] || 0) + 1;
        state.stats.history.unshift({ day: state.stats.playSeconds, type: opts.type });
        if (state.stats.history.length > 50) state.stats.history.pop();

        /* 文明火种：重置后的启动资源 */
        grantStartResources(state);

        /* 文明薪火：自动研究第一时代科技 */
        const autoTech = state.permanent['文明薪火'] ? state.permanent['文明薪火'].level : 0;
        if (autoTech > 0) {
            const era1 = TECHS_ORDER.filter(n => TECHS_CONFIG[n].era === 1);
            const count = autoTech >= 3 ? era1.length : (autoTech === 2 ? 4 : 1);
            for (let i = 0; i < Math.min(count, era1.length); i++) {
                state.techs[era1[i]].researched = true;
            }
        }

        /* 秘宝 */
        if (keepArtifacts) {
            state.artifacts.inventory = (oldArtifacts.inventory || []).filter(a => true);
            state.artifacts.equipped = (oldArtifacts.equipped || []).filter(Boolean);
        }
        /* 脆弱秘宝在重置中碎裂 */
        state.artifacts.inventory = state.artifacts.inventory.filter(a => {
            if (a.fragile) { EventEngine.addLog(state, '💔 脆弱秘宝「' + a.name + '」在时间崩塌中碎裂了。'); return false; }
            return true;
        });
        state.artifacts.equipped = state.artifacts.equipped.map(a => {
            if (a && a.fragile) { EventEngine.addLog(state, '💔 脆弱秘宝「' + a.name + '」在时间崩塌中碎裂了。'); return null; }
            return a;
        });

        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
        EventEngine.addLog(state, '🕯️ ' + (opts.label || '重置') + '完成，文明在废墟上重新开始。');
        return true;
    }

    /* 重置后的启动资源（含「文明火种」传承加成）
       注意：启动物资必须同时抬高对应资源的基础上限，否则会被仓库上限直接截断，
       玩家看到的就只是「上限满了」，像是传承没生效。 */
    function grantStartResources(state) {
        const e = EffectsManager.refreshAllEffects(state);
        const gift = e.startResources > 0 ? { 木材: 300, 石料: 200, 食物: 100, 魔力: 80 } : null;
        state.resources['木材'].amount += 25;
        state.resources['石料'].amount += 15;
        if (gift) {
            for (const k in gift) {
                const r = state.resources[k];
                if (!r) continue;
                r.baseCap = (r.baseCap || r.cap) + gift[k];
                r.cap = Math.max(r.cap, r.baseCap);
            }
            ResourcesManager.add(gift);
        }
    }

    function prestige(state, type) {
        const avail = resetAvailability(state);
        if (type === 'relic') {
            if (!avail.relic) return { ok: false, msg: '需要魔法知识上限达到 200。' };
            const gain = relicGain(state);
            performReset(state, { type: 'relic', relic: gain, label: '时空回响' });
            return { ok: true, msg: '时空回响！获得 ' + Utils.fmtInt(gain) + ' 奥术遗物。' };
        }
        if (type === 'star') {
            if (!avail.star) return { ok: false, msg: '需要持有 300 枚奥术遗物。' };
            const relics = relicGain(state) * 2;
            const stars = starGain(state);
            performReset(state, { type: 'star', relic: relics, star: stars, label: '星辰升华' });
            return { ok: true, msg: '星辰升华！获得 ' + Utils.fmtInt(relics) + ' 奥术遗物与 ' + Utils.fmtInt(stars) + ' 星辉。' };
        }
        if (type === 'core') {
            if (!avail.core) return { ok: false, msg: '需要持有 60 枚星辉。' };
            const relics = relicGain(state) * 5;
            const stars = Math.floor(starGain(state) * 1.5);
            const cores = coreGain(state);
            performReset(state, { type: 'core', relic: relics, star: stars, core: cores, label: '原初归寂' });
            return { ok: true, msg: '原初归寂！获得 ' + Utils.fmtInt(cores) + ' 原初之核、' + Utils.fmtInt(stars) + ' 星辉与 ' + Utils.fmtInt(relics) + ' 奥术遗物。' };
        }
        return { ok: false };
    }

    /* ---------------- 自动化 ---------------- */
    function autoBuildStep(state) {
        if (!state.settings.autoBuild) return null;
        if (!EffectsManager.hasSpecial(state, 'autoBuild')) return null;
        if (QueueEngine.isFull(state)) return null;                       // 队列满了就先等
        if (!EffectsManager.hasSpecial(state, 'perfectEfficiency') && state.localResources.population.used >= state.localResources.population.capacity) return null;
        let best = null, bestPrice = null;
        for (const name in state.buildings) {
            const b = state.buildings[name];
            if (!b.unlocked || b.visible === false) continue;
            const price = ProductionEngine.buildingPrice(state, name);
            if (!ResourcesManager.canAfford(price)) continue;
            let total = 0;
            for (const k in price) total += price[k] / Math.max(1e-9, state.resources[k].cap);
            if (!best || total < bestPrice) { best = name; bestPrice = total; }
        }
        if (!best) return null;
        /* 自动化只做「立即建成」，不会把买不起的东西塞进队列 */
        return QueueEngine.enqueue(state, 'building', best, 1, { queueIfUnaffordable: false });
    }

    function autoExpeditionStep(state) {
        if (!state.settings.autoExpedition) return null;
        if (!EffectsManager.hasSpecial(state, 'autoExpedition')) return null;
        if (state.expedition.active) return null;
        const last = state.expedition.history[0];
        const order = last ? last.region : null;
        const regions = EXPEDITIONS_CONFIG.slice().reverse();
        for (const r of regions) {
            if (!order || r.name !== order) continue;
            const check = ExpeditionEngine.canStart(state, r);
            if (check.ok) return startExpedition(state, r.name);
            return null;
        }
        return null;
    }

    function startExpedition(state, name) {
        const res = ExpeditionEngine.start(state, name);
        if (res.ok) ProductionEngine.computeProductionAndCaps(state);
        return res;
    }

    window.Actions = {
        buyBuilding, setBuildingActive, setBuildingMode,
        research, buyUpgrade, setPolicy, buyPermanent, permanentCost, permVisible,
        toggleChallenge, activeStars, relicGain, starGain, coreGain, resetAvailability,
        prestige, performReset, autoBuildStep, autoExpeditionStep, startExpedition,
    };
})();

</script>
<script>
/* ===== js/engine/save.js ===== */
/* 存档：本地存储、导入导出、离线收益 */
(function () {
    /* 存档键：改名后使用新键，但会读取旧键并自动迁移，避免老玩家丢档 */
    const SAVE_KEY = 'arcane-embers-save';
    const LEGACY_SAVE_KEYS = ['magic-rebuilder-save'];

    function readRaw() {
        try {
            const cur = localStorage.getItem(SAVE_KEY);
            if (cur) return { raw: cur, key: SAVE_KEY };
        } catch (e) { /* 忽略 */ }
        for (const k of LEGACY_SAVE_KEYS) {
            try {
                const old = localStorage.getItem(k);
                if (old) return { raw: old, key: k };
            } catch (e) { /* 忽略 */ }
        }
        return null;
    }

    function serialize(state) {
        const data = {};
        for (const k in state) {
            if (k === 'effects') continue;
            data[k] = state[k];
        }
        data.lastSave = Date.now();
        return JSON.stringify(data);
    }

    function save(state) {
        try {
            localStorage.setItem(SAVE_KEY, serialize(state));
            state.lastSave = Date.now();
            return true;
        } catch (e) {
            console.warn('保存失败', e);
            return false;
        }
    }

    function hasSave() {
        return !!readRaw();
    }

    /* 把存档数据应用到全局状态（缺失字段用默认值补齐） */
    function applyData(state, data) {
        initState();
        for (const k in data) {
            if (k === 'effects') continue;
            state[k] = data[k];
        }
        /* 兼容新增内容 */
        for (const k in RESOURCES_CONFIG) {
            if (!state.resources[k]) state.resources[k] = { amount: 0, cap: RESOURCES_CONFIG[k].cap, baseCap: RESOURCES_CONFIG[k].cap, production: 0, visible: false };
        }
        for (const k in BUILDINGS_CONFIG) {
            if (!state.buildings[k]) state.buildings[k] = { count: 0, active: 0, visible: false, locked: false, price: {}, efficiency: 1, mode: 0 };
            else if (typeof state.buildings[k].mode !== 'number') state.buildings[k].mode = 0;
        }
        for (const k in TECHS_CONFIG) if (!state.techs[k]) state.techs[k] = { researched: false, visible: false };
        for (const k in UPGRADES_CONFIG) if (!state.upgrades[k]) state.upgrades[k] = { level: 0, visible: false, price: {} };
        for (const k in POLICIES_CONFIG) if (!state.policies[k]) state.policies[k] = { value: POLICIES_CONFIG[k].def, visible: false };
        for (const k in PERMANENT_CONFIG) if (!state.permanent[k]) state.permanent[k] = { level: 0, researched: false };
        for (const c of CHALLENGES_CONFIG) if (!state.challenges[c.id]) state.challenges[c.id] = { active: false, completed: false };
        if (!state.artifacts) state.artifacts = { inventory: [], equipped: [], slots: 3 };
        if (!Array.isArray(state.artifacts.equipped)) state.artifacts.equipped = [];
        if (!state.queue || !Array.isArray(state.queue.items)) state.queue = { items: [] };
        /* 旧队列条目兼容：
           v1.1「先付款、后施工」与 v1.2「等资源 → 施工」两代存档里的订单，
           统一转成 v1.3 的「等材料的订单」；已经付过款的把材料退回，避免重复扣费。 */
        for (const it of state.queue.items) {
            if (it.state === 'building' && it.cost) {
                for (const k in it.cost) {
                    const r = state.resources[k];
                    if (r) r.amount = Math.min(r.cap, r.amount + it.cost[k]);
                }
            }
            delete it.state;
            delete it.dur;
            delete it.start;
            delete it.end;
            it.cost = null;
            if (!it.est) it.est = {};
        }
        if (!state.heroes) state.heroes = freshHeroes();
        else {
            if (!state.heroes.owned) state.heroes.owned = {};
            if (!state.heroes.pity) state.heroes.pity = { A: 0, S: 0, EX: 0 };
            if (state.heroes.pulls === undefined) state.heroes.pulls = 0;
            if (!state.heroes.byRarity) state.heroes.byRarity = { C: 0, B: 0, A: 0, S: 0, EX: 0 };
            if (state.heroes.dupRelics === undefined) state.heroes.dupRelics = 0;
            if (!Array.isArray(state.heroes.history)) state.heroes.history = [];
        }
        if (!state.expedition) state.expedition = { active: null, auto: false, history: [] };
        if (!state.stats) state.stats = { playSeconds: 0, resets: { relic: 0, star: 0, core: 0 }, expeditions: 0, expeditionsFailed: 0, artifactsFound: 0, maxChallengeStars: 0, events: 0, history: [] };
        if (!state.settings) state.settings = { theme: 'dark', autosave: true, autoBuild: true, autoExpedition: true, buyAmount: 1 };
        if (!state.market) state.market = { resources: {}, heat: {}, volume: 0, trades: 0 };
        for (const k in RESOURCES_CONFIG) {
            if (!RESOURCES_CONFIG[k].prestige && !state.market.resources[k]) state.market.resources[k] = { mode: 'off', level: 1 };
            if (state.market.heat[k] === undefined) state.market.heat[k] = 1;
        }
        if (!Array.isArray(state.activeEffects)) state.activeEffects = [];
        if (!Array.isArray(state.eventLogs)) state.eventLogs = [];
        if (state.pendingEvent === undefined) state.pendingEvent = null;
        ProductionEngine.updatePrices(state);
        ProductionEngine.computeProductionAndCaps(state);
    }

    function load(state) {
        const found = readRaw();
        if (!found) return false;
        try {
            const data = JSON.parse(found.raw);
            if (!data || typeof data !== 'object') return false;
            const seconds = data.lastTick ? Math.max(0, (Date.now() - data.lastTick) / 1000) : 0;
            applyData(state, data);
            state.pendingEvent = null;
            if (seconds > 60) applyOffline(state, seconds);
            state.lastTick = Date.now();
            if (found.key !== SAVE_KEY) {
                /* 从旧名字的存档迁移到新键 */
                save(state);
                try { localStorage.removeItem(found.key); } catch (e) { /* 忽略 */ }
                EventEngine.addLog(state, '📜 存档已迁移到新版本（秘法余烬）。');
            }
            return true;
        } catch (e) {
            console.error('读档失败', e);
            return false;
        }
    }

    function applyOffline(state, seconds) {
        const maxSec = (2 + EffectsManager.additive(state, 'offlineHours')) * 3600;
        const capped = Math.min(seconds, maxSec);
        if (capped < 60) return null;
        const speed = state.speed || 1;
        const days = capped * speed;
        const factor = EffectsManager.hasSpecial(state, 'offlinePerfect') ? 1 : 0.5;
        const gains = {};
        for (const k in state.resources) {
            const r = state.resources[k];
            if (RESOURCES_CONFIG[k].prestige) continue;
            if (r.production > 0) {
                const g = r.production * days * factor;
                const before = r.amount;
                r.amount = Math.min(r.cap, r.amount + g);
                if (r.amount - before > 1e-6) gains[k] = r.amount - before;
            }
        }
        state.gameDays += days;
        state.offlineReport = {
            seconds: capped,
            realSeconds: seconds,
            days: days,
            factor: factor,
            gains: gains,
            efficiency: factor,
        };
        EventEngine.addLog(state, '🌙 离线 ' + Utils.fmtDuration(seconds) + '（结算 ' + Utils.fmtDuration(capped) + '，效率 ' + effectivePct(factor) + '）');
        return state.offlineReport;
    }

    function effectivePct(f) { return Math.round(f * 100) + '%'; }

    function exportSave(state) {
        const json = serialize(state);
        try { return btoa(unescape(encodeURIComponent(json))); }
        catch (e) { return json; }
    }

    function importSave(state, text) {
        text = (text || '').trim();
        if (!text) return { ok: false, msg: '存档内容为空。' };
        let json = text;
        if (text[0] !== '{') {
            try { json = decodeURIComponent(escape(atob(text))); } catch (e) { return { ok: false, msg: '无法解析这段存档文本。' }; }
        }
        try {
            const data = JSON.parse(json);
            applyData(state, data);
            state.lastTick = Date.now();
            state.offlineReport = null;
            save(state);
            return { ok: true, msg: '存档导入成功。' };
        } catch (e) {
            return { ok: false, msg: '存档格式错误。' };
        }
    }

    function hardReset() {
        try {
            localStorage.removeItem(SAVE_KEY);
            for (const k of LEGACY_SAVE_KEYS) localStorage.removeItem(k);
        } catch (e) {}
        location.reload();
    }

    window.SaveEngine = { save, load, hasSave, exportSave, importSave, hardReset, applyOffline, applyData, SAVE_KEY, LEGACY_SAVE_KEYS };
})();

</script>
<script>
/* ===== js/engine/loop.js ===== */
/* 主循环：推进游戏时间、结算生产、触发事件与远征 */
(function () {
    const state = GameState;
    let last = 0;
    let acc = 0;
    let autosaveAcc = 0;
    let secondAcc = 0;
    let renderAcc = 0;
    let running = false;
    let autoBuildAcc = 0;
    const seenErrors = {};

    /* 单帧出错不应该让整个 requestAnimationFrame 链断掉（否则玩家看到的就是「卡死，要刷新」） */
    function safeCall(tag, fn) {
        try { fn(); }
        catch (err) {
            const key = tag + ':' + (err && err.message ? err.message : String(err));
            if (!seenErrors[key]) {
                seenErrors[key] = 1;
                console.error('[主循环] ' + tag + ' 出错：', err);
                if (window.UI && UI.toast) UI.toast('内部错误，已跳过这一帧（详情见控制台）。', 'bad');
            }
        }
    }

    function advance(dt) {
        if (dt <= 0) return;
        const speed = state.speed || 1;
        const gdt = dt * speed;

        TradeEngine.tick(state, gdt);
        ProductionEngine.computeProductionAndCaps(state);

        for (const k in state.resources) {
            const r = state.resources[k];
            if (Math.abs(r.production) < 1e-12) continue;
            r.amount += r.production * gdt;
            if (RESOURCES_CONFIG[k].prestige) {
                if (r.amount < 0) r.amount = 0;
            } else {
                if (r.amount < 0) r.amount = 0;
                if (r.amount > r.cap) r.amount = r.cap;
            }
        }

        state.gameDays += gdt;
        state.stats.playSeconds += dt;

        /* 建造队列结算 */
        if (window.QueueEngine) QueueEngine.tick(state);

        /* 远征结算 */
        if (state.expedition.active && state.gameDays >= state.expedition.active.endDay) {
            const result = ExpeditionEngine.finish(state);
            if (result) {
                const lootText = Object.keys(result.loot).map(k => Utils.fmtNum(result.loot[k]) + ' ' + k).join('、');
                EventEngine.addLog(state, (result.success ? '⚔️ 远征「' + result.regionName + '」成功' : '🏳️ 远征「' + result.regionName + '」失败') +
                    '，带回：' + (lootText || '几乎没有东西'));
                if (window.UI && UI.toast) UI.toast((result.success ? '⚔️ 远征成功：' : '🏳️ 远征受挫：') + result.regionName, result.success ? 'gold' : 'bad');
                if (result.artifactObj) {
                    Artifacts.addToInventory(state, result.artifactObj);
                    EventEngine.addLog(state, '💠 发现秘宝「' + result.artifactObj.name + '」！');
                    if (window.UI && UI.toast) UI.toast('💠 发现秘宝：' + result.artifactObj.name, 'gold');
                }
                ProductionEngine.computeProductionAndCaps(state);
            }
        }

        EventEngine.tick(state, gdt);
    }

    function tick(now) {
        if (!running) return;
        const dtReal = last ? Math.min(1.5, (now - last) / 1000) : 0;
        last = now;

        if (!state.paused) {
            /* 分段推进，保证计算稳定 */
            acc += dtReal;
            let guard = 0;
            while (acc > 0.0001 && guard++ < 40) {
                const step = Math.min(0.1, acc);
                safeCall('advance', () => advance(step));
                acc -= step;
            }
            secondAcc += dtReal;
            if (secondAcc >= 1) {
                secondAcc = 0;
                AchievementEngine.check(state);
                const stars = Actions.activeStars(state);
                if (stars > state.stats.maxChallengeStars) state.stats.maxChallengeStars = stars;
                state.stats.peakPopulation = Math.max(state.stats.peakPopulation || 0, state.localResources.population.capacity);
                state.stats.peakKnowledge = Math.max(state.stats.peakKnowledge || 0, state.resources['魔法知识'].cap);
            }
            autoBuildAcc += dtReal;
            if (autoBuildAcc >= 0.5) {
                autoBuildAcc = 0;
                Actions.autoBuildStep(state);
                Actions.autoExpeditionStep(state);
            }
            autosaveAcc += dtReal;
            if (autosaveAcc >= 25 && state.settings.autosave) {
                autosaveAcc = 0;
                SaveEngine.save(state);
            }
        }

        renderAcc += dtReal;
        if (renderAcc >= 0.1) {
            renderAcc = 0;
            if (window.UI && UI.render) safeCall('render', () => UI.render());
        }
        requestAnimationFrame(tick);
    }

    function start() {
        if (running) return;
        running = true;
        last = 0;
        requestAnimationFrame(tick);
    }

    window.GameLoop = { start, advance, get running() { return running; } };
})();

</script>

<script>
/* ===== js/ui/dom.js ===== */
/* 界面基础工具：DOM 构造、提示气泡、弹窗、浮层提示、事件委托 */
(function () {
    const U = window.Utils;

    function $(sel, root) { return (root || document).querySelector(sel); }
    function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

    function h(html) {
        const t = document.createElement('template');
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
    }

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function num(n, digits) { return U.fmtNum(n, digits); }
    function rate(n) { return U.fmtRate(n); }
    function rateClass(n) { return n > 1e-9 ? 'pos' : (n < -1e-9 ? 'neg' : 'neu'); }

    /* ---------------- 提示气泡 ---------------- */
    const tipEl = document.getElementById('tooltip');
    let tipProvider = null;

    function setTipProvider(fn) { tipProvider = fn; }

    function showTip(html, x, y) {
        if (tipEl.__html !== html) {         // 内容未变则只移动位置，避免提示气泡闪动
            tipEl.__html = html;
            tipEl.innerHTML = html;
        }
        tipEl.classList.add('show');
        const rect = tipEl.getBoundingClientRect();
        let left = x + 16;
        let top = y + 16;
        if (left + rect.width > window.innerWidth - 8) left = x - rect.width - 12;
        if (top + rect.height > window.innerHeight - 8) top = Math.max(8, y - rect.height - 12);
        tipEl.style.left = left + 'px';
        tipEl.style.top = top + 'px';
    }

    function hideTip() { tipEl.classList.remove('show'); }

    function bindTips(root) {
        root.addEventListener('mouseover', e => {
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (!target || !tipProvider) return;
            const html = tipProvider(target.getAttribute('data-tip'));
            if (!html) return;
            tipEl._target = target;
            showTip(html, e.clientX, e.clientY);
        });
        root.addEventListener('mousemove', e => {
            if (!tipEl.classList.contains('show') || !tipEl._target) return;
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (target !== tipEl._target) { hideTip(); tipEl._target = null; return; }
            showTip(tipEl.innerHTML, e.clientX, e.clientY);
        });
        root.addEventListener('mouseout', e => {
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (target && target === tipEl._target) { hideTip(); tipEl._target = null; }
        });
    }

    /* ---------------- 浮层提示 ---------------- */
    const toastRoot = document.getElementById('toast-root');
    function toast(msg, type) {
        const node = h('<div class="toast ' + (type || '') + '">' + esc(msg) + '</div>');
        toastRoot.appendChild(node);
        setTimeout(() => { node.style.transition = 'opacity .4s'; node.style.opacity = '0'; }, 2600);
        setTimeout(() => node.remove(), 3100);
        while (toastRoot.children.length > 4) toastRoot.firstElementChild.remove();
    }

    /* ---------------- 弹窗 ---------------- */
    const modalRoot = document.getElementById('modal-root');

    function openModal(html, opts) {
        opts = opts || {};
        const wrap = h('<div class="modal">' + html + '</div>');
        modalRoot.innerHTML = '';
        modalRoot.appendChild(wrap);
        modalRoot.classList.add('open');
        modalRoot._closable = opts.closable !== false;
        return wrap;
    }

    function closeModal() {
        modalRoot.classList.remove('open');
        modalRoot.innerHTML = '';
    }

    function confirmBox(title, text, onOk, okLabel) {
        const wrap = openModal(
            '<h2>' + esc(title) + '</h2><p>' + text + '</p>' +
            '<div class="modal-actions"><button class="btn" data-modal-act="cancel">取消</button>' +
            '<button class="btn danger" data-modal-act="ok">' + esc(okLabel || '确定') + '</button></div>'
        );
        wrap.addEventListener('click', e => {
            const act = e.target.getAttribute && e.target.getAttribute('data-modal-act');
            if (act === 'cancel') closeModal();
            if (act === 'ok') { closeModal(); onOk(); }
        });
    }

    modalRoot.addEventListener('click', e => {
        if (e.target === modalRoot && modalRoot._closable !== false) closeModal();
    });

    /* ---------------- 进度条 ---------------- */
    function bar(pct, cls) {
        return '<div class="bar ' + (cls || '') + '"><i style="width:' + U.clamp(pct * 100, 0, 100).toFixed(1) + '%"></i></div>';
    }

    /* ---------------------------------------------------------
       轻量 DOM 补丁：把新 HTML 与现有 DOM 逐层比对，只改动变化的
       文本 / 属性，尽量复用已有节点。
       这样按钮节点在重绘之间保持同一身份 —— 不会出现
       「hover 被清空导致闪烁」「mousedown 与 mouseup 之间节点被换掉导致点击丢失」。
       --------------------------------------------------------- */
    function syncAttrs(oldEl, newEl) {
        const oa = oldEl.attributes;
        for (let i = oa.length - 1; i >= 0; i--) {
            const name = oa[i].name;
            if (!newEl.hasAttribute(name)) oldEl.removeAttribute(name);
        }
        const na = newEl.attributes;
        for (let i = 0; i < na.length; i++) {
            const a = na[i];
            if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value);
        }
    }

    function syncChildren(oldParent, newParent) {
        const olds = Array.prototype.slice.call(oldParent.childNodes);
        const news = Array.prototype.slice.call(newParent.childNodes);
        for (let i = 0; i < news.length; i++) {
            const n = news[i];
            const o = olds[i];
            if (!o) { oldParent.appendChild(n.cloneNode(true)); continue; }
            if (o.nodeType !== n.nodeType) { oldParent.replaceChild(n.cloneNode(true), o); continue; }
            if (n.nodeType === 3) {                       // 文本节点
                if (o.data !== n.data) o.data = n.data;
                continue;
            }
            if (n.nodeType === 8) continue;               // 注释
            if (o.tagName !== n.tagName) { oldParent.replaceChild(n.cloneNode(true), o); continue; }
            syncAttrs(o, n);
            syncChildren(o, n);
        }
        /* 多余节点移除（从后往前） */
        for (let i = news.length; i < olds.length; i++) {
            if (olds[i].parentNode === oldParent) oldParent.removeChild(olds[i]);
        }
    }

    function patchDOM(node, html) {
        const tpl = document.createElement('template');
        tpl.innerHTML = html;
        syncChildren(node, tpl.content);
    }

    /* 只在内容变化时更新；更新采用补丁方式，保留节点身份 */
    function setHTML(node, html) {
        if (!node) return false;
        if (node.__lastHTML === html) return false;
        const first = !node.__lastHTML;
        node.__lastHTML = html;
        if (first && !node.firstChild) node.innerHTML = html;
        else patchDOM(node, html);
        return true;
    }

    /* 原地更新文本（节点身份保持不变，因此不影响 hover / focus） */
    function setText(node, text) {
        if (!node) return false;
        if (node.__lastText === text) return false;
        node.__lastText = text;
        node.textContent = text;
        return true;
    }

    /* ---------------- 资源价格 / 消耗文本 ---------------- */
    function priceHtml(price) {
        const parts = [];
        for (const k in price) {
            const have = ResourcesManager.amount(k);
            const lack = have + 1e-6 < price[k];
            parts.push('<span class="' + (lack ? 'lack' : '') + '">' + esc(k) + ' ' + num(price[k]) + '</span>');
        }
        return parts.join('') || '<span>免费</span>';
    }

    function costHtml(cost) {
        const parts = [];
        for (const k in cost) {
            const have = ResourcesManager.amount(k);
            const lack = have + 1e-6 < cost[k];
            const cap = ResourcesManager.get(k).cap;
            const capIssue = !RESOURCES_CONFIG[k].prestige && cost[k] > cap;
            parts.push('<span class="' + (lack ? 'lack' : '') + '" data-tip="res|' + esc(k) + '">' + esc(k) + ' ' + num(cost[k]) +
                (capIssue ? ' ⚠' : '') + '</span>');
        }
        return parts.join('') || '<span>免费</span>';
    }

    /* ---------------- 效果文本 ---------------- */
    function effectLines(eff) {
        const out = [];
        for (const key in eff) {
            const v = eff[key];
            if (BUILDINGS_CONFIG[key] && typeof v === 'object') {
                const bits = [];
                if (typeof v.prod === 'number') bits.push('产出 ' + U.fmtPct(v.prod, 1));
                if (typeof v.cons === 'number') bits.push('消耗 ' + U.fmtPct(v.cons, 1));
                if (typeof v.cap === 'number') bits.push('上限 ' + U.fmtPct(v.cap, 1));
                out.push(key + '：' + bits.join('，'));
            } else if (key === 'resourceProd') {
                for (const r in v) out.push(r + ' 产出 ' + U.fmtPct(v[r], 1));
            } else if (key === 'globalProd') out.push('所有建筑产出 ' + U.fmtPct(v, 1));
            else if (key === 'globalCost') out.push('成本增长率 ' + U.fmtPct(v, 1));
            else if (key === 'happiness') out.push('民望 ' + (v >= 0 ? '+' : '') + U.fmtNum(v, 0));
            else if (key === 'knowledgeProd') out.push('魔法知识产出 ' + U.fmtPct(v, 1));
            else if (key === 'capAll') out.push('所有存量上限 ' + U.fmtPct(v, 1));
            else if (key === 'populationCap') out.push('人口上限 ' + U.fmtPct(v, 1));
            else if (key === 'relicGain') out.push('重置遗物收益 ' + U.fmtPct(v, 1));
            else if (key === 'resetGain') out.push('重置收益 ' + U.fmtPct(v, 1));
            else if (key === 'expeditionPower') out.push('远征军力 ' + U.fmtPct(v, 1));
            else if (key === 'expeditionReward') out.push('远征收益 ' + U.fmtPct(v, 1));
            else if (key === 'artifactQuality') out.push('秘宝品质 ' + U.fmtPct(v, 1));
            else if (key === 'speed') out.push('世界流速 ' + U.fmtPct(v, 1));
            else if (key === 'marketVolume') out.push('贸易规模 ' + U.fmtPct(v, 1));
            else if (key === 'startResources') out.push('重置后获得启动物资');
            else if (key === 'capPerRelic') out.push('每枚遗物提供 ' + U.fmtPct(v, 2) + ' 存量上限');
            else if (key === 'knowledgeCapPerRelic') out.push('遗物提升魔法知识上限');
            else if (key === 'offlineHours') out.push('离线结算时长 +' + v + ' 小时');
            else if (key === 'artifactSlots') out.push('秘宝装备槽 +' + v);
            else if (key === 'powerMult') out.push('军力 ' + U.fmtPct(v, 1));
            else if (key === 'queueSlots') out.push('建造队列 +' + v + ' 槽位');
            else if (key === 'queueDiscount') out.push('队列订单材料 ' + U.fmtPct(-v, 1));
            else if (key === 'luck') out.push('召唤运气 +' + v.toFixed(2));
            else if (key === 'summonDiscount') out.push('召唤消耗 ' + U.fmtPct(-v, 1));
            else if (key === 'heroPower') out.push('英雄效果 ' + U.fmtPct(v, 1));
            else if (key === 'special') {
                const names = {
                    autoBuild: '解锁自动建造', autoExpedition: '解锁自动远征',
                    keepArtifacts: '重置保留秘宝', perfectEfficiency: '人口永远充足',
                    autoTech: '重置后自动完成第一时代科技',
                    offlinePerfect: '离线收益 100% 效率',
                    knowledgeCapMult: '魔法知识上限倍增',
                };
                out.push(names[v] || v);
            } else out.push(key + ' ' + v);
        }
        return out;
    }

    window.UI = window.UI || {};
    Object.assign(window.UI, {
        $, $$, h, esc, num, rate, rateClass, bar, setHTML, setText, priceHtml, costHtml, effectLines,
        setTipProvider, bindTips, showTip, hideTip, toast,
        openModal, closeModal, confirmBox,
    });
})();

</script>
<script>
/* ===== js/ui/panels.js ===== */
/* 顶栏、左侧面板、右侧日志与事件面板、各类弹窗 */
(function () {
    const U = window.Utils;
    const G = window.UI;

    /* ---------------- 悬浮提示内容 ---------------- */
    /* 事件选项的「获得」文本：两遍预览的收益取范围 */
    function gainHtml(gain) {
        const parts = [];
        for (const k in gain) {
            const g = gain[k];
            const txt = g.min === g.max ? U.fmtNum(g.max) : U.fmtNum(g.min) + ' ~ ' + U.fmtNum(g.max);
            parts.push('<span class="pos">' + G.esc(k) + '　' + txt + '</span>');
        }
        return parts.join('') || '<span class="dim">没有直接收获</span>';
    }

    function tipHtml(key) {
        if (!key) return null;
        const parts = key.split('|');
        const type = parts[0], arg = parts[1];
        const s = GameState;

        if (type === 'res') {
            const cfg = RESOURCES_CONFIG[arg];
            if (!cfg) return null;
            const r = s.resources[arg];
            let html = '<h4>' + G.esc(arg) + '</h4>';
            html += '<div class="kv"><span>存量</span><span>' + G.num(r.amount) + ' / ' + G.num(r.cap) + '</span></div>';
            html += '<div class="kv"><span>净产量</span><span class="' + G.rateClass(r.production) + '">' + G.rate(r.production) + '/日</span></div>';
            if (cfg.value) {
                const heat = s.market.heat[arg] || 1;
                html += '<div class="kv"><span>市场价（热度 ' + heat.toFixed(2) + '）</span><span>' + U.fmtNum(cfg.value * heat) + ' 黄金</span></div>';
            }
            html += '<hr>';
            const contribs = ProductionEngine.getResourceContributions(s, arg);
            if (!contribs.length) html += '<div class="dim">暂无生产来源</div>';
            for (const c of contribs.slice(0, 14)) {
                html += '<div class="kv"><span>' + G.esc(c.source) + '</span><span class="' + G.rateClass(c.value) + '">' +
                    (c.note ? G.esc(c.note) : G.rate(c.value) + '/日') + '</span></div>';
            }
            if (contribs.length > 14) html += '<div class="dim">…共 ' + contribs.length + ' 项来源</div>';
            if (cfg.desc) html += '<hr><div class="dim">' + G.esc(cfg.desc) + '</div>';
            return html;
        }

        if (type === 'build') {
            const cfg = BUILDINGS_CONFIG[arg];
            const b = s.buildings[arg];
            if (!cfg || !b) return null;
            const st = ProductionEngine.getBuildingStats(s, arg);
            const active = ProductionEngine.activeConfig(cfg, b);
            const affordable = ResourcesManager.canAfford(st.price);
            let html = '<h4>' + G.esc(arg) + (st.modeName ? ' · ' + G.esc(st.modeName) : '') + '</h4>';
            html += '<div class="dim">' + G.esc(active.desc || cfg.desc) + '</div><hr>';
            html += '<div class="kv"><span>已建 / 启用</span><span>' + b.count + ' / ' + b.active + '</span></div>';
            if (b.active > 0) {
                html += '<div class="kv"><span>当前效率</span><span class="' +
                    (st.efficiency >= 0.999 ? 'pos' : (st.efficiency > 0.4 ? 'neu' : 'neg')) + '">' + U.fmtPct(st.efficiency) + '</span></div>';
                if (st.efficiency < 0.995) {
                    const lack = st.cons.filter(c => {
                        const r = s.resources[c.res];
                        return r && r.amount < r.cap * 0.05;
                    }).map(c => c.res);
                    const noPop = s.localResources.population.used > s.localResources.population.capacity + 1e-6;
                    let reason = '原料或人口不足';
                    if (lack.length && noPop) reason = lack.join('、') + ' 供应不足，且人手不足';
                    else if (lack.length) reason = lack.join('、') + ' 供应不足';
                    else if (noPop) reason = '人手不足';
                    html += '<div class="neg">效率受限：' + G.esc(reason) + '</div>';
                }
            }
            if (st.prod.length) {
                html += '<hr>';
                for (const p of st.prod) {
                    html += '<div class="kv"><span>产出 ' + G.esc(p.res) + '</span><span class="pos">' +
                        U.fmtNum(p.per * st.efficiency) + '/日 每座' +
                        (b.active > 1 ? '（共 ' + U.fmtNum(p.total) + '/日）' : '') + '</span></div>';
                }
            }
            if (st.cons.length) {
                for (const c of st.cons) {
                    html += '<div class="kv"><span>消耗 ' + G.esc(c.res) + '</span><span class="neg">' + U.fmtNum(c.per * st.efficiency) + '/日 每座</span></div>';
                }
            }
            if (st.caps.length) {
                for (const c of st.caps) {
                    html += '<div class="kv"><span>上限 ' + G.esc(c.res) + '</span><span class="mana">+' + U.fmtNum(c.per) + ' 每座</span></div>';
                }
            }
            for (const k in st.providesLocal) {
                html += '<div class="kv"><span>提供 ' + LOCAL_RESOURCES_CONFIG[k].name + '</span><span class="pos">+' + U.fmtNum(st.providesLocal[k]) + '</span></div>';
            }
            for (const k in st.requiresLocal) {
                html += '<div class="kv"><span>需要 ' + LOCAL_RESOURCES_CONFIG[k].name + '</span><span class="neg">' + U.fmtNum(st.requiresLocal[k]) + '</span></div>';
            }
            if (st.happiness) html += '<div class="kv"><span>民望</span><span class="pos">+' + U.fmtNum(st.happiness) + '</span></div>';
            html += '<hr>';
            html += '<div class="kv"><span>造价（第 ' + (b.count + 1) + ' 座）</span><span class="' +
                (affordable ? 'pos' : 'neg') + '">' + (affordable ? '可以建造' : '资源不足') + '</span></div>';
            html += '<div>' + G.priceHtml(st.price) + '</div>';
            if (st.modifiers && st.modifiers.length) {
                html += '<hr>';
                for (const m of st.modifiers) {
                    const bits = [];
                    if (m.prod) bits.push('产出 +' + U.fmtPct(m.prod));
                    if (m.cons) bits.push('消耗 +' + U.fmtPct(m.cons));
                    if (m.cap) bits.push('上限 +' + U.fmtPct(m.cap));
                    html += '<div class="kv"><span>' + G.esc(m.target) + '</span><span class="pos">' + bits.join('，') + '</span></div>';
                }
            }
            html += '<hr><div class="dim">点击卡片任意处 = 建造 ×1；名称旁出现「受限」标记时，说明它当前没有满效率运转。</div>';
            return html;
        }

        if (type === 'tech') {
            const cfg = TECHS_CONFIG[arg];
            if (!cfg) return null;
            let html = '<h4>' + G.esc(arg) + '</h4>' + '<div class="dim">' + G.esc(cfg.desc) + '</div>';
            if (cfg.prereq.length) {
                html += '<hr>';
                for (const p of cfg.prereq) {
                    const ok = s.techs[p] && s.techs[p].researched;
                    html += '<div class="kv"><span>前置 ' + G.esc(p) + '</span><span class="' + (ok ? 'pos' : 'neg') + '">' + (ok ? '已完成' : '未完成') + '</span></div>';
                }
            }
            const unlocks = BUILDINGS_ORDER.filter(n => BUILDINGS_CONFIG[n].tech === arg);
            if (unlocks.length) html += '<hr><div class="kv"><span>解锁建筑</span><span>' + unlocks.map(G.esc).join('、') + '</span></div>';
            const effs = G.effectLines(cfg.effect);
            if (effs.length) html += '<hr>' + effs.map(e => '<div class="kv"><span>' + G.esc(e) + '</span><span></span></div>').join('');
            return html;
        }

        if (type === 'upgrade') {
            const cfg = UPGRADES_CONFIG[arg];
            const u = s.upgrades[arg];
            if (!cfg || !u) return null;
            let html = '<h4>' + G.esc(arg) + ' · Lv.' + u.level + '</h4><div class="dim">' + G.esc(cfg.desc) + '</div>';
            html += '<hr><div class="kv"><span>等级上限</span><span>' + cfg.cap + '</span></div>';
            const effs = G.effectLines(cfg.effect);
            if (effs.length) html += effs.map(e => '<div class="kv"><span>每级：' + G.esc(e) + '</span><span></span></div>').join('');
            return html;
        }

        if (type === 'perm') {
            const cfg = PERMANENT_CONFIG[arg];
            const p = s.permanent[arg];
            if (!cfg || !p) return null;
            const cost = Actions.permanentCost(s, arg);
            let html = '<h4>' + G.esc(arg) + ' · ' + p.level + '/' + cfg.max + '</h4><div class="dim">' + G.esc(cfg.desc) + '</div><hr>';
            if (p.level < cfg.max) html += '<div class="kv"><span>下一级花费</span><span class="gold">' + U.fmtInt(cost.amount) + ' ' + cost.res + '</span></div>';
            else html += '<div class="kv"><span>状态</span><span class="pos">已满级</span></div>';
            const effs = G.effectLines(cfg.effect);
            for (const e of effs) html += '<div class="kv"><span>每级：' + G.esc(e) + '</span><span></span></div>';
            return html;
        }

        if (type === 'happy') {
            let html = '<h4>民望 ' + U.fmtNum(s.happiness, 0) + '</h4>';
            html += '<div class="dim">民望是所有建筑产出的乘数：每 100 点民望 = ×1 产出。</div><hr>';
            const list = s.happinessList || [];
            for (const h of list.slice(0, 16)) {
                html += '<div class="kv"><span>' + G.esc(h.source) + '</span><span class="' + G.rateClass(h.value) + '">' + G.rate(h.value) + '</span></div>';
            }
            html += '<hr><div class="kv"><span>当前产出乘数</span><span class="pos">×' + (s.happinessFactor || 1).toFixed(2) + '</span></div>';
            return html;
        }

        if (type === 'market') {
            const cfg = RESOURCES_CONFIG[arg];
            const m = s.market.resources[arg];
            if (!cfg || !m) return null;
            const heat = s.market.heat[arg] || 1;
            const price = cfg.value * heat;
            let html = '<h4>' + G.esc(arg) + ' · 贸易</h4>';
            html += '<div class="kv"><span>基础价值</span><span>' + U.fmtNum(cfg.value) + ' 黄金</span></div>';
            html += '<div class="kv"><span>当前热度</span><span>' + heat.toFixed(2) + '×</span></div>';
            html += '<div class="kv"><span>买入价</span><span class="pos">' + U.fmtNum(price) + ' 黄金/单位</span></div>';
            html += '<div class="kv"><span>卖出价</span><span class="neg">' + U.fmtNum(price * TradeEngine.SELL_RATIO) + ' 黄金/单位</span></div>';
            const r = (s.market.lastRates || {})[arg] || 0;
            html += '<div class="kv"><span>当前流量</span><span class="' + G.rateClass(r) + '">' + G.rate(r) + '/日</span></div>';
            html += '<hr><div class="dim">买入会推高价格，卖出会压低价格；无人交易时热度会缓慢回到 1。流量受「集市」提供的贸易规模限制。</div>';
            return html;
        }

        if (type === 'exp') {
            const r = ExpeditionEngine.findRegion(arg);
            if (!r) return null;
            const chance = ExpeditionEngine.successChance(s, r);
            const power = s.localResources.power.amount * (1 + EffectsManager.additive(s, 'expeditionPower'));
            let html = '<h4>' + G.esc(r.name) + ' · 第 ' + r.tier + ' 层</h4><div class="dim">' + G.esc(r.desc) + '</div><hr>';
            html += '<div class="kv"><span>建议军力</span><span>' + U.fmtInt(r.power) + '</span></div>';
            html += '<div class="kv"><span>你的军力</span><span class="' + (power >= r.power ? 'pos' : 'neg') + '">' + U.fmtInt(power) + '</span></div>';
            html += '<div class="kv"><span>成功率</span><span>' + U.fmtPct(chance) + '</span></div>';
            html += '<div class="kv"><span>耗时</span><span>' + r.days + ' 日</span></div>';
            html += '<hr><div>出发消耗：' + G.costHtml(r.cost) + '</div>';
            const loot = [];
            for (const k in r.loot) loot.push(k + ' ' + U.fmtNum(r.loot[k][0]) + '~' + U.fmtNum(r.loot[k][1]));
            if (r.relics[1]) loot.push('奥术遗物 ' + r.relics[0] + '~' + r.relics[1]);
            html += '<div>可能收获：' + G.esc(loot.join('、')) + '</div>';
            html += '<div class="kv"><span>秘宝概率</span><span>' + U.fmtPct(r.artifact) + '</span></div>';
            return html;
        }

        if (type === 'artifact') {
            const list = s.artifacts.inventory.concat(s.artifacts.equipped.filter(Boolean));
            const art = list.find(a => a.id === arg);
            if (!art) return null;
            let html = '<h4>' + G.esc(art.name) + (art.fragile ? ' · 脆弱' : '') + '</h4>';
            html += '<div class="dim">来自第 ' + art.tier + ' 层遗迹。' + (art.fragile ? '脆弱秘宝在重置时会碎裂。' : '') + '</div><hr>';
            for (const line of Artifacts.describe(art.effects)) {
                html += '<div class="kv"><span>' + G.esc(line) + '</span><span></span></div>';
            }
            return html;
        }

        if (type === 'challenge') {
            const cfg = CHALLENGES_CONFIG.find(c => c.id === arg);
            if (!cfg) return null;
            let html = '<h4>' + G.esc(cfg.name) + ' · ' + '★'.repeat(cfg.star) + '</h4>';
            html += '<div class="dim">' + G.esc(cfg.desc) + '</div><hr>';
            html += '<div>完成条件：' + (cfg.requireReset === 'any' ? '任意重置' : (cfg.requireReset === 'star' ? '星辰升华' : '原初归寂')) + '</div>';
            html += '<div class="kv"><span>完成奖励</span><span class="pos">' + G.esc(cfg.rewardText) + '</span></div>';
            return html;
        }

        /* 事件选项：剧情说明 + 明确的「扣什么 / 得什么」 */
        if (type === 'evchoice') {
            const ev = EventEngine.current(s);
            if (!ev) return null;
            const idx = Number(arg);
            const c = ev.choices[idx];
            if (!c) return null;
            const pv = EventEngine.preview(s, ev, idx);
            let html = '<h4>' + G.esc(c.text) + '</h4>';
            if (c.hint) html += '<div class="dim">' + G.esc(c.hint) + '</div>';
            html += '<hr>';
            if (pv && Object.keys(pv.cost).length) {
                html += '<div class="kv"><span>消耗</span><span>' + G.costHtml(pv.cost) + '</span></div>';
            } else {
                html += '<div class="kv"><span>消耗</span><span class="dim">不消耗任何资源</span></div>';
            }
            if (c.needPower) {
                const okPower = s.localResources.power.amount + 1e-9 >= c.needPower;
                html += '<div class="kv"><span>需要军力</span><span class="' + (okPower ? 'pos' : 'lack') + '">' +
                    U.fmtNum(c.needPower) + (okPower ? '（当前足够）' : '（当前只有 ' + U.fmtNum(s.localResources.power.amount) + '）') + '</span></div>';
            }
            html += '<div class="kv"><span>获得</span><span>' + gainHtml(pv ? pv.gain : {}) + '</span></div>';
            if (pv && pv.happy.length) {
                const vals = pv.happy.slice().sort((a, b) => a - b);
                html += '<div class="kv"><span>民望</span><span class="' +
                    (vals[vals.length - 1] >= 0 ? 'pos' : 'neg') + '">' +
                    vals.map(v => (v >= 0 ? '+' : '') + U.fmtNum(v, 0)).join(' 或 ') + '</span></div>';
            }
            if (pv) {
                for (const b of pv.buffs) {
                    const lines = G.effectLines(b.effect);
                    html += '<div class="kv"><span>持续效果</span><span class="pos">' + G.esc(b.label) +
                        '（' + U.fmtNum(b.days, 0) + ' 日' + (lines.length ? '：' + lines.map(G.esc).join('；') : '') + '）</span></div>';
                }
            }
            if (!pv) html += '<div class="dim">（该选项的结果视情况而定，详见描述。）</div>';
            return html;
        }

        if (type === 'offline') {
            const rep = s.offlineReport;
            if (!rep) return null;
            let html = '<h4>离线结算</h4>';
            html += '<div class="kv"><span>离开时间</span><span>' + U.fmtDuration(rep.realSeconds) + '</span></div>';
            html += '<div class="kv"><span>有效结算</span><span>' + U.fmtDuration(rep.seconds) + '</span></div>';
            html += '<div class="kv"><span>效率</span><span>' + Math.round(rep.factor * 100) + '%</span></div>';
            html += '<hr>';
            for (const k in rep.gains) html += '<div class="kv"><span>' + G.esc(k) + '</span><span class="pos">+' + U.fmtNum(rep.gains[k]) + '</span></div>';
            return html;
        }

        if (type === 'queue') {
            if (!window.QueueEngine) return null;
            const it = GameState.queue.items.find(x => x.id === arg);
            if (!it) return null;
            const cost = QueueEngine.currentCost(GameState, it) || {};
            const eta = QueueEngine.eta(GameState, it);
            const blocked = QueueEngine.capBlocked(GameState, it);
            let html = '<h4>' + G.esc(it.name) + (it.count > 1 ? ' ×' + it.count : '') +
                ' · ' + G.esc(QueueEngine.KIND_LABEL[it.kind]) + '</h4>';
            html += '<div class="kv"><span>材料已备</span><span>' + U.fmtPct(QueueEngine.progress(GameState, it), 0) + '</span></div>';
            html += '<div class="kv"><span>预计建成</span><span>' +
                (blocked ? '<span class="lack">上限不足</span>' : (eta === null ? '无法估算' : (eta <= 1e-9 ? '材料已就绪' : U.fmtDuration(eta) + ' 后'))) +
                '</span></div>';
            html += '<hr><div>还需要凑齐：</div><div>' + G.priceHtml(cost) + '</div>';
            if (blocked) html += '<div class="neg">「' + G.esc(blocked) + '」的仓储上限低于这笔订单所需，订单永远凑不齐；先去提升上限或取消订单。</div>';
            html += '<hr><div class="dim">订单只是「排队等材料」，材料一凑齐就会立即建成；取消订单不会损失任何材料。</div>';
            return html;
        }

        if (type === 'hero') {
            if (!window.Heroes) return null;
            const hero = Heroes.heroById(arg);
            if (!hero) return null;
            const owned = s.heroes.owned[arg];
            const r = HERO_RARITIES[hero.rarity];
            const cat = HERO_CATEGORIES[hero.category];
            let html = '<h4>' + G.esc(hero.name) + ' · ' + r.name + '</h4>';
            html += '<div class="dim">' + cat.icon + ' ' + G.esc(cat.key) + '：' + G.esc(cat.desc) + '</div>';
            html += '<div class="dim">' + G.esc(hero.desc) + '</div><hr>';
            if (owned === undefined) {
                html += '<div class="neg">尚未召唤到这位英雄。</div>';
                html += '<hr><div class="dim">基础效果（' + r.name + ' × ' + r.mult + '）：' +
                    G.esc(G.effectLines(Heroes.heroEffect(hero)).join('；')) + '</div>';
            } else {
                html += '<div class="kv"><span>觉醒等级</span><span class="gold">' + owned + ' / ' + GACHA_CONFIG.awakeningMax + '</span></div>';
                for (const line of (window.TabSummon ? TabSummon.effectLines(hero, owned) : [])) {
                    html += '<div class="kv"><span>' + G.esc(line) + '</span><span></span></div>';
                }
                html += '<hr><div class="dim">重复召唤会提升觉醒等级（每级 +' +
                    Math.round(GACHA_CONFIG.awakeningStep * 100) + '%），满觉后再抽到会转化为奥术遗物。</div>';
            }
            return html;
        }

        if (type === 'text') return G.esc(parts.slice(1).join('|'));
        return null;
    }

    /* ---------------- 顶栏 ---------------- */
    function renderHeader() {
        const s = GameState;
        const era = getCurrentEra(s);
        document.getElementById('stat-era').textContent = era.name;
        document.getElementById('stat-date').textContent = U.fmtDate(s.gameDays);
        document.getElementById('stat-speed').textContent = '×' + s.speed.toFixed(2);
        const h = document.getElementById('stat-happy');
        h.querySelector('span:last-child').textContent = U.fmtNum(s.happiness, 0);
        const fac = s.happinessFactor || 1;
        h.querySelector('span:last-child').className = fac >= 1 ? 'ok pos' : 'neg';
        h.setAttribute('data-tip', 'happy');
        document.getElementById('btn-pause').textContent = s.paused ? '▶' : '⏸';
    }

    /* ---------------- 人口面板 ---------------- */
    const popRefs = {};
    function renderPopulation() {
        const s = GameState;
        const pop = s.localResources.population;
        const power = s.localResources.power;
        const box = document.getElementById('panel-population');
        const hintKind = pop.capacity <= 0 ? 'none' : (pop.used >= pop.capacity ? 'full' : 'ok');

        /* 结构只在状态类别变化时重建，其余时间原地更新数字（避免 hover 闪烁） */
        if (box.__sig !== hintKind) {
            box.__sig = hintKind;
            let html = '<div class="panel-title">文明<span class="right" id="pop-status"></span></div>';
            html += '<div class="pop-line"><span>人口占用</span><span class="value"><span id="pop-used"></span> / <span id="pop-cap"></span></span></div>';
            html += G.bar(0, 'good').replace('class="bar good"', 'class="bar good" id="pop-bar"');
            html += '<div class="pop-line" data-tip="happy" style="cursor:help"><span>民望</span><span class="value"><span id="pop-happy"></span> <small id="pop-mult"></small></span></div>';
            html += G.bar(0, 'good').replace('class="bar good"', 'class="bar good" id="happy-bar"');
            html += '<div class="stat-grid">';
            html += '<div>军力 <b id="pop-power"></b></div>';
            html += '<div>建筑 <b id="pop-buildings"></b></div>';
            html += '<div>时代 <b id="pop-era"></b></div>';
            html += '<div>遗迹 <b id="pop-expeditions"></b></div>';
            html += '</div>';
            html += '<div class="hint mt6" id="pop-hint"></div>';
            G.setHTML(box, html);
            for (const id of ['pop-status', 'pop-used', 'pop-cap', 'pop-happy', 'pop-mult', 'pop-power',
                'pop-buildings', 'pop-era', 'pop-expeditions', 'pop-hint', 'pop-bar', 'happy-bar']) {
                popRefs[id] = box.querySelector('#' + id);
            }
        }

        const ratio = pop.capacity > 0 ? pop.used / pop.capacity : (pop.used > 0 ? 2 : 1);
        G.setText(popRefs['pop-status'], pop.used > pop.capacity ? '人手不足' : '运转正常');
        G.setText(popRefs['pop-used'], U.fmtNum(pop.used));
        G.setText(popRefs['pop-cap'], U.fmtNum(pop.capacity));
        popRefs['pop-bar'].className = 'bar ' + (ratio > 1 ? 'bad' : 'good');
        popRefs['pop-bar'].firstElementChild.style.width = U.clamp(ratio * 100, 0, 100).toFixed(1) + '%';
        G.setText(popRefs['pop-happy'], U.fmtNum(s.happiness, 0));
        G.setText(popRefs['pop-mult'], '×' + s.happinessFactor.toFixed(2));
        popRefs['pop-mult'].className = s.happinessFactor >= 1 ? 'pos' : 'neg';
        popRefs['happy-bar'].className = 'bar ' + (s.happiness >= 100 ? 'good' : 'bad');
        popRefs['happy-bar'].firstElementChild.style.width = (U.clamp(s.happiness / 600, 0, 1) * 100).toFixed(1) + '%';
        G.setText(popRefs['pop-power'], U.fmtNum(power.amount));
        G.setText(popRefs['pop-buildings'], String(Object.values(s.buildings).reduce((a, b) => a + b.count, 0)));
        G.setText(popRefs['pop-era'], getCurrentEra(s).name);
        G.setText(popRefs['pop-expeditions'], String(s.stats.expeditions));
        G.setText(popRefs['pop-hint'], hintKind === 'none'
            ? '还没有居所：研究「搭建帐篷」并建造帐篷，人口才能支撑其它建筑。'
            : (hintKind === 'full' ? '人手已满：建造更多居所才能让新建筑满效率运转。' : ''));
    }

    /* ---------------- 资源面板 ---------------- */
    let resSig = '';
    let resRefs = {};
    function renderResources() {
        const s = GameState;
        const order = Object.keys(RESOURCES_CONFIG);
        const box = document.getElementById('panel-resources');
        const visible = order.filter(k => s.resources[k].visible);
        const sig = visible.join(',');

        if (sig !== resSig || !box.firstElementChild) {
            resSig = sig;
            let html = '<div class="panel-title">资源<span class="right">净值 / 日</span></div><div class="res-list">';
            for (const k of visible) {
                const cfg = RESOURCES_CONFIG[k];
                html += '<div class="res-row' + (cfg.prestige ? ' prestige' : '') + '" data-tip="res|' + G.esc(k) + '">';
                html += '<span class="ico">' + (cfg.icon || '•') + '</span>';
                html += '<span class="nm">' + G.esc(k) + '</span>';
                html += '<span class="amt"></span>';
                html += '<span class="rate"></span>';
                html += '</div>';
            }
            html += '</div>';
            G.setHTML(box, html);
            resRefs = {};
            const rows = box.querySelectorAll('.res-row');
            for (let i = 0; i < visible.length; i++) {
                resRefs[visible[i]] = {
                    row: rows[i],
                    amt: rows[i].querySelector('.amt'),
                    rate: rows[i].querySelector('.rate'),
                };
            }
        }

        for (const k of visible) {
            const r = s.resources[k];
            const cfg = RESOURCES_CONFIG[k];
            const ref = resRefs[k];
            if (!ref) continue;
            const full = !cfg.prestige && r.cap > 0 && r.amount >= r.cap - 1e-6;
            const rowCls = 'res-row' + (full ? ' full' : '') + (cfg.prestige ? ' prestige' : '');
            if (ref.row.className !== rowCls) ref.row.className = rowCls;
            const amtHtml = U.fmtNum(r.amount) + (cfg.prestige ? '' : ' <small>/' + U.fmtNum(r.cap) + '</small>');
            if (ref.amt.__lastText !== amtHtml) { ref.amt.__lastText = amtHtml; ref.amt.innerHTML = amtHtml; }
            const rateText = G.rate(r.production) + ' / 日';
            G.setText(ref.rate, rateText);
            const rateCls = 'rate' + (r.production < -1e-9 ? ' neg' : '');
            if (ref.rate.className !== rateCls) ref.rate.className = rateCls;
        }
    }

    /* ---------------- 建造队列面板 ---------------- */
    const queueRefs = {};
    function renderQueue() {
        const s = GameState;
        const box = document.getElementById('panel-queue');
        if (!box) return;
        if (!window.QueueEngine) return;
        const items = QueueEngine.items(s);
        const slots = QueueEngine.slots(s);
        const sig = items.map(it => it.id).join(',') + '|' + slots + '|' + QueueEngine.discount(s).toFixed(3);

        if (box.__sig !== sig) {
            box.__sig = sig;
            let html = '<div class="panel-title">建造队列<span class="right">' + items.length + ' / ' + slots + ' 槽</span></div>';
            if (!items.length) {
                html += '<div class="hint">队列空闲。</div>';
                G.setHTML(box, html);
                for (const k in queueRefs) delete queueRefs[k];
                return;
            }
            html += '<div class="queue-list">';
            for (const it of items) {
                html += '<div class="queue-item waiting" data-tip="queue|' + G.esc(it.id) + '">';
                html += '<div class="q-head"><span class="q-kind">' + G.esc(QueueEngine.KIND_LABEL[it.kind]) + '</span>' +
                    '<span class="q-name">' + G.esc(it.name) + (it.count > 1 ? ' ×' + it.count : '') + '</span>' +
                    '<span class="q-time" data-q-time="' + G.esc(it.id) + '"></span></div>';
                html += G.bar(0).replace('class="bar "', 'class="bar" data-q-bar="' + G.esc(it.id) + '"');
                html += '<div class="q-est" data-q-est="' + G.esc(it.id) + '"></div>';
                html += '<div class="q-foot"><button class="btn tiny danger" data-act="queuecancel|' + G.esc(it.id) + '">取消订单</button></div>';
                html += '</div>';
            }
            html += '</div>';
            html += '<div class="hint mt6">订单材料折扣 −' + U.fmtPct(QueueEngine.discount(s), 0) +
                '（上限 −' + U.fmtPct(QueueEngine.DISCOUNT_CAP, 0) + '）：折扣越低，订单要凑的材料越少。</div>';
            G.setHTML(box, html);
            for (const k in queueRefs) delete queueRefs[k];
            for (const it of items) {
                queueRefs[it.id] = {
                    time: box.querySelector('[data-q-time="' + it.id + '"]'),
                    bar: box.querySelector('[data-q-bar="' + it.id + '"]'),
                    est: box.querySelector('[data-q-est="' + it.id + '"]'),
                };
            }
        }

        for (const it of items) {
            const ref = queueRefs[it.id];
            if (!ref) continue;
            const p = QueueEngine.progress(s, it);
            const blocked = QueueEngine.capBlocked(s, it);
            const eta = QueueEngine.eta(s, it);
            if (ref.bar && ref.bar.firstElementChild) {
                ref.bar.firstElementChild.style.width = (p * 100).toFixed(1) + '%';
                ref.bar.className = 'bar ' + (blocked ? 'bad' : '');
            }
            if (blocked) G.setText(ref.time, '上限不足');
            else if (eta === null) G.setText(ref.time, '无法估算');
            else if (eta <= 1e-9) G.setText(ref.time, '材料已就绪');
            else G.setText(ref.time, U.fmtDuration(eta) + ' 后建成');
            const cost = QueueEngine.currentCost(s, it) || {};
            G.setHTML(ref.est, '需要：' + G.priceHtml(cost));
        }
    }

    function renderEvent() {
        const s = GameState;
        const ev = EventEngine.current(s);
        const box = document.getElementById('panel-event');
        if (!ev) {
            const rest = Math.max(0, s.nextEventDay - s.gameDays);
            G.setHTML(box, '<div class="panel-title">命运的涟漪</div><div class="hint">世界继续运转。下一次波动预计在 ' +
                U.fmtDuration(rest) + ' 后到来。</div>' +
                (s.activeEffects.length ? '<div class="chip-row mt6">' + s.activeEffects.map(ae =>
                    '<span class="chip" data-tip="text|' + G.esc(ae.desc || ae.name) + '">' + G.esc(ae.name) + ' ' + Math.ceil(ae.remain) + '日</span>').join('') + '</div>' : ''));
            return;
        }
        let html = '<div class="panel-title">事件<span class="right">请做出选择</span></div>';
        html += '<div class="panel event-card" style="padding:10px">';
        html += '<h3>' + G.esc(ev.title) + '</h3><p>' + G.esc(ev.text) + '</p>';
        html += '<div class="event-choices">';
        ev.choices.forEach((c, i) => {
            /* 资源（或军力）不够的选项不能点击，并标出缺多少 */
            const payable = EventEngine.choicePayable ? EventEngine.choicePayable(s, c) : true;
            html += '<div class="event-choice">';
            html += '<button class="btn wide' + (payable ? '' : ' locked') + '" data-act="eventchoice|' + i + '"' +
                (payable ? '' : ' disabled') + ' data-tip="evchoice|' + i + '">' + G.esc(c.text) + '</button>';
            const needs = [];
            if (c.cost && Object.keys(c.cost).length) needs.push('消耗 ' + G.costHtml(c.cost));
            if (c.needPower) {
                const okPower = s.localResources.power.amount + 1e-9 >= c.needPower;
                needs.push('<span class="' + (okPower ? '' : 'lack') + '">需要军力 ' + U.fmtNum(c.needPower) +
                    '（当前 ' + U.fmtNum(s.localResources.power.amount) + '）</span>');
            }
            if (needs.length) html += '<div class="choice-need">' + needs.join('　') + '</div>';
            html += '</div>';
        });
        html += '</div></div>';
        G.setHTML(box, html);
    }

    /* ---------------- 远征小面板 ---------------- */
    const expRefs = {};
    function renderExpeditionPanel() {
        const s = GameState;
        const box = document.getElementById('panel-expedition');
        if (!box) return;
        const a = s.expedition.active;
        /* 签名带上 startDay：同一区域的两次远征也会各自重建，避免复用已被顶替的节点 */
        const sig = a ? ('active|' + a.region + '|' + Math.round(a.startDay * 1000)) : 'idle';
        if (box.__sig !== sig) {
            box.__sig = sig;
            if (!a) {
                expRefs.bar = expRefs.progress = expRefs.chance = expRefs.remain = null;
                const power = s.localResources.power.amount * (1 + EffectsManager.additive(s, 'expeditionPower'));
                G.setHTML(box, '<div class="panel-title">远征队</div><div class="hint">远征队待命中，当前军力 ' + U.fmtNum(power) + '。</div>');
                return;
            }
            let html = '<div class="panel-title">远征中<span class="right">' + G.esc(a.region) + '</span></div>';
            html += G.bar(0, '').replace('class="bar "', 'class="bar" id="exp-bar"');
            html += '<div class="mini"><span id="exp-progress"></span><span id="exp-chance"></span></div>';
