            html += '<div class="hint mt6" id="exp-remain"></div>';
            G.setHTML(box, html);
            expRefs.bar = box.querySelector('#exp-bar');
            expRefs.progress = box.querySelector('#exp-progress');
            expRefs.chance = box.querySelector('#exp-chance');
            expRefs.remain = box.querySelector('#exp-remain');
        }
        if (!a) return;
        const region = ExpeditionEngine.findRegion(a.region);
        const p = ExpeditionEngine.progress(s);
        const chance = ExpeditionEngine.successChance(s, region);
        if (expRefs.bar && expRefs.bar.firstElementChild) {
            expRefs.bar.firstElementChild.style.width = (U.clamp(p, 0, 1) * 100).toFixed(1) + '%';
        }
        G.setText(expRefs.progress, '进度 ' + U.fmtPct(p));
        G.setText(expRefs.chance, '预计成功率 ' + U.fmtPct(chance));
        G.setText(expRefs.remain, '剩余 ' + U.fmtDuration(ExpeditionEngine.remaining(s)) + '。' +
            (s.expedition.history.length ? '上次结果：' + (s.expedition.history[0].success ? '成功' : '失败') : ''));
    }

    /* ---------------- 日志 ---------------- */
    function renderLog() {
        const s = GameState;
        let html = '<div class="panel-title">编年史<span class="right">' + s.eventLogs.length + ' 条</span></div><div class="log-list">';
        if (!s.eventLogs.length) html += '<div class="hint">文明刚刚开始，还没有值得记录的事。</div>';
        for (const log of s.eventLogs.slice(0, 40)) {
            html += '<div class="log-item"><span class="d">' + G.esc(U.fmtDate(log.day)) + '</span><span class="t">' + G.esc(log.text) + '</span></div>';
        }
        html += '</div>';
        G.setHTML(document.getElementById('panel-log'), html);
    }

    /* ---------------- 统计 ---------------- */
    function renderStats() {
        const s = GameState;
        const st = s.stats;
        const effs = s.activeEffects.length ? s.activeEffects.map(ae =>
            '<span class="chip" data-tip="text|' + G.esc(ae.desc || '') + '">' + G.esc(ae.name) + ' ' + Math.ceil(ae.remain) + '日</span>').join('') : '<span class="hint">无</span>';
        let html = '<div class="panel-title">统计</div><div class="stat-grid">';
        html += '<div>游玩时长 <b>' + U.fmtDuration(st.playSeconds) + '</b></div>';
        html += '<div>重置次数 <b>' + (st.resets.relic + st.resets.star + st.resets.core) + '</b></div>';
        html += '<div>远征 <b>' + st.expeditions + '</b>（败 ' + st.expeditionsFailed + '）</div>';
        html += '<div>秘宝 <b>' + st.artifactsFound + '</b></div>';
        html += '<div>成就 <b>' + Object.keys(s.achievements).length + '/' + ACHIEVEMENTS_CONFIG.length + '</b></div>';
        html += '<div>事件 <b>' + st.events + '</b></div>';
        html += '<div>峰值人口 <b>' + U.fmtNum(st.peakPopulation || 0) + '</b></div>';
        html += '<div>知识峰值 <b>' + U.fmtNum(st.peakKnowledge || 0) + '</b></div>';
        html += '</div>';
        html += '<div class="panel-title mt10">状态效果</div><div class="chip-row">' + effs + '</div>';
        G.setHTML(document.getElementById('panel-stats'), html);
    }

    /* ---------------- 弹窗 ---------------- */
    function exportModal() {
        const data = SaveEngine.exportSave(GameState);
        const html = '<h2>导出存档</h2><p>复制下面的文本并妥善保存。随时可以在「导入存档」中粘贴回来。</p>' +
            '<textarea readonly>' + G.esc(data) + '</textarea>' +
            '<div class="modal-actions"><button class="btn" data-act="closemodal">关闭</button></div>';
        const wrap = G.openModal(html);
        const ta = wrap.querySelector('textarea');
        ta.focus(); ta.select();
    }

    function importModal() {
        const html = '<h2>导入存档</h2><p>粘贴先前导出的文本。导入会覆盖当前进度。</p>' +
            '<textarea placeholder="在此粘贴存档文本…"></textarea>' +
            '<div class="modal-actions"><button class="btn" data-act="closemodal">取消</button>' +
            '<button class="btn primary" data-act="doimport">导入</button></div>';
        G.openModal(html);
    }

    function offlineModal() {
        const rep = GameState.offlineReport;
        if (!rep) return;
        const gains = Object.keys(rep.gains).map(k => '<div class="kv"><span>' + G.esc(k) + '</span><span class="pos">+' + U.fmtNum(rep.gains[k]) + '</span></div>').join('') || '<div class="dim">没有产生收益</div>';
        const html = '<h2>你离开的这段时间</h2>' +
            '<p>离线 ' + U.fmtDuration(rep.realSeconds) + '，其中结算 ' + U.fmtDuration(rep.seconds) +
            '（效率 ' + Math.round(rep.factor * 100) + '%）。提升「永恒延长」与「虚空自转」传承可以提高离线收益。</p>' +
            '<h3>收获</h3>' + gains +
            '<div class="modal-actions"><button class="btn primary" data-act="closemodal">继续重建</button></div>';
        G.openModal(html);
    }

    window.Panels = {
        tipHtml, renderHeader, renderPopulation, renderResources,
        renderEvent, renderExpeditionPanel, renderLog, renderStats, renderQueue,
        exportModal, importModal, offlineModal,
    };
})();

</script>
<script>
/* ===== js/ui/tab-buildings.js ===== */
/* 建筑标签页 */
(function () {
    const U = window.Utils;
    const G = window.UI;
    const TYPES = ['采集', '加工', '魔力', '居住', '研究', '储存', '民生', '军备', '奇观'];

    const filters = { type: '全部', hideLocked: false, buy: 1 };

    function buildingCard(name) {
        const s = GameState;
        const cfg = BUILDINGS_CONFIG[name];
        const b = s.buildings[name];
        const st = ProductionEngine.getBuildingStats(s, name);
        const affordable = ResourcesManager.canAfford(b.price);
        const unlocked = b.unlocked;
        const queued = window.QueueEngine ? QueueEngine.queuedCount(s, 'building', name) : 0;
        const queueFull = window.QueueEngine ? QueueEngine.isFull(s) : false;
        /* 资源足够就直接建成，不占用队列；只有「买不起 + 队列满」时不能下单 */
        const blocked = !affordable && queueFull;

        let cls = 'card compact';
        if (!unlocked) cls += ' locked';
        else if (affordable) cls += ' affordable';
        if (unlocked && b.active === 0) cls += ' disabled';
        if (st.modeName) cls += '';

        /* 整张卡片就是主操作：未解锁的卡片点了会跳到科技页 */
        const primaryAct = unlocked ? ('buy|' + name + '|1') : 'tab|techs';
        let html = '<div class="' + cls + ' clickable" data-act="' + G.esc(primaryAct) + '" data-tip="build|' + G.esc(name) + '">';
        html += '<div class="card-head"><div class="card-name">' + G.esc(name) +
            (st.modeName ? '<span class="tag">' + G.esc(st.modeName) + '</span>' : '') +
            (queued > 0 ? '<span class="tag queue">排队中 ×' + queued + '</span>' : '') +
            (b.active > 0 && st.efficiency < 0.995 ? '<span class="tag warn">受限 ' + U.fmtPct(st.efficiency, 0) + '</span>' : '') +
            '</div>';
        html += '<div class="card-count">' + Math.round(b.active) + '<small> / ' + b.count + '</small></div></div>';

        if (!unlocked) {
            html += '<div class="card-desc">需要科技：<b>' + G.esc(cfg.tech) + '</b></div>';
            html += '<div class="card-tip"><span>点击前往科技页</span><span></span></div>';
            html += '</div>';
            return html;
        }

        /* 模式切换 */
        if (cfg.modes && b.count > 0) {
            html += '<div class="btn-row mt6">';
            cfg.modes.forEach((m, i) => {
                html += '<button class="btn tiny' + (b.mode === i ? ' active' : '') + '" data-act="mode|' + G.esc(name) + '|' + i + '">' + G.esc(m.name) + '</button>';
            });
            html += '</div>';
        }

        /* 只保留操作按钮，其余信息交给悬浮提示 */
        html += '<div class="card-actions">';
        html += '<button class="btn primary wide-action" data-act="buy|' + G.esc(name) + '|1"' + (blocked ? ' disabled' : '') + '>' +
            (blocked ? '队列已满' : (affordable ? '建造 ×1' : '排队等材料 ×1')) + '</button>';
        html += '<button class="btn tiny" data-act="buy|' + G.esc(name) + '|5"' + (blocked ? ' disabled' : '') + '>+5</button>';
        html += '<button class="btn tiny" data-act="buy|' + G.esc(name) + '|10"' + (blocked ? ' disabled' : '') + '>+10</button>';
        html += '<button class="btn tiny" data-act="buy|' + G.esc(name) + '|max"' + (affordable && !queueFull ? '' : ' disabled') + '>最大</button>';
        html += '<button class="btn tiny" data-act="toggle|' + G.esc(name) + '">' + (b.active > 0 ? '停用' : '启用') + '</button>';
        html += '</div>';
        html += '</div>';
        return html;
    }

    function render() {
        const s = GameState;
        const counts = {};
        for (const t of TYPES) counts[t] = 0;
        for (const name in s.buildings) {
            const cfg = BUILDINGS_CONFIG[name];
            if (!s.buildings[name].visible) continue;
            counts[cfg.type] = (counts[cfg.type] || 0) + 1;
        }

        let html = '<div class="btn-row" style="margin-bottom:8px">';
        html += '<button class="btn tiny' + (filters.type === '全部' ? ' active' : '') + '" data-act="filter|全部">全部</button>';
        for (const t of TYPES) {
            if (!counts[t]) continue;
            html += '<button class="btn tiny' + (filters.type === t ? ' active' : '') + '" data-act="filter|' + t + '">' + t + '</button>';
        }
        html += '<button class="btn tiny' + (filters.hideLocked ? ' active' : '') + '" data-act="filter|!locked">仅显示已解锁</button>';
        html += '</div>';

        for (const t of TYPES) {
            const names = BUILDINGS_ORDER.filter(n => {
                const cfg = BUILDINGS_CONFIG[n];
                const b = s.buildings[n];
                if (!b.visible) return false;
                if (cfg.type !== t) return false;
                if (filters.type !== '全部' && filters.type !== t) return false;
                if (filters.hideLocked && !b.unlocked) return false;
                return true;
            });
            if (!names.length) continue;
            const totalActive = names.reduce((a, n) => a + s.buildings[n].active, 0);
            html += '<div class="section-title">' + t + '<span class="right" style="font-size:.72rem;color:var(--text-dim)">启用 ' + Math.round(totalActive) + '</span></div>';
            html += '<div class="card-grid buildings">' + names.map(buildingCard).join('') + '</div>';
        }
        return html;
    }

    window.TabBuildings = { render, filters };
})();

</script>
<script>
/* ===== js/ui/tab-research.js ===== */
/* 科技标签页 + 升级标签页 */
(function () {
    const U = window.Utils;
    const G = window.UI;

    /* 科技页折叠状态：era[时代]=是否展开，done[时代]=「已完成」块是否展开，tech[科技]=是否展开完整卡片 */
    const fold = { era: {}, done: {}, tech: {} };

    /* ---------------- 科技 ---------------- */
    function techCard(name, opts) {
        opts = opts || {};
        const s = GameState;
        const cfg = TECHS_CONFIG[name];
        const t = s.techs[name];
        const available = ProductionEngine.techAvailable(s, name);
        const affordable = ResourcesManager.canAfford(cfg.cost);
        const capBlocked = Object.keys(cfg.cost).some(k => !RESOURCES_CONFIG[k].prestige && cfg.cost[k] > s.resources[k].cap);
        const queued = window.QueueEngine ? QueueEngine.queuedCount(s, 'tech', name) > 0 : false;
        const queueFull = window.QueueEngine ? QueueEngine.isFull(s) : false;

        let cls = 'card';
        if (t.researched) cls += ' researched';
        else if (!available) cls += ' locked';
        else if (affordable) cls += ' affordable';

        /* 整张科技卡就是「研究」按钮；在「已完成」块里展开时，整卡变成「收起」 */
        const clickable = opts.inDone ? true : (available && !t.researched && !queued);
        const act = opts.inDone ? ('expandTech|' + G.esc(name)) : (clickable ? ('research|' + G.esc(name)) : '');
        let html = '<div class="' + cls + (clickable ? ' clickable' : '') + '"' +
            (act ? ' data-act="' + act + '"' : '') + ' data-tip="tech|' + G.esc(name) + '">';
        html += '<div class="card-head"><div class="card-name">' + (t.researched ? '✅ ' : '') + G.esc(name) +
            '<span class="tag">第' + cfg.era + '时代</span>' +
            (queued ? '<span class="tag queue">排队中</span>' : '') + '</div>';
        if (!t.researched) html += '<div class="card-count" style="font-size:.8rem">' + (available ? (affordable ? '可研究' : '资源不足') : '前置未完成') + '</div>';
        html += '</div>';

        const unlocks = BUILDINGS_ORDER.filter(n => BUILDINGS_CONFIG[n].tech === name);
        if (unlocks.length) {
            html += '<div class="card-stats"><div class="row"><span class="k">解锁</span><span class="v">' +
                unlocks.map(G.esc).join('、') + '</span></div></div>';
        }
        const effs = G.effectLines(cfg.effect);
        if (effs.length) {
            html += '<div class="card-stats">' + effs.map(e => '<div class="row"><span class="k">效果</span><span class="v pos">' + G.esc(e) + '</span></div>').join('') + '</div>';
        }
        html += '<div class="card-desc">' + G.esc(cfg.desc) + '</div>';

        if (cfg.prereq.length) {
            html += '<div class="hint">前置：' + cfg.prereq.map(p =>
                '<span class="' + (s.techs[p].researched ? 'pos' : 'neg') + '">' + G.esc(p) + '</span>').join('、') + '</div>';
        }
        if (!t.researched) {
            html += '<div class="price">' + G.costHtml(cfg.cost) + '</div>';
            if (capBlocked) html += '<div class="hint neg">所需资源超过当前上限，需要建造仓库类建筑提升上限。</div>';
            const techBlocked = !available || queued || (!affordable && queueFull);
            const techLabel = queued ? '排队中…'
                : (!available ? '前置未完成' : (affordable ? '研究' : (queueFull ? '队列已满' : '排队研究')));
            html += '<div class="card-actions"><button class="btn primary wide-action" data-act="research|' + G.esc(name) + '"' +
                (techBlocked ? ' disabled' : '') + '>' + techLabel + '</button></div>';
            html += '<div class="card-tip"><span>' + (queued ? '已在队列中等待材料，可在右侧队列面板取消'
                : (!available ? '前置科技尚未完成'
                    : (affordable ? '点击卡片任意处即可研究' : '材料不足：点击会排队，材料凑齐就自动完成'))) + '</span><span></span></div>';
        } else {
            html += '<div class="card-tip"><span>' + (opts.inDone ? '点击卡片任意处可收起详情' : '已完成研究') + '</span><span>✅</span></div>';
        }
        html += '</div>';
        return html;
    }

    function renderTechs() {
        const s = GameState;
        const visible = TECHS_ORDER.filter(n => s.techs[n].visible);
        let html = '<div class="tab-intro">魔法知识（📖）是研究的主要消耗，它由藏书阁、咒法学院等建筑产出，并由它们提供知识上限。</div>';

        const byEra = {};
        for (const n of visible) {
            const e = String(TECHS_CONFIG[n].era);
            (byEra[e] = byEra[e] || []).push(n);
        }
        for (const era of Object.keys(byEra).sort((a, b) => a - b)) {
            const names = byEra[era];
            const eraInfo = ERAS.find(x => x.id === Number(era)) || { name: '第' + era + '时代', motto: '' };
            const doneNames = names.filter(n => s.techs[n].researched);
            const todoNames = names.filter(n => !s.techs[n].researched);
            const allDone = doneNames.length === names.length;
            const expanded = fold.era[era] === undefined ? !allDone : fold.era[era];

            html += '<div class="era-head' + (allDone ? ' complete' : '') + '" data-act="foldEra|' + era + '">';
            html += '<span class="fold-arrow">' + (expanded ? '▾' : '▸') + '</span>';
            html += '<span class="era-name">' + G.esc(eraInfo.name) + '</span>';
            html += '<span class="era-progress">' + doneNames.length + ' / ' + names.length + ' 项已完成</span>';
            if (allDone) html += '<span class="tag">已全部完成</span>';
            else if (todoNames.length) html += '<span class="tag">待研究 ' + todoNames.length + '</span>';
            html += '<span class="era-motto">' + G.esc(eraInfo.motto) + '</span>';
            html += '</div>';

            if (!expanded) continue;

            if (todoNames.length) {
                html += '<div class="card-grid">' + todoNames.map(techCard).join('') + '</div>';
            }
            if (doneNames.length) {
                const doneOpen = !!fold.done[era];
                html += '<div class="done-block">';
                html += '<div class="done-head" data-act="foldDone|' + era + '">' +
                    '<span class="fold-arrow">' + (doneOpen ? '▾' : '▸') + '</span>' +
                    '<span>已完成 ' + doneNames.length + ' 项</span>' +
                    '<span class="right">' + (doneOpen ? '点击收起' : '点击展开查看详情') + '</span></div>';
                if (doneOpen) {
                    html += '<div class="done-list">' + doneNames.map(n => {
                        if (fold.tech[n]) return techCard(n, { inDone: true });
                        return doneRow(n);
                    }).join('') + '</div>';
                }
                html += '</div>';
            }
        }
        return html;
    }

    /* 已研究科技的紧凑一行（点击展开为完整卡片） */
    function doneRow(name) {
        const cfg = TECHS_CONFIG[name];
        const unlocks = BUILDINGS_ORDER.filter(n => BUILDINGS_CONFIG[n].tech === name);
        const effs = G.effectLines(cfg.effect);
        const meta = [];
        if (unlocks.length) meta.push('解锁 ' + unlocks.join('、'));
        if (effs.length) meta.push(effs.join('；'));
        return '<div class="tech-done-row" data-act="expandTech|' + G.esc(name) + '">' +
            '<span class="fold-arrow">▸</span>' +
            '<span class="nm">✅ ' + G.esc(name) + '</span>' +
            '<span class="meta">' + G.esc(meta.join(' · ')) + '</span></div>';
    }

    /* 折叠状态（仅界面记忆，不写入存档） */
    function toggleEra(era) {
        const names = TECHS_ORDER.filter(n => String(TECHS_CONFIG[n].era) === String(era) && GameState.techs[n].visible);
        const doneCount = names.filter(n => GameState.techs[n].researched).length;
        const allDone = names.length > 0 && doneCount === names.length;
        const expanded = fold.era[era] === undefined ? !allDone : fold.era[era];
        fold.era[era] = !expanded;
    }
    function toggleDone(era) { fold.done[era] = !fold.done[era]; }
    function toggleTechDetail(name) { fold.tech[name] = !fold.tech[name]; }

    /* ---------------- 升级 ---------------- */
    function upgradeCard(name) {
        const s = GameState;
        const cfg = UPGRADES_CONFIG[name];
        const u = s.upgrades[name];
        const price = ProductionEngine.upgradePrice(s, name);
        const affordable = ResourcesManager.canAfford(price);
        const maxed = u.level >= cfg.cap;
        const queued = window.QueueEngine ? QueueEngine.queuedCount(s, 'upgrade', name) > 0 : false;
        const queueFull = window.QueueEngine ? QueueEngine.isFull(s) : false;
        let cls = 'card' + (affordable && !maxed ? ' affordable' : '') + (u.level > 0 ? ' researched' : '');
        const blocked = !maxed && !affordable && queueFull;
        const clickable = !maxed && !blocked;
        let html = '<div class="' + cls + (clickable ? ' clickable' : '') + '"' +
            (clickable ? ' data-act="upgrade|' + G.esc(name) + '"' : '') + ' data-tip="upgrade|' + G.esc(name) + '">';
        html += '<div class="card-head"><div class="card-name">' + G.esc(name) + '</div>' +
            '<div class="card-count">Lv.' + u.level + '<small> / ' + cfg.cap + '</small></div></div>';
        if (queued) html += '<div class="hint pos">队列中有 ' + QueueEngine.queuedCount(s, 'upgrade', name) + ' 级排队等待材料' +
            '（可在右侧队列面板取消）。</div>';
        const effs = G.effectLines(cfg.effect);
        html += '<div class="card-stats">' + effs.map(e =>
            '<div class="row"><span class="k">每级</span><span class="v pos">' + G.esc(e) + '</span></div>' +
            (u.level ? '<div class="row"><span class="k">当前累计</span><span class="v">' + G.esc(e.replace(/([\d.]+)%/, (m, p) => (Number(p) * u.level).toFixed(1) + '%')) + '</span></div>' : '')
        ).join('') + '</div>';
        html += '<div class="card-desc">' + G.esc(cfg.desc) + '</div>';
        if (!maxed) {
            html += '<div class="price">' + G.priceHtml(price) + '</div>';
            html += '<div class="card-actions"><button class="btn primary wide-action" data-act="upgrade|' + G.esc(name) + '"' +
                (blocked ? ' disabled' : '') + '>' + (blocked ? '队列已满' : (affordable ? '升级' : '排队等材料')) + '</button></div>';
            html += '<div class="card-tip"><span>' + (affordable ? '点击卡片任意处即可升级' : '材料不足：点击会排队，材料凑齐就自动完成') + '</span><span></span></div>';
        } else {
            html += '<div class="hint pos">已达到等级上限。</div>';
        }
        html += '</div>';
        return html;
    }

    function renderUpgrades() {
        const s = GameState;
        const names = UPGRADES_ORDER.filter(n => s.upgrades[n].visible);
        if (!names.length) return '<div class="hint">还没有可用的升级。研究「石斧」等科技后会出现。</div>';
        return '<div class="card-grid">' + names.map(upgradeCard).join('') + '</div>';
    }

    window.TabResearch = {
        renderTechs, renderUpgrades,
        fold, toggleEra, toggleDone, toggleTechDetail,
    };
})();

</script>
<script>
/* ===== js/ui/tab-ascend.js ===== */
/* 国策标签页 + 传承（重置）标签页 */
(function () {
    const U = window.Utils;
    const G = window.UI;
    const permTree = { current: 'relic' };

    /* 该项传承是否已经可以出现（依赖的系统必须先解锁） */
    function isPermVisible(name) { return Actions.permVisible(GameState, name); }

    /* ---------------- 国策 ---------------- */
    function policyCard(name) {
        const s = GameState;
        const cfg = POLICIES_CONFIG[name];
        const p = s.policies[name];
        const eff = cfg.get(p.value) || {};
        const lines = G.effectLines(eff);
        const points = Math.floor(s.resources['政策点'].amount);
        let html = '<div class="policy">';
        html += '<div class="row-between"><h3>' + G.esc(name) + '</h3><span class="hint">每点消耗 ' + cfg.cost + ' 政策点</span></div>';
        html += '<p>' + G.esc(cfg.desc) + '</p>';
        html += '<div class="policy-row">';
        html += '<input type="range" min="' + cfg.min + '" max="' + cfg.max + '" step="' + cfg.step + '" value="' + p.value +
            '" data-policy="' + G.esc(name) + '">';
        html += '<span class="policy-val" id="policy-val-' + G.esc(name) + '">' + p.value + cfg.unit + '</span>';
        html += '</div>';
        html += '<div class="btn-row mt6">';
        html += '<button class="btn tiny" data-act="policy|' + G.esc(name) + '|' + cfg.min + '">最低</button>';
        html += '<button class="btn tiny" data-act="policy|' + G.esc(name) + '|' + cfg.def + '">默认</button>';
        html += '<button class="btn tiny" data-act="policy|' + G.esc(name) + '|' + cfg.max + '">最高</button>';
        html += '<span class="hint">当前政策点 ' + points + '</span>';
        html += '</div>';
        if (lines.length) {
            html += '<div class="card-stats mt6">' + lines.map(e => '<div class="row"><span class="k">效果</span><span class="v">' + G.esc(e) + '</span></div>').join('') + '</div>';
        }
        html += '</div>';
        return html;
    }

    function renderPolicies() {
        const s = GameState;
        const names = POLICIES_ORDER.filter(n => s.policies[n].visible);
        let html = '<div class="tab-intro">国策是双刃剑：提高一项收益往往要付出另一项代价。调整滑杆会消耗 <b>政策点</b>' +
            '（1 点 / 每单位 × 0.5 × 权重），政策点由「奥术议院」产出。</div>';
        if (!names.length) return html + '<div class="hint">还没有可以调整的国策。研究「铸币学」后解锁第一条税收政策。</div>';
        html += '<div class="hint" style="margin-bottom:8px">当前政策点：<b>' + Math.floor(s.resources['政策点'].amount) + ' / ' + U.fmtNum(s.resources['政策点'].cap) + '</b></div>';
        return html + names.map(policyCard).join('');
    }

    /* ---------------- 传承 ---------------- */
    const RESET_INFO = {
        relic: {
            title: '时空回响', type: 'relic',
            desc: '把整条时间线折叠起来重新展开。清空资源、建筑、科技与升级，' +
                '但保留传承资源、传承强化、成就、试炼进度与（在解锁后）秘宝。',
            gainText: s => '获得 <b>' + U.fmtInt(Actions.relicGain(s)) + '</b> 奥术遗物',
            need: s => s.resources['魔法知识'].cap >= 200 ? null : '需要魔法知识上限达到 200（当前 ' + U.fmtNum(s.resources['魔法知识'].cap) + '）',
        },
        star: {
            title: '星辰升华', type: 'star',
            desc: '把整座城市的存在形式升华为星光。比时空回响更彻底，同时获得大量遗物与星辉。',
            gainText: s => '获得 <b>' + U.fmtInt(Actions.relicGain(s) * 2) + '</b> 奥术遗物与 <b>' + U.fmtInt(Actions.starGain(s)) + '</b> 星辉',
            need: s => ResourcesManager.amount('奥术遗物') >= 300 ? null : '需要持有 300 枚奥术遗物（当前 ' + U.fmtNum(ResourcesManager.amount('奥术遗物')) + '）',
        },
        core: {
            title: '原初归寂', type: 'core',
            desc: '让世界回到被书写之前的空白。最深的一层重置，产出原初之核。',
            gainText: s => '获得 <b>' + U.fmtInt(Actions.coreGain(s)) + '</b> 原初之核、<b>' + U.fmtInt(Actions.starGain(s) * 1.5) +
                '</b> 星辉与 <b>' + U.fmtInt(Actions.relicGain(s) * 5) + '</b> 奥术遗物',
            need: s => ResourcesManager.amount('星辉') >= 60 ? null : '需要持有 60 枚星辉（当前 ' + U.fmtNum(ResourcesManager.amount('星辉')) + '）',
        },
    };

    function resetCard(key) {
        const s = GameState;
        const info = RESET_INFO[key];
        const need = info.need(s);
        let html = '<div class="reset-card">';
        html += '<h3>' + info.title + '</h3>';
        html += '<p>' + info.desc + '</p>';
        html += '<div class="reset-gain">' + info.gainText(s) + '</div>';
        if (need) html += '<div class="hint neg">' + G.esc(need) + '</div>';
        html += '<div class="card-actions"><button class="btn tiny gold" data-act="prestige|' + key + '"' + (need ? ' disabled' : '') + '>执行</button></div>';
        html += '</div>';
        return html;
    }

    function permCard(name) {
        const s = GameState;
        const cfg = PERMANENT_CONFIG[name];
        const p = s.permanent[name];
        const cost = Actions.permanentCost(s, name);
        const maxed = p.level >= cfg.max;
        const affordable = ResourcesManager.amount(cost.res) >= cost.amount;
        const reqBlocked = cfg.req && s.permanent[cfg.req] && !s.permanent[cfg.req].level;
        let cls = 'card' + (maxed ? ' researched' : (affordable && !reqBlocked ? ' affordable' : ''));
        const clickable = !maxed && !reqBlocked;
        let html = '<div class="' + cls + (clickable ? ' clickable' : '') + '"' +
            (clickable ? ' data-act="perm|' + G.esc(name) + '"' : '') + ' data-tip="perm|' + G.esc(name) + '">';
        html += '<div class="card-head"><div class="card-name">' + G.esc(name) + '</div>' +
            '<div class="perm-level">Lv.' + p.level + ' / ' + cfg.max + '</div></div>';
        const effs = G.effectLines(cfg.effect);
        if (effs.length) html += '<div class="card-stats">' + effs.map(e =>
            '<div class="row"><span class="k">每级</span><span class="v pos">' + G.esc(e) + '</span></div>').join('') + '</div>';
        html += '<div class="card-desc">' + G.esc(cfg.desc) + '</div>';
        if (reqBlocked) html += '<div class="hint neg">需要先解锁「' + G.esc(cfg.req) + '」。</div>';
        else if (maxed) html += '<div class="hint pos">已满级。</div>';
        else html += '<div class="price"><span class="' + (affordable ? '' : 'lack') + '">' + U.fmtInt(cost.amount) + ' ' + cost.res + '</span></div>';
        html += '<div class="card-actions"><button class="btn gold wide-action" data-act="perm|' + G.esc(name) + '"' +
            (!maxed && !reqBlocked ? '' : ' disabled') + '>强化</button></div>';
        if (clickable) html += '<div class="card-tip"><span>点击卡片任意处即可强化</span><span></span></div>';
        html += '</div>';
        return html;
    }

    function challengeRow(cfg) {
        const s = GameState;
        const st = s.challenges[cfg.id];
        let html = '<div class="card' + (st.active ? ' affordable' : '') + (st.completed ? ' researched' : '') + '" data-tip="challenge|' + G.esc(cfg.id) + '">';
        html += '<div class="card-head"><div class="card-name">⚔️ ' + G.esc(cfg.id) +
            '<span class="tag">' + '★'.repeat(cfg.star) + '</span></div>' +
            '<div class="card-count" style="font-size:.78rem">' + (st.completed ? '已完成' : (st.active ? '进行中' : '未激活')) + '</div></div>';
        html += '<div class="card-desc">' + G.esc(cfg.desc) + '</div>';
        html += '<div class="hint">完成方式：' + (cfg.requireReset === 'any' ? '任意重置' : (cfg.requireReset === 'star' ? '星辰升华' : '原初归寂')) +
            '　奖励：<span class="pos">' + G.esc(cfg.rewardText) + '</span></div>';
        html += '<div class="card-actions"><button class="btn tiny' + (st.active ? ' active' : '') + '" data-act="challenge|' + G.esc(cfg.id) + '">' +
            (st.active ? '取消激活' : '激活试炼') + '</button></div>';
        html += '</div>';
        return html;
    }

    function renderAscend() {
        const s = GameState;
        let html = '<div class="tab-intro">重置会清空这一轮的所有建设，但把进度压缩成 <b>传承资源</b>：' +
            '奥术遗物、星辉与原初之核。用它们购买永久强化，下一轮会快得多。</div>';

        html += '<div class="section-title">重置方式</div>';
        html += resetCard('relic') + resetCard('star') + resetCard('core');

        html += '<div class="section-title">传承强化</div>';
        html += '<div class="perm-tabs">';
        const trees = [['relic', '🏛️ 奥术遗物', '奥术遗物'], ['star', '⭐ 星辉', '星辉'], ['core', '🌑 原初之核', '原初之核']];
        for (const [key, label, res] of trees) {
            html += '<button class="btn tiny' + (permTree.current === key ? ' active' : '') + '" data-act="permtree|' + key + '">' +
                label + '（' + U.fmtNum(ResourcesManager.amount(res)) + '）</button>';
        }
        html += '</div>';
        /* 依赖的系统还没解锁时，对应的传承项不显示（例如没研究「召唤法阵」就不出现英雄类强化） */
        const locked = PERMANENT_ORDER.filter(n => PERMANENT_CONFIG[n].tree === permTree.current).length -
            PERMANENT_ORDER.filter(n => PERMANENT_CONFIG[n].tree === permTree.current && isPermVisible(n)).length;
        const names = PERMANENT_ORDER.filter(n => PERMANENT_CONFIG[n].tree === permTree.current && isPermVisible(n));
        html += '<div class="card-grid">' + names.map(permCard).join('') + '</div>';
        if (locked > 0) {
            html += '<div class="hint mt6">还有 <b>' + locked + '</b> 项强化会在解锁对应系统后出现：' +
                '英雄类需要先研究「召唤法阵」，远征与秘宝类需要先研究「城防」。</div>';
        }

        html += '<div class="section-title">试炼</div>';
        html += '<div class="hint" style="margin-bottom:8px">激活试炼会立刻施加严苛的限制，' +
            '但只要在对应的重置中坚持到底，就能永久获得奖励。当前激活星级：<b>' + Actions.activeStars(s) +
            '</b>（每点星级让本次重置收获 +5%）。</div>';
        html += '<div class="card-grid wide">' + CHALLENGES_CONFIG.map(challengeRow).join('') + '</div>';
        return html;
    }

    window.TabAscend = {
        renderPolicies, renderAscend, permTree,
        isPermVisible,
    };
})();

</script>
<script>
/* ===== js/ui/tab-world.js ===== */
/* 贸易 / 远征 / 成就 标签页 */
(function () {
    const U = window.Utils;
    const G = window.UI;

    /* ---------------- 贸易 ---------------- */
    function marketRow(res) {
        const s = GameState;
        const cfg = RESOURCES_CONFIG[res];
        const m = s.market.resources[res];
        if (!m || !s.resources[res].visible) return '';
        const heat = s.market.heat[res] || 1;
        const price = cfg.value * heat;
        const rate = (s.market.lastRates || {})[res] || 0;
        const vol = s.market.volume || 0;
        const batch = vol / price;
        let html = '<div class="card" data-tip="market|' + G.esc(res) + '">';
        html += '<div class="card-head"><div class="card-name">' + cfg.icon + ' ' + G.esc(res) + '</div>' +
            '<div class="card-count" style="font-size:.78rem">' + U.fmtNum(price) + '<small> 金/单位</small></div></div>';
        html += '<div class="card-stats">';
        html += '<div class="row"><span class="k">存量</span><span class="v">' + U.fmtNum(s.resources[res].amount) + ' / ' + U.fmtNum(s.resources[res].cap) + '</span></div>';
        html += '<div class="row"><span class="k">价格热度</span><span class="v ' + (heat > 1.05 ? 'neg' : (heat < 0.95 ? 'pos' : 'neu')) + '">' + heat.toFixed(2) + '×</span></div>';
        html += '<div class="row"><span class="k">当前流量</span><span class="v ' + G.rateClass(rate) + '">' + G.rate(rate) + ' / 日</span></div>';
        html += '<div class="row"><span class="k">单批交易量</span><span class="v">' + U.fmtNum(batch) + '</span></div>';
        html += '</div>';
        html += '<div class="btn-row">';
        html += '<button class="btn tiny' + (m.mode === 'off' ? ' active' : '') + '" data-act="market|' + G.esc(res) + '|off">关</button>';
        html += '<button class="btn tiny' + (m.mode === 'buy' ? ' active' : '') + '" data-act="market|' + G.esc(res) + '|buy">持续买入</button>';
        html += '<button class="btn tiny' + (m.mode === 'sell' ? ' active' : '') + '" data-act="market|' + G.esc(res) + '|sell">持续卖出</button>';
        html += '</div>';
        if (m.mode !== 'off') {
            html += '<div class="policy-row mt6"><span class="hint">规模</span>' +
                '<input type="range" min="1" max="10" step="1" value="' + m.level + '" data-marketlvl="' + G.esc(res) + '">' +
                '<span class="hint">' + m.level + '/10</span></div>';
        }
        html += '<div class="btn-row mt6">';
        html += '<button class="btn tiny" data-act="trade|' + G.esc(res) + '|buy">买入一批</button>';
        html += '<button class="btn tiny" data-act="trade|' + G.esc(res) + '|sell">卖出一批</button>';
        html += '</div>';
        html += '</div>';
        return html;
    }

    function renderMarket() {
        const s = GameState;
        const markets = s.buildings['集市'].active || 0;
        let html = '<div class="tab-intro">集市决定 <b>贸易规模</b>：规模越大，每批交易量越高。' +
            '持续买入会推高热度（价格上升），持续卖出会压低热度；没有交易时热度会缓慢回到 1。' +
            '卖出价格为买入价的 80%。</div>';
        html += '<div class="card-stats" style="margin-bottom:10px">';
        html += '<div class="row"><span class="k">启用集市</span><span class="v">' + Math.round(markets) + ' 座</span></div>';
        html += '<div class="row"><span class="k">贸易规模</span><span class="v">' + U.fmtNum(s.market.volume) + ' 黄金/日</span></div>';
        html += '<div class="row"><span class="k">黄金结算</span><span class="v ' + G.rateClass(s.market.lastGoldFlow || 0) + '">' + G.rate(s.market.lastGoldFlow || 0) + ' / 日</span></div>';
        html += '</div>';
        if (!markets) return html + '<div class="hint">还没有集市：研究「贸易学」并建造第一座集市后即可开启贸易。</div>';
        const rows = Object.keys(RESOURCES_CONFIG).filter(r => s.resources[r].visible && s.market.resources[r]).map(marketRow).join('');
        return html + '<div class="card-grid wide">' + rows + '</div>';
    }

    /* ---------------- 远征 ---------------- */
    function regionCard(region) {
        const s = GameState;
        const power = s.localResources.power.amount * (1 + EffectsManager.additive(s, 'expeditionPower'));
        const chance = ExpeditionEngine.successChance(s, region);
        const check = ExpeditionEngine.canStart(s, region);
        const busy = !!s.expedition.active;
        const weak = power < region.power * 0.5;
        let cls = 'card' + (check.ok && !weak ? ' affordable' : '') + (busy ? ' disabled' : '');
        let html = '<div class="' + cls + '" data-tip="exp|' + G.esc(region.name) + '">';
        html += '<div class="card-head"><div class="card-name">' + G.esc(region.name) +
            '<span class="tag">第' + region.tier + '层</span></div><div class="card-count" style="font-size:.78rem">' + U.fmtPct(chance) + '</div></div>';
        html += '<div class="card-desc">' + G.esc(region.desc) + '</div>';
        html += '<div class="card-stats">';
        html += '<div class="row"><span class="k">建议军力</span><span class="v ' + (power >= region.power ? 'pos' : 'neg') + '">' + U.fmtInt(region.power) + '</span></div>';
        html += '<div class="row"><span class="k">耗时</span><span class="v">' + region.days + ' 日</span></div>';
        html += '<div class="row"><span class="k">秘宝概率</span><span class="v">' + U.fmtPct(region.artifact) + '</span></div>';
        html += '</div>';
        html += '<div class="price">出发消耗：' + G.costHtml(region.cost) + '</div>';
        if (weak) html += '<div class="hint neg">军力远低于建议值，成功率很低。</div>';
        html += '<div class="card-actions"><button class="btn tiny primary" data-act="exp|' + G.esc(region.name) + '"' +
            (check.ok && !busy ? '' : ' disabled') + '>出发</button></div>';
        html += '</div>';
        return html;
    }

    function artifactCard(art, slot) {
        let html = '<div class="artifact' + (art.fragile ? ' fragile' : '') + '" data-tip="artifact|' + G.esc(art.id) + '">';
        html += '<div class="an"><span>' + G.esc(art.name) + '</span><span>' + (art.fragile ? '💔' : '💠') + '</span></div>';
        for (const line of Artifacts.describe(art.effects)) {
            html += '<div class="eff"><span>' + G.esc(line.split(' ')[0]) + '</span><span>' + G.esc(line.split(' ').slice(1).join(' ')) + '</span></div>';
        }
        html += '<div class="btn-row mt6">';
        if (slot === undefined) {
            html += '<button class="btn tiny primary" data-act="equip|' + G.esc(art.id) + '">装备</button>';
            html += '<button class="btn tiny danger" data-act="discard|' + G.esc(art.id) + '">丢弃</button>';
        } else {
            html += '<button class="btn tiny" data-act="unequip|' + slot + '">卸下</button>';
        }
        html += '</div></div>';
        return html;
    }

    function renderExpedition() {
        const s = GameState;
        const power = s.localResources.power.amount * (1 + EffectsManager.additive(s, 'expeditionPower'));
        let html = '<div class="tab-intro">派遣远征队探索大崩坏留下的遗迹：消耗物资、耗时若干游戏日，' +
            '按 <b>军力</b> 判定成败。成功可以带回稀有材料、奥术遗物，以及带随机词条的 <b>秘宝</b>。</div>';
        html += '<div class="card-stats" style="margin-bottom:10px">';
        html += '<div class="row"><span class="k">当前军力</span><span class="v pos">' + U.fmtInt(power) + '</span></div>';
        html += '<div class="row"><span class="k">已完成远征</span><span class="v">' + s.stats.expeditions + ' 次（失败 ' + s.stats.expeditionsFailed + '）</span></div>';
        html += '<div class="row"><span class="k">装备槽</span><span class="v">' + s.artifacts.equipped.filter(Boolean).length + ' / ' + Artifacts.artifactSlots(s) + '</span></div>';
        html += '</div>';

        /* 秘宝 */
        html += '<div class="section-title">秘宝</div>';
        const slots = Artifacts.artifactSlots(s);
        while (s.artifacts.equipped.length < slots) s.artifacts.equipped.push(null);
        html += '<div class="slots">';
        for (let i = 0; i < slots; i++) {
            const art = s.artifacts.equipped[i];
            html += art ? artifactCard(art, i) : '<div class="slot-empty">空置基座</div>';
        }
        html += '</div>';
        html += '<div class="hint mt6">秘宝库存 ' + s.artifacts.inventory.length + ' / 12（脆弱秘宝在重置时会碎裂）</div>';
        if (s.artifacts.inventory.length) {
            html += '<div class="card-grid wide mt6">' + s.artifacts.inventory.map(a => artifactCard(a)).join('') + '</div>';
        }

        /* 区域 */
        html += '<div class="section-title">可探索区域</div>';
        const visible = EXPEDITIONS_CONFIG.filter(r => s.stats.expeditions > 0 || r.tier <= 3 || power >= r.power * 0.3);
        html += '<div class="card-grid wide">' + visible.map(regionCard).join('') + '</div>';

        /* 日志 */
        if (s.expedition.history.length) {
            html += '<div class="section-title">远征记录</div><div class="log-list" style="max-height:220px">';
            for (const h of s.expedition.history.slice(0, 12)) {
                const loot = Object.keys(h.loot).map(k => U.fmtNum(h.loot[k]) + ' ' + k).join('、');
                html += '<div class="log-item"><span class="d">' + G.esc(U.fmtDate(h.day)) + '</span><span class="t">' +
                    (h.success ? '✅ ' : '🏳️ ') + G.esc(h.region) + '：' + G.esc(loot || '几乎一无所获') +
                    (h.artifact ? ' · 秘宝「' + G.esc(h.artifact) + '」' : '') + '</span></div>';
            }
            html += '</div>';
        }
        return html;
    }

    /* ---------------- 成就 ---------------- */
    function renderAchievements() {
        const s = GameState;
        const got = Object.keys(s.achievements).length;
        let html = '<div class="tab-intro">成就会在达成条件时自动解锁，并提供永久被动效果（重置后依然生效）。' +
            '已解锁 <b>' + got + ' / ' + ACHIEVEMENTS_CONFIG.length + '</b>。</div>';
        html += '<div class="card-grid">';
        for (const cfg of ACHIEVEMENTS_CONFIG) {
            const has = !!s.achievements[cfg.id];
            html += '<div class="card' + (has ? ' researched' : ' locked') + '">';
            html += '<div class="card-head"><div class="card-name">' + (has ? '🏆 ' : '🔒 ') + G.esc(cfg.name) + '</div></div>';
            html += '<div class="card-desc">' + G.esc(cfg.desc) + '</div>';
            if (cfg.effectText) html += '<div class="hint pos">效果：' + G.esc(cfg.effectText) + '</div>';
            html += '</div>';
        }
        html += '</div>';
        return html;
    }

    window.TabWorld = { renderMarket, renderExpedition, renderAchievements };
})();

</script>
<script>
/* ===== js/ui/tab-summon.js ===== */
/* 传送阵（英雄召唤）标签页 */
(function () {
    const U = window.Utils;
    const G = window.UI;

    const RARITY_ORDER = ['EX', 'S', 'A', 'B', 'C'];

    function rarityTag(rarity) {
        const r = HERO_RARITIES[rarity];
        return '<span class="rar" style="--rar:' + r.color + '">' + r.name + '</span>';
    }

    function effectLines(hero, awaken) {
        const mult = Heroes.awakenMultiplier(awaken || 0);
        const lines = G.effectLines(Heroes.heroEffect(hero));
        return lines.map(t => t + (mult > 1 ? '（×' + mult.toFixed(1) + '）' : ''));
    }

    function historyCard(entry) {
        const color = entry.rarity ? HERO_RARITIES[entry.rarity].color : '#6e7681';
        const label = entry.type === 'hero' ? entry.rarity : (entry.type === 'reward' ? '奖励' : '空');
        let sub = '';
        if (entry.type === 'hero') {
            if (entry.isNew) sub = '初次获得';
            else if (entry.awaken) sub = '觉醒 +1 → Lv.' + entry.awaken;
            else sub = '重复（转为遗物）';
        } else if (entry.type === 'reward') sub = '资源';
        else sub = '什么也没有';
        return '<div class="summon-item" style="--rar:' + color + '" data-tip="summon|' + G.esc(entry.name) + '">' +
            '<span class="si-rar">' + G.esc(label) + '</span>' +
            '<span class="si-name">' + G.esc(entry.name) + '</span>' +
            '<span class="si-sub">' + G.esc(sub) + '</span></div>';
    }

    function heroCard(hero) {
        const owned = GameState.heroes.owned[hero.id];
        const has = owned !== undefined;
        const r = HERO_RARITIES[hero.rarity];
        const cat = HERO_CATEGORIES[hero.category];
        let html = '<div class="hero-card ' + (has ? 'owned' : 'locked') + '" data-tip="hero|' + G.esc(hero.id) + '" style="--rar:' + r.color + '">';
        html += '<div class="hero-head"><span class="hero-rar">' + r.name + '</span>' +
            '<span class="hero-cat">' + cat.icon + ' ' + G.esc(cat.key) + '</span>' +
            (has ? '<span class="hero-awaken">觉醒 ' + owned + '</span>' : '') + '</div>';
        html += '<div class="hero-name">' + G.esc(hero.name) + '</div>';
        html += '<div class="hero-desc">' + (has ? G.esc(hero.desc) : '尚未召唤到这位英雄。') + '</div>';
        if (has) {
            html += '<div class="hero-eff">' + effectLines(hero, owned).map(t =>
                '<div class="row"><span class="k">效果</span><span class="v pos">' + G.esc(t) + '</span></div>').join('') + '</div>';
        } else {
            html += '<div class="hero-eff dim"><div class="row"><span class="k">基础效果</span><span class="v">' +
                G.esc(G.effectLines(Heroes.heroEffect(hero)).join('；')) + '</span></div></div>';
        }
        html += '</div>';
        return html;
    }

    function renderSummon() {
        const s = GameState;
        if (!s.techs['召唤法阵'] || !s.techs['召唤法阵'].researched) {
            return '<div class="tab-intro">传送阵尚未激活。研究科技「<b>召唤法阵</b>」（学院时代）后，这里会开启通往其它时间线的门。</div>';
        }
        const st = Heroes.stats(s);
        const cost1 = Heroes.pullCost(s, 1);
        const cost10 = Heroes.pullCost(s, 10);
        const can1 = ResourcesManager.canAfford(cost1);
        const can10 = ResourcesManager.canAfford(cost10);
        const luckMult = Heroes.luckMultiplier(s);
        const discount = Heroes.effectiveDiscount(s);

        let html = '<div class="tab-intro">传送阵把别处的「可能性」拉到这里：你召唤到的是其它时间线里活下来的英雄。' +
            '英雄分为 <b>C / B / A / S / EX</b> 五档，档位越高效果越强、也越难遇到；' +
            '重复召唤到同一位英雄会提升<b>觉醒等级</b>（每级效果 +' + Math.round(GACHA_CONFIG.awakeningStep * 100) + '%，最高 ' +
            GACHA_CONFIG.awakeningMax + ' 级），满觉后再抽到会转化为奥术遗物。<br>' +
            '卡池里除了英雄，还有资源馈赠与<b>空</b>（什么都没抽到）。</div>';

        /* 传送阵本体 */
        html += '<div class="summon-panel">';
        html += '<div class="summon-circle"><span>✦</span><i></i><b></b></div>';
        html += '<div class="summon-controls">';
        html += '<div class="summon-cost">单次消耗：' + G.costHtml(cost1) + '</div>';
        html += '<div class="btn-row">';
        html += '<button class="btn primary wide-action" data-act="summon|1">召唤 ×1</button>';
        html += '<button class="btn gold wide-action" data-act="summon|10">召唤 ×10（9 折）</button>';
        html += '</div>';
        html += '<div class="summon-cost">十连消耗：' + G.costHtml(cost10) + '</div>';
        html += '<div class="hint">召唤运气：S / EX 权重 ×' + luckMult.toFixed(2) + '（上限 ×' +
            (1 + GACHA_CONFIG.luckCap).toFixed(1) + '）　召唤折扣 −' + U.fmtPct(discount, 0) +
            '（上限 −' + U.fmtPct(GACHA_CONFIG.discountCap, 0) + '）　累计召唤 ' + U.fmtInt(st.pulls) + ' 次</div>';
        html += '</div></div>';

        /* 保底进度 */
        html += '<div class="section-title">保底进度</div><div class="pity-grid">';
        for (const key of ['A', 'S', 'EX']) {
            const need = GACHA_CONFIG.pity[key];
            const cur = Math.min(s.heroes.pity[key], need);
            html += '<div class="pity"><div class="row-between"><span>' + key + ' 级及以上保底</span>' +
                '<span class="hint">' + cur + ' / ' + need + '</span></div>' +
                G.bar(cur / need, key === 'EX' ? 'bad' : '') + '</div>';
        }
        html += '</div><div class="hint">达到保底后，下一次召唤必定获得对应档位以上。</div>';

        /* 最近结果 */
        html += '<div class="section-title">最近的结果</div>';
        if (!s.heroes.history.length) html += '<div class="hint">还没有召唤记录，试着拉开这道门。</div>';
        else html += '<div class="summon-log">' + s.heroes.history.slice(0, 12).map(historyCard).join('') + '</div>';

        /* 英雄殿堂 */
        html += '<div class="section-title">英雄殿堂　' + st.owned + ' / ' + st.total + '</div>';
        for (const rarity of RARITY_ORDER) {
            const list = HEROES_CONFIG.filter(h => h.rarity === rarity);
            if (!list.length) continue;
            const got = Heroes.ownedCount(s, rarity);
            html += '<div class="hero-group"><div class="hero-group-head" style="--rar:' + HERO_RARITIES[rarity].color + '">' +
                rarityTag(rarity) + '<span class="hint">' + got + ' / ' + list.length + '</span>' +
                '<span class="right hint">' + HERO_RARITIES[rarity].title + '</span></div>' +
                '<div class="card-grid">' + list.map(heroCard).join('') + '</div></div>';
        }

        /* 统计 */
        html += '<div class="section-title">召唤统计</div><div class="card-stats">';
        for (const rarity of RARITY_ORDER) {
            html += '<div class="row"><span class="k">' + HERO_RARITIES[rarity].name + ' 累计获得</span><span class="v">' +
                U.fmtInt(s.heroes.byRarity[rarity] || 0) + ' 次</span></div>';
        }
        html += '<div class="row"><span class="k">满觉重复转化遗物</span><span class="v gold">' + U.fmtInt(st.dupRelics) + '</span></div>';
        html += '</div>';
        return html;
    }

    window.TabSummon = { renderSummon, heroCard, rarityTag, effectLines };
})();

</script>
<script>
/* ===== js/ui/tab-settings.js ===== */
/* 设置标签页：存档、运行与显示、玩法速览、更新日志 */
(function () {
    const U = window.Utils;
    const G = window.UI;

    /* ---------------- 存档 ---------------- */
    function saveSection() {
        const s = GameState;
        let html = '<div class="section-title">存档</div><div class="settings-card">';
        html += '<div class="hint">进度保存在浏览器本地（约每 25 秒自动保存一次，离开页面时也会保存）。' +
            '也可以导出成一段文本自己收好，或者把导出的文本粘贴回来覆盖当前进度。</div>';
        html += '<div class="btn-row mt6">';
        html += '<button class="btn" data-act="save">💾 立即保存</button>';
        html += '<button class="btn" data-act="modal|export">📤 导出存档</button>';
        html += '<button class="btn" data-act="modal|import">📥 导入存档</button>';
        html += '</div>';
        html += '<div class="mt6" style="display:flex;gap:14px;flex-wrap:wrap">';
        html += '<label class="hint" style="cursor:pointer"><input type="checkbox" data-act="toggleAutosave"' +
            (s.settings.autosave ? ' checked' : '') + '> 启用自动保存</label>';
        html += '</div>';
        html += '<div class="section-sub">危险操作</div>';
        html += '<div class="hint">清除本地存档会彻底删除进度，包括所有传承强化、成就与英雄收藏，无法恢复。</div>';
        html += '<div class="btn-row mt6"><button class="btn danger" data-act="modal|hardreset">清除存档</button></div>';
        html += '</div>';
        return html;
    }

    /* ---------------- 运行与显示 ---------------- */
    function runSection() {
        const s = GameState;
        let html = '<div class="section-title">运行与显示</div><div class="settings-card">';
        html += '<div class="btn-row">';
        html += '<button class="btn" data-act="pause">' + (s.paused ? '▶ 继续游戏' : '⏸ 暂停游戏') + '</button>';
        html += '<button class="btn" data-act="theme">' + (s.settings.theme === 'dark' ? '☀ 切换到浅色主题' : '🌙 切换到深色主题') + '</button>';
        html += '</div>';
        const auto = [];
        if (EffectsManager.hasSpecial(s, 'autoBuild')) {
            auto.push('<label class="hint" style="cursor:pointer"><input type="checkbox" data-act="toggleAutoBuild"' +
                (s.settings.autoBuild ? ' checked' : '') + '> 自动建造：买得起就立刻建（不会把买不起的塞进队列）</label>');
        }
        if (EffectsManager.hasSpecial(s, 'autoExpedition')) {
            auto.push('<label class="hint" style="cursor:pointer"><input type="checkbox" data-act="toggleAutoExp"' +
                (s.settings.autoExpedition ? ' checked' : '') + '> 自动远征：上一支队伍归来后立刻前往同一区域</label>');
        }
        if (auto.length) html += '<div class="mt6" style="display:flex;flex-direction:column;gap:6px">' + auto.join('') + '</div>';
        html += '<div class="hint mt6">离线收益上限 ' + (2 + EffectsManager.additive(s, 'offlineHours')) + ' 小时（' +
            (EffectsManager.hasSpecial(s, 'offlinePerfect') ? '100%' : '50%') + ' 效率）。' +
            '键盘：数字键 1-9 与 0 切换标签页，空格暂停，Ctrl+S 保存。</div>';
        html += '</div>';
        return html;
    }

    /* ---------------- 玩法速览 ---------------- */
    function guideSection() {
        let html = '<div class="section-title">玩法速览</div><div class="settings-card"><ul class="guide-list">';
        html += '<li>大多数建筑需要<b>人口</b>才能运转，人口由居所提供。</li>';
        html += '<li>建筑的效率会同时受「原料短缺」与「人手不足」限制，效率又反过来影响产量与消耗。</li>';
        html += '<li>研究与建造都受资源<b>上限</b>限制，用仓库类建筑提高上限。</li>';
        html += '<li>建造 / 研究 / 升级：材料够就<b>立即完成</b>；不够时点击会<b>排队等材料</b>，右侧面板显示还要多久凑齐，凑齐的瞬间自动建成。</li>';
        html += '<li>「时空回响」等重置会清空这一轮的进度，但保留传承资源、传承强化、成就、试炼与英雄收藏。</li>';
        html += '</ul></div>';
        return html;
    }

    /* ---------------- 更新日志 ---------------- */
    function changelogSection() {
        const d = window.CHANGELOG_DATA;
        if (!d || !d.versions || !d.versions.length) {
            return '<div class="section-title">更新日志</div><div class="settings-card"><div class="hint">没有找到更新日志数据。</div></div>';
        }
        let html = '<div class="section-title">更新日志</div><div class="settings-card">';
        html += '<div class="hint">所有改动都按版本记录在这里，最新的排在最上面。完整文档见仓库里的 CHANGELOG.md。</div>';
        /* 版本总览 */
        html += '<div class="cl-overview">';
        for (const row of d.overview) {
            html += '<div class="cl-row">' +
                '<span class="cl-ver">' + G.esc(row.version) + '</span>' +
                '<span class="cl-date">' + G.esc(row.date) + '</span>' +
                '<span class="cl-type">' + G.esc(row.type) + '</span>' +
                '<span class="cl-sum">' + row.summary + '</span>' +
                '</div>';
        }
        html += '</div>';
        /* 各版本明细 */
        html += '<div class="cl-box">';
        for (const v of d.versions) {
            html += '<div class="cl-version"><div class="cl-version-head">' +
                '<span class="cl-ver">' + G.esc(v.version) + '</span>' +
                '<span class="cl-date">' + G.esc(v.date) + '</span></div>';
            for (const sec of v.sections) {
                html += '<div class="cl-section">' + G.esc(sec.title) + '</div>';
                html += '<ul class="cl-items">';
                for (const it of sec.items) html += '<li>' + it + '</li>';
                html += '</ul>';
            }
            html += '</div>';
        }
        html += '</div>';
        html += '</div>';
        return html;
    }

    function render() {
        let html = '<div class="tab-intro">这一页是存档、运行选项与更新日志。游戏内的说明与快捷入口都收在这里，' +
            '顶栏右侧的 ⚙ 也会直接跳到本页。</div>';
        html += saveSection();
        html += runSection();
        html += guideSection();
        html += changelogSection();
        return html;
    }

    window.TabSettings = { render };
})();

</script>
<script>
/* ===== js/ui/app.js ===== */
/* 界面装配：标签页调度、事件委托、渲染循环 */
(function () {
    const U = window.Utils;
    const G = window.UI;

    const TABS = [
        { id: 'buildings', name: '建筑', icon: '🏠', render: () => TabBuildings.render() },
        { id: 'techs', name: '科技', icon: '📖', render: () => TabResearch.renderTechs() },
        { id: 'upgrades', name: '升级', icon: '⚗️', render: () => TabResearch.renderUpgrades() },
        { id: 'policies', name: '国策', icon: '⚖️', render: () => TabAscend.renderPolicies() },
        { id: 'expedition', name: '远征', icon: '⚔️', render: () => TabWorld.renderExpedition() },
        { id: 'summon', name: '召唤', icon: '🔮', gate: s => s.techs['召唤法阵'] && s.techs['召唤法阵'].researched, render: () => TabSummon.renderSummon() },
        { id: 'market', name: '贸易', icon: '🪙', render: () => TabWorld.renderMarket() },
        { id: 'ascend', name: '传承', icon: '✦', render: () => TabAscend.renderAscend() },
        { id: 'achievements', name: '成就', icon: '🏆', render: () => TabWorld.renderAchievements() },
        { id: 'settings', name: '设置', icon: '⚙', render: () => TabSettings.render() },
    ];

    let activeTab = 'buildings';
    let tabBody = null;
    let pointerDown = false;        // 鼠标按下（点击 / 拖动滑杆）期间冻结重绘
    let renderQueued = false;

    /* 有解锁条件的标签页（例如「召唤」需要研究召唤法阵） */
    function visibleTabs() {
        return TABS.filter(t => !t.gate || t.gate(GameState));
    }

    /* ---------------- 标签徽标 ---------------- */
    function badges() {
        const s = GameState;
        const out = {};
        let techReady = 0;
        for (const n of TECHS_ORDER) {
            if (!s.techs[n].visible || s.techs[n].researched) continue;
            if (ProductionEngine.techAvailable(s, n) && ResourcesManager.canAfford(TECHS_CONFIG[n].cost)) techReady++;
        }
        out.techs = techReady;
        let upReady = 0;
        for (const n of UPGRADES_ORDER) {
            if (!s.upgrades[n].visible) continue;
            if (ResourcesManager.canAfford(ProductionEngine.upgradePrice(s, n))) upReady++;
        }
        out.upgrades = upReady;
        const avail = Actions.resetAvailability(s);
        out.ascend = (avail.relic ? 1 : 0) + (avail.star ? 1 : 0) + (avail.core ? 1 : 0);
        if (s.pendingEvent) out.expedition = 0;
        let regions = 0;
        for (const r of EXPEDITIONS_CONFIG) if (ExpeditionEngine.canStart(s, r).ok) regions++;
        out.expedition = regions;
        if (s.techs['召唤法阵'] && s.techs['召唤法阵'].researched && s.heroes) {
            const p = s.heroes.pity;
            const ready = (p.A >= GACHA_CONFIG.pity.A || p.S >= GACHA_CONFIG.pity.S || p.EX >= GACHA_CONFIG.pity.EX);
            out.summon = ready ? 1 : 0;
        }
        return out;
    }

    function renderTabs() {
        const b = badges();
        let html = '';
        for (const t of visibleTabs()) {
            const n = b[t.id] || 0;
            html += '<div class="tab' + (activeTab === t.id ? ' active' : '') + '" data-act="tab|' + t.id + '">' +
                '<span>' + t.icon + '</span><span>' + t.name + '</span>' +
                (n ? '<span class="badge' + (t.id === 'ascend' ? ' gold' : '') + '">' + n + '</span>' : '') + '</div>';
        }
        G.setHTML(document.getElementById('tabs'), html);
    }

    /* ---------------- 渲染 ---------------- */
    function render(force) {
        const s = GameState;
        /* 按住鼠标时不重建 DOM：否则节点会在 mousedown 与 mouseup 之间被替换，
           导致点击丢失、hover 状态被清空（按钮闪烁） */
        if (pointerDown && !force) { renderQueued = true; return; }
        renderQueued = false;

        Panels.renderHeader();
        Panels.renderPopulation();
        Panels.renderResources();
        Panels.renderEvent();
        Panels.renderExpeditionPanel();
        Panels.renderQueue();
        Panels.renderLog();
        Panels.renderStats();
        renderTabs();

        const content = document.getElementById('tab-content');
        if (!tabBody || !content.contains(tabBody)) {
            content.innerHTML = '<div id="tab-body"></div>';
            tabBody = document.getElementById('tab-body');
        }
        const tabs = visibleTabs();
        const tab = tabs.find(t => t.id === activeTab) || tabs[0];
        if (tab.id !== activeTab) activeTab = tab.id;      // 当前标签被隐藏时自动切回第一个
        G.setHTML(tabBody, tab.render());
    }

    window.UI.render = render;

    /* ---------------- 指针状态 ---------------- */
    function beginPointer() { pointerDown = true; }
    function endPointer() {
        if (!pointerDown) return;
        pointerDown = false;
        if (renderQueued) render(true);   // 松开后补一次刷新
    }
    document.addEventListener('pointerdown', e => { if (e.button === 0 || e.pointerType !== 'mouse') beginPointer(); }, true);
    window.addEventListener('pointerup', endPointer, true);
    window.addEventListener('pointercancel', endPointer, true);
    window.addEventListener('blur', endPointer);
    document.addEventListener('mouseleave', endPointer);

    /* ---------------- 提示内容分发 ---------------- */
    G.setTipProvider(key => Panels.tipHtml(key));
    G.bindTips(document.body);

    /* ---------------- 行为处理 ---------------- */
    function handleAct(act, arg1, arg2, ev, node) {
        const s = GameState;
        const res = { ok: true };
        switch (act) {
            case 'tab':
                activeTab = arg1;
                render();
                break;
            case 'filter':
                if (arg1 === '!locked') TabBuildings.filters.hideLocked = !TabBuildings.filters.hideLocked;
                else TabBuildings.filters.type = arg1;
                render();
                break;
            case 'buy':
                res.ok = false;
                res.msg = (Actions.buyBuilding(s, arg1, arg2 === 'max' ? 'max' : Number(arg2)).msg || '');
                break;
            case 'toggle':
                Actions.setBuildingActive(s, arg1, 'toggle');
                break;
            case 'mode':
                Actions.setBuildingMode(s, arg1, Number(arg2));
                break;
            case 'research':
                res.ok = false;
                res.msg = (Actions.research(s, arg1).msg || '');
                break;
            case 'upgrade':
                res.ok = false;
                res.msg = (Actions.buyUpgrade(s, arg1).msg || '');
                break;
            case 'policy': {
                const r = Actions.setPolicy(s, arg1, Number(arg2));
                if (!r.ok && r.msg) G.toast(r.msg, 'bad');
                break;
            }
            case 'market':
                TradeEngine.setMode(s, arg1, arg2);
                render();
                break;
            case 'trade': {
                const r = TradeEngine.tradeOnce(s, arg1, arg2);
                G.toast(r.msg, r.ok ? '' : 'bad');
                break;
            }
            case 'exp': {
                const r = Actions.startExpedition(s, arg1);
                G.toast(r.msg, r.ok ? 'gold' : 'bad');
                break;
            }
            case 'summon': {
                const r = Heroes.summon(s, Number(arg1) || 1);
                if (!r.ok) { G.toast(r.msg, 'bad'); break; }
                const heroes = r.results.filter(x => x.type === 'hero');
                const names = heroes.map(x => x.rarity + '·' + x.hero.name);
                G.toast('🔮 召唤 ×' + r.results.length + (names.length
                    ? '：' + names.slice(0, 4).join('、') + (names.length > 4 ? ' 等' : '')
                    : '（没有英雄回应）'), r.best === 'EX' ? 'gold' : '');
                break;
            }
            case 'queuecancel': {
                const r = QueueEngine.cancel(s, arg1);
                G.toast(r.msg || '', r.ok ? '' : 'bad');
                break;
            }
            case 'equip': {
                const r = Artifacts.equip(s, arg1);
                computeRefresh();
                G.toast(r.msg || '', r.ok ? '' : 'bad');
                break;
            }
            case 'unequip': {
                const r = Artifacts.unequip(s, Number(arg1));
                computeRefresh();
                if (r.msg) G.toast(r.msg, r.ok ? '' : 'bad');
                break;
            }
            case 'discard':
                Artifacts.discard(s, arg1);
                computeRefresh();
                G.toast('已丢弃秘宝。');
                break;
            case 'prestige':
                prestigeConfirm(arg1);
                break;
            case 'perm': {
                const r = Actions.buyPermanent(s, arg1);
                G.toast(r.msg || '', r.ok ? 'gold' : 'bad');
                break;
            }
            case 'permtree':
                TabAscend.permTree.current = arg1;
                render();
                break;
            case 'foldEra':
                TabResearch.toggleEra(arg1);
                render(true);
                break;
            case 'foldDone':
                TabResearch.toggleDone(arg1);
                render(true);
                break;
            case 'expandTech':
                TabResearch.toggleTechDetail(arg1);
                render(true);
                break;
            case 'challenge': {
                const r = Actions.toggleChallenge(s, arg1);
                G.toast(r.msg, 'gold');
                break;
            }
            case 'eventchoice': {
                const choice = EventEngine.resolve(s, Number(arg1));
                if (choice && choice.ok === false) G.toast(choice.msg, 'bad');
                else if (choice && choice.text) G.toast('你选择了：' + choice.text);
                break;
            }
            case 'save':
                G.toast(SaveEngine.save(s) ? '已保存。' : '保存失败（浏览器限制了本地存储）。', 'gold');
                break;
            case 'pause':
                s.paused = !s.paused;
                G.closeModal();
                break;
            case 'theme':
                s.settings.theme = s.settings.theme === 'dark' ? 'light' : 'dark';
                applyTheme();
                G.closeModal();
                break;
            case 'modal':
                if (arg1 === 'export') Panels.exportModal();
                else if (arg1 === 'import') Panels.importModal();
                else if (arg1 === 'hardreset') {
                    G.confirmBox('清除存档', '这会彻底删除本地存档与全部传承进度，无法恢复。确定吗？', () => SaveEngine.hardReset(), '清除存档');
                }
                break;
            case 'doimport': {
                const ta = document.querySelector('#modal-root textarea');
                const r = SaveEngine.importSave(s, ta ? ta.value : '');
                G.toast(r.msg, r.ok ? 'gold' : 'bad');
                if (r.ok) { applyTheme(); G.closeModal(); }
                break;
            }
            case 'closemodal':
                G.closeModal();
                break;
            case 'toggleAutosave':
                s.settings.autosave = !s.settings.autosave;
                break;
            case 'toggleAutoBuild':
                s.settings.autoBuild = !s.settings.autoBuild;
                break;
            case 'toggleAutoExp':
                s.settings.autoExpedition = !s.settings.autoExpedition;
                break;
            default:
                break;
        }
        if (res.msg) G.toast(res.msg, res.ok ? '' : 'bad');
        /* 除「切换标签 / 筛选 / 切换传承页」外，操作后立即重算并重绘，保证点击即时反馈 */
        if (act !== 'tab' && act !== 'filter' && act !== 'permtree' && act !== 'closemodal' &&
            act !== 'foldEra' && act !== 'foldDone' && act !== 'expandTech') computeRefresh();
    }

    function computeRefresh() {
        ProductionEngine.updatePrices(GameState);
        ProductionEngine.computeProductionAndCaps(GameState);
        render(true);
    }

    function prestigeConfirm(key) {
        const s = GameState;
        const info = {
            relic: ['时空回响', '把这条时间线折叠起来重新展开。'],
            star: ['星辰升华', '将整座城市升华为星光，得到更深一层的传承资源。'],
            core: ['原初归寂', '让世界回到被书写之前的空白。'],
        }[key];
        const gain = {
            relic: () => U.fmtInt(Actions.relicGain(s)) + ' 奥术遗物',
            star: () => U.fmtInt(Actions.relicGain(s) * 2) + ' 奥术遗物、' + U.fmtInt(Actions.starGain(s)) + ' 星辉',
            core: () => U.fmtInt(Actions.relicGain(s) * 5) + ' 奥术遗物、' + U.fmtInt(Actions.starGain(s) * 1.5) + ' 星辉、' + U.fmtInt(Actions.coreGain(s)) + ' 原初之核',
        }[key];
        const text = '<b>' + info[0] + '</b><br>' + info[1] +
            '<br><br>将获得：<b>' + gain() + '</b>' +
            '<br><br>会清空：资源、建筑、科技、升级、政策、人口。' +
            '<br>会保留：传承资源与强化、成就、试炼进度、统计数据' +
            (EffectsManager.hasSpecial(s, 'keepArtifacts') ? '、全部秘宝' : '（脆弱秘宝会碎裂）') + '。';
        G.confirmBox(info[0], text, () => {
            const r = Actions.prestige(s, key);
            G.toast(r.msg, r.ok ? 'gold' : 'bad');
            activeTab = 'buildings';
            computeRefresh();
        }, '确认执行');
    }

    /* ---------------- 事件委托 ---------------- */
    document.addEventListener('click', e => {
        const node = e.target.closest ? e.target.closest('[data-act]') : null;
        if (!node) return;
        const act = node.getAttribute('data-act');
        if (!act) return;
        if (node.tagName === 'INPUT' && node.type === 'checkbox') return;   // 交给 change
        const parts = act.split('|');
        e.preventDefault();
        handleAct(parts[0], parts[1], parts[2], e, node);
    });

    document.addEventListener('change', e => {
        const node = e.target;
        if (!node.getAttribute) return;
        const act = node.getAttribute('data-act');
        if (act && node.type === 'checkbox') {
            handleAct(act, null, null, e, node);
            return;
        }
        if (node.hasAttribute && node.hasAttribute('data-policy')) {
            const name = node.getAttribute('data-policy');
            Actions.setPolicy(GameState, name, Number(node.value));
            computeRefresh();
            return;
        }
        if (node.hasAttribute && node.hasAttribute('data-marketlvl')) {
            TradeEngine.setLevel(GameState, node.getAttribute('data-marketlvl'), Number(node.value));
            computeRefresh();
        }
    });

    document.addEventListener('input', e => {
        const node = e.target;
        if (!node.hasAttribute || !node.hasAttribute('data-policy')) return;
        const label = document.getElementById('policy-val-' + node.getAttribute('data-policy'));
        if (label) label.textContent = node.value + (POLICIES_CONFIG[node.getAttribute('data-policy')].unit || '');
    });

    /* ---------------- 主题 ---------------- */
    function applyTheme() {
        document.body.className = GameState.settings.theme === 'dark' ? 'dark-theme' : 'light-theme';
    }

    /* ---------------- 快捷键 ---------------- */
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const tabs = visibleTabs();
        /* 数字键 1-9 对应前九个标签；第 10 个（设置）用 0 */
        const idx = e.key === '0' ? 10 : Number(e.key);
        if (idx >= 1 && idx <= tabs.length && (e.key === '0' || idx <= 9)) {
            activeTab = tabs[idx - 1].id;
            render();
        }
        if (e.key === ' ') {
            GameState.paused = !GameState.paused;
            e.preventDefault();
        }
        if (e.key === 's' && (e.ctrlKey || e.metaKey)) {
            SaveEngine.save(GameState);
            G.toast('已保存。');
            e.preventDefault();
        }
    });

    /* ---------------- 欢迎 / 引导 ---------------- */
    function welcomeModal() {
        const html = '<h2>秘法余烬</h2>' +
            '<p>大崩坏那天，浮空城从天上落了下来，魔网断裂成无数碎片。你是最后一位仍然记得咒式的学徒，' +
            '面前只有一座倒塌的法师塔和一片灰烬。</p>' +
            '<h3>第一件事</h3><ul>' +
            '<li>你已经带着一点废墟里捡来的木材与石料。先在「科技」里研究 <b>拾荒</b>、<b>搭建帐篷</b>、<b>伐木技术</b>、<b>采石技术</b>。</li>' +
            '<li>然后在「建筑」里建造：<b>帐篷</b>提供人口，<b>拾荒棚 / 伐木场 / 采石场</b>提供原料。</li>' +
            '<li>人口是所有建筑的燃料，仓库决定你能囤多少——上限不够时就没法研究更贵的科技。</li>' +
            '<li>攒够 200 点「魔法知识上限」后，就可以在「传承」里执行第一次 <b>时空回响</b>，用奥术遗物买永久强化。</li>' +
            '</ul>' +
            '<p class="hint">提示：数字键 1-9 与 0 切换标签页，空格暂停，进度会自动保存在浏览器里；存档与更新日志在「设置」页。</p>' +
            '<div class="modal-actions left"><label class="hint" style="cursor:pointer">' +
            '<input type="checkbox" id="welcome-skip"> 以后不再显示</label></div>' +
            '<div class="modal-actions"><button class="btn primary" data-act="closemodal">开始重建</button></div>';
        const wrap = G.openModal(html);
        wrap.querySelector('button').addEventListener('click', () => {
            if (wrap.querySelector('#welcome-skip').checked) {
                GameState.settings.hideWelcome = true;
                SaveEngine.save(GameState);
            }
        });
    }

    window.App = { render, applyTheme, welcomeModal, TABS, get activeTab() { return activeTab; }, set activeTab(v) { activeTab = v; } };
})();

</script>

<script>
/* ===== js/main.js ===== */
/* 入口：初始化或读档 → 应用主题 → 渲染 → 启动主循环 */
(function () {
    const s = GameState;

    initState();
    const hadSave = SaveEngine.hasSave();
    let loaded = false;
    if (hadSave) {
        try { loaded = SaveEngine.load(s); } catch (e) { console.error(e); loaded = false; }
    }
    if (!loaded) {
        ProductionEngine.updatePrices(s);
        ProductionEngine.computeProductionAndCaps(s);
    }

    App.applyTheme();
    App.render();
    GameLoop.start();

    /* 首次进入：引导 */
    if (!hadSave && !s.settings.hideWelcome && location.hash !== '#skipintro') {
        setTimeout(() => App.welcomeModal(), 400);
    } else if (s.offlineReport && s.offlineReport.seconds >= 60) {
        setTimeout(() => Panels.offlineModal(), 350);
    }

    /* 离开页面时保存 */
    window.addEventListener('beforeunload', () => {
        if (s.settings.autosave) SaveEngine.save(s);
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && s.settings.autosave) SaveEngine.save(s);
    });
    window.addEventListener('error', e => {
        console.error('运行时错误', e.error || e.message);
    });
})();

</script>
</body>
</html>
